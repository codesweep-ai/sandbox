# Rebuild and publish the two tiers the per-commit images are built ON.
#
# The image is three tiers, one published package each, because they change at
# three different rates: the OS and toolchains weekly, the agent CLIs about
# every eight days, this repository four times a day. Two consecutive builds of
# the old single-file image shared NONE of their 26 layer blobs, so a commit put
# 2167.8 MB on the wire to change 25 MB — and in the two dnf layers the only
# package that had actually moved was one Bluetooth library, at 189 KB.
#
# None of that is fixable by making the build reproducible: any dnf transaction
# rewrites a 29.5 MB rpm database keyed on install timestamps, plus 1.7 MB of
# logs and a random /etc/machine-id. The fix is to stop re-running it, which is
# what this workflow is for.
#
# IT PUBLISHES BUT DOES NOT ADOPT. Nothing downstream moves until somebody edits
# image/tiers.env, because the leaf names its base by tag. What this job does is
# publish a candidate, prove it, and print the two lines to paste. A base that
# broke something is a red run here, not a red run on somebody else's commit.
#
# EVERY TIER IS MULTI-ARCH, and that is not optional. Before the split each host
# built the image from the Containerfile itself, which is what all those
# `case "$(uname -m)"` stanzas are for — so every host got its own architecture
# for free. A leaf built on a PULLED tier inherits the tier's architecture
# instead, and the first single-arch run proved what that costs: the arm64 Mac
# ran amd64 agent binaries, codex and opencode survived the emulation, and all
# four claude replay members timed out at 10.5s against 5.5s native. So each
# architecture is built on its own native runner and only combined into a
# manifest list once BOTH have booted real sandboxes.
name: base-images

on:
  schedule:
    # Mondays, 03:00 UTC. Fedora rebuilds its :44 tag DAILY at about 06:48 UTC,
    # so consuming one rebuild in seven is what bounds the churn by our schedule
    # rather than by their cron. That is also why the FROM in Containerfile.base
    # is an unpinned tag: with a weekly cadence, pinning it would only buy the
    # ability to rebuild an identical base later, and we never need to — the
    # base is published and immutable by digest, so debugging means pulling it.
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    # A change to a tier's own recipe rebuilds it now rather than next Monday.
    # The Neovim config is in this list because the base pre-builds against it
    # and the leaf refuses to ship a mismatch (see the config-hash guard): left
    # to the schedule, a config edit would block every leaf build for a week.
    paths:
      - image/Containerfile.base
      - image/Containerfile.agents
      - image/ci-slim.sh
      - image/rootfs/home/.config/nvim/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # One publisher at a time: two runs would mint two stamps and race on which
  # candidate the summary tells a human to adopt. It also keeps two runs off the
  # one self-hosted arm64 machine, which can only build for one of them.
  group: base-images
  cancel-in-progress: false

jobs:
  # Everything both architectures have to agree on, decided once.
  #
  # The tag especially: computed per-arch it would differ by however long the
  # two runners took to reach that step, and the manifest list below joins the
  # two by name.
  plan:
    name: name this run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.stamp.outputs.tag }}
      tier_base: ${{ steps.repos.outputs.tier_base }}
      tier_agents: ${{ steps.repos.outputs.tier_agents }}
      tier_slim_base: ${{ steps.repos.outputs.tier_slim_base }}
      tier_slim_agents: ${{ steps.repos.outputs.tier_slim_agents }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the module version is derived from the VCS stamp
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: build the binary that names the packages
        run: make build-go

      # A BUILD timestamp, not the commit one a product tag uses. This job runs
      # weekly whether or not anything was committed, so two runs off one commit
      # would mint one tag for two different images — Fedora moved, dnf update
      # pulled new packages — and GHCR tags are mutable, so the second would
      # silently overwrite the first. The commit is still in there, because it
      # says which Containerfile.base produced the image.
      - name: the tag this run publishes
        id: stamp
        run: |
          set -euo pipefail
          echo "tag=v0.0.0-$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Repo names come from the binary so the naming rule stays in one place;
      # the tags do not, for the reason above.
      - name: the packages this run writes
        id: repos
        run: |
          set -euo pipefail
          ./bin/cs-sandbox version --images | while read -r label ref; do
            case "$label" in tier-*) echo "${label//-/_}=$ref" >> "$GITHUB_OUTPUT" ;; esac
          done

  # One job per architecture, each on a runner of that architecture. Nothing is
  # cross-built: the shipped base compiles CPython from source through pyenv and
  # pre-installs ~900 MB of language servers through mason, and under qemu that
  # is hours rather than minutes.
  #
  # Each pushes ARCH-SUFFIXED tags and then proves them. The manifest job below
  # joins them, so an architecture that cannot boot a sandbox never reaches the
  # list image/tiers.env would name.
  tiers:
    name: ${{ matrix.arch }} tiers
    needs: plan
    strategy:
      fail-fast: false # one arch failing should still show the other's result
      matrix:
        include:
          - arch: amd64
            runner: '["ubuntu-latest"]'
          - arch: arm64
            runner: '["self-hosted", "macOS", "ARM64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    # The shipped base is the long pole and the arm64 machine has never built it
    # before — the smoke image it used to make drops every toolchain.
    timeout-minutes: 180
    env:
      TAG: ${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
      BASE: ${{ needs.plan.outputs.tier_base }}
      AGENTS: ${{ needs.plan.outputs.tier_agents }}
      SLIM_BASE: ${{ needs.plan.outputs.tier_slim_base }}
      SLIM_AGENTS: ${{ needs.plan.outputs.tier_slim_agents }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # cache: false on the self-hosted machine for the same reason the other
      # jobs on it do it — its module cache persists between jobs and Go leaves
      # it read-only, so the restore fails trying to unpack over it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: ${{ matrix.arch != 'arm64' }}

      # launchd does not order jobs relative to each other and `podman machine
      # start` takes 20-30s, so after a reboot the runner can pick up a job
      # before the VM is ready. Guard on state rather than calling start
      # blindly: start exits 125 when the machine is already running.
      - name: ensure the podman machine is up
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          if [ "$(podman machine inspect --format '{{.State}}' podman-machine-default)" != "running" ]; then
            echo "machine was down; starting it"
            podman machine start
          fi
          podman info --format '{{.Version.Version}} | {{.Host.Arch}} | rootless={{.Host.Security.Rootless}}'

      # The architecture this runner actually builds for, checked rather than
      # assumed. On the Mac it is the podman MACHINE's architecture that decides,
      # not the host's, and a machine restored from the wrong image would publish
      # amd64 under an arm64 tag — which is exactly the failure this whole job
      # layout exists to prevent, only harder to see.
      - name: confirm the runner's architecture
        run: |
          set -euo pipefail
          got=$(podman info --format '{{.Host.Arch}}')
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "this runner builds $got images, but it is the ${{ matrix.arch }} leg" >&2
            exit 1
          }
          echo "building $got tiers as $TAG"

      - name: build the binary
        run: make build-go

      - name: log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      # podman directly rather than through `cs-sandbox build`: publishing a
      # tier is not something a developer does, and the command's job is to
      # build the LEAF on tiers a human has already adopted. What it needs from
      # us is one build arg per tier — BUILD_VERBOSE for the Neovim pre-build,
      # BASE_REF for the tier below.
      - name: build and push the shipped tiers
        run: |
          set -euo pipefail
          df -h / | tail -1
          podman build -q -t "$BASE:$TAG" -f image/Containerfile.base --build-arg BUILD_VERBOSE=0 image/rootfs
          podman push "$BASE:$TAG"
          podman build -q -t "$AGENTS:$TAG" -f image/Containerfile.agents --build-arg BASE_REF="$BASE:$TAG" image/rootfs
          podman push "$AGENTS:$TAG"
          df -h / | tail -1

      - name: build and push the CI tiers
        run: |
          set -euo pipefail
          ./image/ci-slim.sh base   > /tmp/Containerfile.base.ci
          ./image/ci-slim.sh agents > /tmp/Containerfile.agents.ci
          podman build -q -t "$SLIM_BASE:$TAG" -f /tmp/Containerfile.base.ci --build-arg BUILD_VERBOSE=0 image/rootfs
          podman push "$SLIM_BASE:$TAG"
          podman build -q -t "$SLIM_AGENTS:$TAG" -f /tmp/Containerfile.agents.ci --build-arg BASE_REF="$SLIM_BASE:$TAG" image/rootfs
          podman push "$SLIM_AGENTS:$TAG"

      # Adopt this architecture's candidate IN THE WORKING TREE ONLY, so
      # everything below builds and tests exactly what a human would get after
      # pasting. Not committed: the point of the pin is that adopting it is
      # somebody's decision.
      - name: adopt the candidate locally
        run: |
          set -euo pipefail
          sed -i.bak "s|^AGENTS_REF=.*|AGENTS_REF=$AGENTS:$TAG|" image/tiers.env
          sed -i.bak "s|^SLIM_AGENTS_REF=.*|SLIM_AGENTS_REF=$SLIM_AGENTS:$TAG|" image/tiers.env
          rm -f image/tiers.env.bak
          grep -v '^#' image/tiers.env

      # The gate, and it runs on BOTH architectures deliberately. The single-arch
      # version of this workflow was green here and still shipped an image whose
      # agents could not answer on arm64.
      - name: smoke the candidate
        run: make test-smoke

      # The shipped tiers get a readback rather than the suite: the live tests
      # boot the slim image, so nothing above has touched the toolchains, and
      # those are the part of the base that is not reproducible — pyenv compiles
      # CPython from source and the Neovim pre-build fetches its language
      # servers live, so a rebuild can differ in ways nobody asked for.
      - name: read back the shipped image
        run: |
          set -euo pipefail
          CS_SANDBOX_IMAGE=localhost/sandbox:candidate ./bin/cs-sandbox build --engine podman
          podman run --rm --entrypoint sh localhost/sandbox:candidate -c '
            set -e
            for t in claude codex opencode go node nvim python3 java mvn tmux cs-sandbox cs-lint; do
              command -v "$t" >/dev/null || { echo "missing from the candidate image: $t" >&2; exit 1; }
            done
            n=$(ls /sandbox/home/.local/share/nvim/lazy | wc -l)
            [ "$n" -ge 20 ] || { echo "the Neovim pre-build produced only $n plugins" >&2; exit 1; }
            echo "readback ok: $n nvim plugins, every toolchain and agent on PATH"'

  # Join the per-architecture tags into one manifest list per package, under the
  # bare tag image/tiers.env names. `needs: tiers` is what makes the list mean
  # something: every architecture in it has booted a real sandbox and run an
  # agent inside it.
  manifest:
    name: publish the manifest lists
    needs: [plan, tiers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      # manifest add takes the arch tags straight from the registry, so nothing
      # here pulls a layer — only the manifests and configs it needs to build
      # the list.
      - name: combine the architectures
        env:
          REPOS: >-
            ${{ needs.plan.outputs.tier_base }}
            ${{ needs.plan.outputs.tier_agents }}
            ${{ needs.plan.outputs.tier_slim_base }}
            ${{ needs.plan.outputs.tier_slim_agents }}
        run: |
          set -euo pipefail
          for repo in $REPOS; do
            echo "== $repo:$TAG"
            podman manifest create "$repo:$TAG"
            for arch in amd64 arm64; do
              podman manifest add "$repo:$TAG" "docker://$repo:$TAG-$arch"
            done
            podman manifest push --all "$repo:$TAG" "docker://$repo:$TAG"
            podman manifest inspect "$repo:$TAG" \
              | jq -r '.manifests[] | "   \(.platform.os)/\(.platform.architecture)  \(.digest)"'
          done

      - name: what to paste
        env:
          AGENTS: ${{ needs.plan.outputs.tier_agents }}
          SLIM_AGENTS: ${{ needs.plan.outputs.tier_slim_agents }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Tiers published and proved on amd64 and arm64

          Paste these two lines into \`image/tiers.env\` to adopt them:

          \`\`\`
          AGENTS_REF=$AGENTS:$TAG
          SLIM_AGENTS_REF=$SLIM_AGENTS:$TAG
          \`\`\`
          EOF
