# Build, unit tests, and the smoke profile — on every host cs-sandbox is driven
# from. All of it blocks.
#
# The smoke profile (`make test-smoke`) is a named subset of the live tests, not
# a separate suite. Where an engine is present it boots REAL sandboxes: create,
# exec, destroy, ls, two sandboxes resolving each other by name, a port forward
# end to end. That is affordable because the image those tests run against is a
# slimmed derivation of the real Containerfile — 474 MB instead of 6.04 GB — built
# once here, alongside the Firecracker artifacts derived from it, and shared to
# every job that needs them.
#
# Which hosts can do what was measured, not assumed:
#
#   ubuntu-latest    rootless podman from the runner image. Live tests run. The
#                    version moves with that image and is printed by the job
#                    rather than pinned here, because it is not cosmetic: which
#                    podman a host runs decides how a sandbox reaches the host
#                    (SPEC R52a), and this comment claimed 4.9.3 long after the
#                    runner had moved on.
#   windows/WSL2     podman inside the distro. Live tests run.
#   macos-15-intel   podman 5.8.5 + applehv (kern.hv_support=1). Live tests run.
#                    Homebrew has no x86_64 bottle, so podman comes from the
#                    vendor pkg; v5.8.5 is the newest release still shipping an
#                    Intel macOS build (6.0 dropped them).
#   macos-arm64      SELF-HOSTED Mac mini (M4, macOS 26, kern.hv_support=1).
#                    Live tests run. GitHub's own arm64 macOS runners cannot do
#                    this and never will: they are "Apple M1 (Virtual)" VMs
#                    reporting kern.hv_support=0 — a VM on silicon with no
#                    nested-virt capability, so no hypervisor is exposed inside
#                    it and no podman machine can boot. Self-hosting is the only
#                    way to test arm64 macOS against a real engine at all.
#                    Its podman machine is started at system BOOT by a
#                    LaunchDaemon (nobody logs into that box), so unlike the
#                    Intel job nothing here installs podman or inits a machine.
#
# Every host above now has a real engine, so the profile's live members run
# everywhere. They still skip themselves where no engine is present, which is
# what keeps the same `make test-smoke` correct on a developer's laptop.
#
# Firecracker, the other engine, is covered by one job on Linux: it boots a real
# microVM against artifacts built from the same slimmed image. macOS has no KVM,
# and WSL2's /dev/kvm is nested virt inside an Azure VM, so neither is asked to.
#
# The full live suite (`-tags integration`) still needs a real Linux/KVM host
# with the real image: run it with `make test-integration`.
name: ci

on:
  push:
    # A push event runs the workflow file from the pushed ref, so a branch can
    # opt itself in here without any change on main — no entry needed for one.
    branches: [main]
    # Tags too, for publish-images: a v0.1.0 image can only be built from the
    # tagged commit, because that is the only place cs-sandbox reports v0.1.0.
    # Without this the tag arm of that job's condition can never be true.
    tags: ["v*"]
  pull_request:
  # Note this one does NOT work until it reaches main: a dispatch is an API call
  # against a workflow registered from the DEFAULT branch, so GitHub rejects it
  # ("Workflow does not have 'workflow_dispatch' trigger") however this branch
  # spells it. It is here for after the merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One matrix for every host that ships this binary, WSL included. It takes two
  # accommodations: setup-go installs on the Windows side and is invisible inside
  # the distro, so WSL builds its own toolchain; and each step runs under
  # matrix.shell, which is plain bash everywhere except WSL, where it is
  # wsl-bash. Everything between those two points is the same commands on all
  # three, which is the reason to keep them in one job rather than three.
  build-test:
    name: build-test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest
            # Artifact names take neither "/" nor a space, both of which
            # matrix.label carries, so the coverage artifact is named with this.
            covlabel: ubuntu-latest
            shell: bash
          # An array, not a label string: self-hosted runners are selected by
          # ANDing labels, and these three are the ones the runner registers
          # automatically. No custom label is needed while this is the only
          # self-hosted runner on the repo — add one before there is a second.
          - os: [self-hosted, macOS, ARM64]
            label: macos-arm64 / self-hosted
            covlabel: macos-arm64-self-hosted
            shell: bash
          - os: windows-2025
            label: windows-2025 / WSL2
            covlabel: windows-2025-wsl2
            shell: wsl-bash {0}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # The shell has to be set HERE and not per step: `steps.*.shell` accepts no
    # context at all ("no context is available here"), so `${{ matrix.shell }}`
    # on a step makes the whole file invalid — GitHub then reports a run with
    # zero jobs, which looks alarmingly like nothing ran. defaults.run.shell is
    # evaluated after the matrix expands, so the expression is allowed here.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      # FIRST, before checkout, so a fork's code never reaches the self-hosted
      # machine's disk. This is an ACCIDENT guard, not a security boundary: a
      # `pull_request` workflow runs from the PR's merge commit, so a hostile
      # fork can simply delete this step. What actually protects the Mac mini is
      # the repository's "require approval for all external contributors"
      # setting — no fork PR runs anything until a maintainer approves it. This
      # catches the case where that setting is loosened by mistake.
      #
      # It fails rather than skips because a matrix leg cannot skip itself, and
      # a green check that silently tested nothing is worse than a red one.
      - name: refuse fork PRs on the self-hosted runner
        if: matrix.label == 'macos-arm64 / self-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork PR from ${{ github.event.pull_request.head.repo.full_name }} — refusing to run on the self-hosted runner" >&2
          exit 1

      - uses: actions/checkout@v7

      # Module caching off for the self-hosted leg only. setup-go restores into
      # ~/go/pkg/mod, and Go makes everything it puts there read-only. A hosted
      # runner starts with that directory empty so the restore is unopposed; the
      # Mac mini already has it populated from an earlier job, so tar hits
      # hundreds of files it cannot unlink and the restore fails outright.
      # The cache exists to fake persistence across throwaway VMs — a runner
      # that genuinely persists already has the thing being faked.
      - uses: actions/setup-go@v7
        if: runner.os != 'Windows'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: ${{ matrix.label != 'macos-arm64 / self-hosted' }}

      - uses: Vampire/setup-wsl@v7
        if: runner.os == 'Windows'
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      # The distro is bare, so this is what actions/setup-go does for the others:
      # a Go toolchain (Ubuntu 24.04 ships 1.22 and go.mod needs 1.26) plus gcc,
      # without which `go test -race` cannot build — and running -race on two of
      # three hosts but not the third is exactly the asymmetry this matrix exists
      # to remove. The symlink puts go on PATH for every later step, so none of
      # them has to know which host it is on.
      - name: toolchain
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # libc6-dev, not just gcc: --no-install-recommends leaves gcc without
          # the C standard library headers, and a BROKEN compiler is worse than
          # none. With no gcc at all Go sets CGO_ENABLED=0 and everything builds;
          # with gcc present it enables cgo, then dies on `fatal error:
          # stdlib.h: No such file or directory` — in `go vet`, not just -race.
          # jq comes with the hosted ubuntu and macOS images but not with this
          # bare distro. The cs-claude wrapper skips its whole config edit when
          # jq is missing, so without it the first-run dialog tests fail here
          # and only here.
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git make gcc libc6-dev jq
          ver="$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)"
          curl -fsSL "https://go.dev/dl/${ver}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          ln -sf /usr/local/go/bin/go /usr/bin/go
          go version

      - name: gofmt
        if: matrix.os == 'ubuntu-latest' # formatting is platform-independent; check once
        run: make fmt-check

      - name: verify modules
        run: go mod verify

      - name: vet
        run: go vet ./...

      # The live tests can't all run here, but they must still compile, so a
      # refactor can't silently break them. Both tags, because the smoke profile
      # selects across files tagged `integration || smoke`.
      - name: vet (integration build tag)
        run: go vet -tags integration ./...

      - name: vet (smoke build tag)
        run: go vet -tags smoke ./...

      # Once, on ubuntu: what .golangci.yml checks is platform-independent, and
      # three copies of the same report is three times the log to read. Pinned
      # for the same reason actionlint is — a clean run on a laptop has to mean
      # a clean run here, and these linters gain checks between releases. The
      # target runs all three tag sets, matching the vet steps above: a build
      # tag hides a file from the linter as surely as from the compiler.
      - name: golangci-lint
        if: matrix.os == 'ubuntu-latest'
        run: make lint

      # Whole-program reachability, which golangci-lint's `unused` cannot do:
      # it reasons one package at a time, so a function whose only caller is in
      # another package still looks used. See the deadcode target in the Makefile.
      - name: deadcode
        if: matrix.os == 'ubuntu-latest'
        run: make deadcode

      - name: build
        run: go build ./... # compile-check every package

      # Produce the actual host binary (static, version-stamped) and attach it, so a
      # PR build can be downloaded from the run's Artifacts and run locally. Built
      # before the tests so it's available even if a test later fails. Not on WSL:
      # it would be a second copy of the Linux binary, filed under "Windows".
      - name: build binary
        if: runner.os != 'Windows'
        run: make build-go

      - name: upload binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: cs-sandbox-${{ runner.os }}-${{ runner.arch }}
          path: bin/cs-sandbox
          if-no-files-found: error
          retention-days: 14

      # Schema only: this validates the manifest, and does not prove a release
      # can be cut. The manifest is platform-independent, so check it once —
      # without this nothing reads .goreleaser.yaml until a release is cut.
      - name: goreleaser check
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: test
        run: make test-race

      # The tier this leg produced, for the coverage job to merge. Uploaded
      # rather than judged here: this leg runs the unit tier alone, and the
      # packages only a live engine reaches would read as lost against a
      # baseline that records every tier.
      - name: keep this leg's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-race-${{ matrix.covlabel }}
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # An invalid workflow file fails the run with zero jobs and no annotation in
  # the API, which is the least legible failure the forge produces. actionlint
  # is pinned as a Go tool in go.mod, so a clean `make actionlint` on a laptop
  # means a clean one here. Extra runner labels it does not know about live in
  # .github/actionlint.yaml.
  actionlint:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make actionlint

  # Both build products, from ONE image build. The microVM's rootfs is derived
  # from the image, and `cs-sandbox build --engine firecracker` builds the image
  # on its way to the artifacts — so producing them together is not just cheaper
  # than two jobs, it is the only way the rootfs is guaranteed to come from the
  # same bytes the podman jobs test. The Containerfile opens with `dnf update -y`,
  # so two builds minutes apart can genuinely differ.
  #
  # One cache key covers both, deliberately: a change under internal/fcdisk (the
  # firecracker release and guest-kernel pins live there) rebuilds the image too,
  # which costs ~70s on a rare path and keeps the pair honest.
  # The prose rules from CONTRIBUTING.md, checked by cs-lint. Its own job because
  # it needs no matrix and builds nothing of this repository, so it answers in a
  # minute and answers even when the tests are failing.
  # `make check` runs it too, for the contributor who runs one command before
  # pushing. cs-lint needs no install step: it is pinned in go.mod and the make
  # targets run it with `go tool`, so CI and a laptop use the same build.
  prose:
    name: docs prose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make prose

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  # Everything the documents point at, resolved against the tree. It needs
  # no binary either, so it answers beside the prose job rather than after
  # the build.
  refs:
    name: docs refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make refs

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  oss:
    name: open-source readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make oss

  # The documented interface against the real one: every command they name
  # exists, every command the binary carries is named, the settings the code
  # reads are the settings they list, and a sample output is still what the
  # command prints. It builds first, because every check here asks the binary.
  surface:
    name: docs surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make surface

  # The ledger's freshness gate. CONTRIBUTING.md asks for a render and a check
  # before every commit that touches ledger/, and nothing enforced it until
  # this job did.
  ledger:
    name: ledger check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make ledger

  build-artifacts:
    name: build-artifacts (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CS_SANDBOX_IMAGE: localhost/sandbox-slim:ci
      CS_SANDBOX_FC_CACHE: ${{ github.workspace }}/bin/fc-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: cache them
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            bin/cs-sandbox-ci.tar
            bin/cs-sandbox-ci-agents.tar
            bin/fc-artifacts.tar.gz
          key: cs-sandbox-artifacts-${{ hashFiles('image/**', 'internal/fcdisk/**') }}

      # The artifact build preflights exactly as a create does — /dev/kvm plus
      # dnsmasq, socat, fakeroot, mke2fs, pasta, newuidmap, python3, ip, ssh,
      # curl, git — so this job needs a KVM-capable host even though it boots
      # nothing. Skipped entirely on a cache hit.
      - name: firecracker host prerequisites
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fakeroot e2fsprogs dnsmasq-base passt socat uidmap iproute2 curl
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      - name: build them
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # One command, both products: the image, then the artifacts from it.
          make build-ci-fc
          podman save --format oci-archive -o bin/cs-sandbox-ci.tar "$CS_SANDBOX_IMAGE"
          # And the same image with the agent CLIs kept, which the replay half
          # of the smoke profile boots. A second image rather than one serving
          # both: it is 1.38 GB against 474 MB, and only the ubuntu smoke job
          # below loads it, so the three other smoke jobs keep the small one.
          # Every layer below the agents is shared, so this build is cheap.
          make build-ci-agents-image
          podman save --format oci-archive -o bin/cs-sandbox-ci-agents.tar localhost/sandbox-slim-agents:ci
          # --sparse: the base rootfs is ~4 GB of mostly holes, and reading them
          # is the slow part of packing an otherwise ~456 MB archive.
          tar --sparse -C bin/fc-cache -czf bin/fc-artifacts.tar.gz .
          ls -lh bin/cs-sandbox-ci.tar bin/cs-sandbox-ci-agents.tar bin/fc-artifacts.tar.gz

      - name: share the image
        uses: actions/upload-artifact@v7
        with:
          name: cs-sandbox-ci-image
          path: bin/cs-sandbox-ci.tar
          if-no-files-found: error
          retention-days: 1

      - name: share the agents image
        uses: actions/upload-artifact@v7
        with:
          name: cs-sandbox-ci-agents-image
          path: bin/cs-sandbox-ci-agents.tar
          if-no-files-found: error
          retention-days: 1

      - name: share the firecracker artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cs-sandbox-fc-artifacts
          path: bin/fc-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 1

  smoke-linux:
    name: smoke (ubuntu-latest)
    # Both, so the fast checks gate the slow ones: no point booting sandboxes on
    # four hosts for a branch that does not vet or whose unit tests fail. The
    # matrix's WSL leg is the slowest of the three — it builds its environment
    # from a bare distro rather than a curated runner image — so on a build-image
    # cache hit it is what these wait on.
    needs: [build-test, build-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CS_SANDBOX_IMAGE: localhost/sandbox-slim:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/download-artifact@v7
        with:
          name: cs-sandbox-ci-image
          path: bin

      # The replay half of the smoke profile boots this one. Only this job loads
      # it: it is 1.38 GB against 474 MB, and what it covers is the same on every
      # podman host, so paying for it on the WSL and macOS legs would buy a third
      # copy of one answer. Where it is absent the replay members skip, naming
      # the image.
      - uses: actions/download-artifact@v7
        with:
          name: cs-sandbox-ci-agents-image
          path: bin

      - name: load the images
        run: |
          set -euo pipefail
          podman --version
          podman load -i bin/cs-sandbox-ci.tar
          podman load -i bin/cs-sandbox-ci-agents.tar
          podman image exists "$CS_SANDBOX_IMAGE"
          podman image exists localhost/sandbox-slim-agents:ci

      - name: smoke
        run: make test-smoke

      - name: keep this job's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-linux
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  # Firecracker boots a real microVM — its own kernel, its own rootfs, sshd
  # reached over a vsock bridge — so none of the podman jobs says anything about
  # it. Linux only: macOS has no KVM at all, and WSL2's /dev/kvm is nested virt
  # inside an Azure VM, which is not something to assume.
  smoke-firecracker:
    name: smoke firecracker (ubuntu-latest)
    needs: [build-test, build-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CS_SANDBOX_IMAGE: localhost/sandbox-slim:ci
      CS_SANDBOX_FC_CACHE: ${{ github.workspace }}/bin/fc-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # /dev/kvm is present on these runners but root:kvm, and the runner user is
      # not in that group — so it reads as absent and every microVM test skips
      # itself, which would look exactly like passing.
      - name: firecracker host prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fakeroot e2fsprogs dnsmasq-base passt socat uidmap iproute2 curl
          ls -l /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm || { echo "/dev/kvm still not writable" >&2; exit 1; }

      - uses: actions/download-artifact@v7
        with:
          name: cs-sandbox-ci-image
          path: bin

      - uses: actions/download-artifact@v7
        with:
          name: cs-sandbox-fc-artifacts
          path: bin

      # `create` verifies the image exists before it will boot anything, so the
      # microVM path needs it present even though it boots from the rootfs.
      - name: load the image and the artifacts
        run: |
          set -euo pipefail
          podman load -i bin/cs-sandbox-ci.tar
          podman image exists "$CS_SANDBOX_IMAGE"
          mkdir -p bin/fc-cache
          tar -C bin/fc-cache -xzf bin/fc-artifacts.tar.gz
          ls -1 bin/fc-cache

      # Three members, and this is the only leg with a /dev/kvm to run them:
      # TestFirecrackerCreateLive is the cheapest proof that a microVM boots, gets
      # its disks, answers ssh as the dev user over the vsock bridge, and registers
      # with the fabric's DNS. TestCLINestedSandboxInVMLive then goes two layers
      # down — cs-sandbox shipped into that microVM, creating a podman sandbox
      # inside it, reached by name over ssh, and then a container run inside that
      # sandbox — which is what covers the guest's nested podman (rootless engine,
      # newuidmap caps, /dev/net/tun) and the nested engine a sandbox gets under a
      # hypervisor. It ships the images into the guest, so it needs the
      # slim CI image this job already loads. TestCLILendKeyFirecrackerLive spends
      # a loan from inside a microVM: the podman jobs prove lending over a
      # container's route to the host, which is not the route a tap takes, and the
      # guest's own address for the host comes off the seed rather than from
      # podman.
      - name: smoke (firecracker)
        run: make test-smoke SMOKE_TESTS="TestFirecrackerCreateLive TestCLINestedSandboxInVMLive TestCLILendKeyFirecrackerLive"

      - name: keep this job's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-firecracker
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  # Windows is supported through WSL2 — the CLI is a Linux binary inside the
  # distro, so everything happens in wsl-bash.
  #
  # Everything below the setup runs as an UNPRIVILEGED user, not as root. That is
  # how a sandbox is actually created on WSL2 (a developer's own account, rootless
  # podman, a real home), and rootless is the only configuration the project
  # supports. Testing as root would mean testing a configuration nobody runs, and
  # chasing its failures.
  smoke-wsl:
    name: smoke (windows-2025 / WSL2)
    needs: [build-test, build-artifacts]
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: cs-sandbox-ci-image
          path: bin

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: distro packages
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # catatonit: `podman run --init` needs it and it is only a Recommends.
          # uidmap: newuidmap/newgidmap, without which rootless podman cannot map
          #   a range at all.
          # netavark + aardvark-dns: the network backend and the resolver that
          #   makes two sandboxes find each other by name.
          # passt/slirp4netns/fuse-overlayfs: rootless networking and storage.
          # iptables is the one nothing declares: netavark's firewall driver
          # execs it to apply the container's rules, but netavark Depends only on
          # libc, and podman merely *Suggests* iptables — so no apt setting
          # installs it, --no-install-recommends or not. Without it netavark logs
          # "Using iptables firewall driver" and dies as
          #   netavark (exit code 1): No such file or directory (os error 2)
          # naming neither iptables nor the driver. `podman network create` is
          # unaffected (it only writes config), so networks look healthy right up
          # until a container is attached to one.
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git make openssh-client \
            podman catatonit uidmap netavark aardvark-dns iptables \
            passt slirp4netns fuse-overlayfs
          podman --version
          for b in catatonit newuidmap iptables; do
            command -v "$b" >/dev/null || { echo "missing: $b" >&2; exit 1; }
          done
          # netavark and aardvark-dns are podman HELPERS: they install under
          # /usr/lib/podman (or /usr/libexec/podman), never onto $PATH, so
          # `command -v` reports them missing for a package that installed
          # perfectly. Look where they actually live.
          for h in netavark aardvark-dns; do
            test -x "/usr/lib/podman/$h" || test -x "/usr/libexec/podman/$h" \
              || command -v "$h" >/dev/null \
              || { echo "missing helper: $h" >&2; exit 1; }
          done

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
      # rootless podman needs. Best-effort: WSL often has no AppArmor at all, in
      # which case this knob does not exist and nothing is lost.
      # WSL2 does not mount / shared, and rootless podman warns about it:
      #   "/" is not a shared mount, this could cause issues or missing mounts
      #   with rootless containers
      # It propagates the container's network mounts back out of the namespace it
      # sets them up in, which a private / can prevent. Heeding the warning.
      #
      # Honest note: this was added believing it explained the netavark failure
      # below, and it did not — that was a missing iptables. Nothing here has
      # since proved this step is REQUIRED on WSL2, only that podman asks for it.
      # Drop it if you want to find out; it is cheap to keep.
      - name: make / a shared mount
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          findmnt -no PROPAGATION / || true
          mount --make-rshared /
          echo "propagation now: $(findmnt -no PROPAGATION /)"

      - name: allow unprivileged user namespaces
        shell: wsl-bash {0}
        run: |
          set -eu
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null \
            || echo "no apparmor userns restriction here — nothing to relax"

      # Ubuntu 24.04 ships a Go older than go.mod asks for, so fetch a toolchain.
      # There is no setup-go inside WSL, so this reads the version out of the same
      # file setup-go reads it from on every other leg. Latest stable would also
      # satisfy go.mod, and did until this pinned a toolchain rather than a floor:
      # the day a new Go ships, that would put this one leg on a version no other
      # job is running.
      - name: install Go
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          ver="go$(awk '/^go [0-9]/ { print $2; exit }' go.mod)"
          curl -fsSL "https://go.dev/dl/${ver}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          /usr/local/go/bin/go version

      - name: create the developer user
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash dev
          # useradd ALREADY allocates the subordinate uid/gid ranges rootless
          # podman maps container uids through (login.defs SUB_UID_COUNT), and
          # picks a free one. Writing a range by hand — as this used to — gave dev
          # a second range, and one already assigned to another user, so podman
          # built a map with two claims on the same host uids and newuidmap
          # refused it: `write to uid_map failed: Invalid argument`. Assert that
          # the ranges exist rather than assigning them.
          grep -q '^dev:' /etc/subuid && grep -q '^dev:' /etc/subgid \
            || { echo 'useradd allocated no subordinate ranges for dev' >&2; exit 1; }
          cat /etc/subuid /etc/subgid
          # No systemd in the distro, so nothing creates the runtime dir logind
          # would; rootless podman falls back to a /tmp path and warns. Make it.
          install -d -o dev -g dev -m 0700 "/run/user/$(id -u dev)"
          # The checkout is on /mnt/c (DrvFs): root-owned, without real Unix
          # modes, and slow to build from. Copy it onto the distro's own ext4,
          # owned by dev — which is also where t.TempDir() already lands, so the
          # tests' mode assertions mean what they say.
          cp -r "$PWD" /home/dev/src
          cp bin/cs-sandbox-ci.tar /home/dev/cs-sandbox-ci.tar
          chown -R dev:dev /home/dev

      # One script rather than a chain of `su -c` one-liners: every invocation
      # has to re-establish PATH, XDG_RUNTIME_DIR and the image name anyway.
      # `su -` (a login shell) rather than plain `su`, so HOME is dev's and not
      # root's — `cd "$HOME/src"` below depends on it.
      - name: write the runner script
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cat > /home/dev/run.sh <<'SH'
          set -eu
          export PATH=/usr/local/go/bin:$PATH
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export CS_SANDBOX_IMAGE=localhost/sandbox-slim:ci
          cd "$HOME/src"
          exec "$@"
          SH
          chmod 0755 /home/dev/run.sh
          chown dev:dev /home/dev/run.sh

      - name: load the image (rootless, as dev)
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          su - dev -c '/home/dev/run.sh podman load -i /home/dev/cs-sandbox-ci.tar'
          su - dev -c '/home/dev/run.sh podman image exists localhost/sandbox-slim:ci'
          su - dev -c '/home/dev/run.sh podman info --format "{{.Host.Security.Rootless}} rootless"'

      - name: smoke
        shell: wsl-bash {0}
        run: su - dev -c '/home/dev/run.sh make test-smoke'

      # The suite ran from the copy on the distro's ext4, so its coverage is
      # there and not in the checkout on /mnt/c that upload-artifact can see.
      - name: bring the coverage back to the checkout
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          rm -rf "$PWD/.coverage"
          cp -r /home/dev/src/.coverage "$PWD/.coverage"

      - name: keep this job's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-wsl
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7


  # Intel macOS, because arm64 macOS cannot run a container engine at all. This
  # is the only job that exercises the macOS host paths against a real engine:
  # ~/Library/Application Support as a state root, and podman-machine.
  smoke-macos-intel:
    name: smoke (macos-15-intel)
    needs: [build-test, build-artifacts]
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      CS_SANDBOX_IMAGE: localhost/sandbox-slim:ci
      PODMAN_VERSION: v5.8.5
      # From https://github.com/containers/podman/releases/download/v5.8.5/shasums
      PODMAN_PKG_SHA256: 2677be9fa3bf75f7dbd4dfe5f5039cf105806f102af15ee6c6d174c70dcda3b8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/download-artifact@v7
        with:
          name: cs-sandbox-ci-image
          path: bin

      # The vendor's own macOS path. Homebrew has no x86_64 bottle for podman on
      # macOS 15 (it calls the configuration Tier 3 and offers only
      # --build-from-source), and this pkg additionally ships vfkit and gvproxy,
      # which `podman machine` needs and a podman-remote zip would not give us.
      - name: install podman ${{ env.PODMAN_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/podman.pkg \
            "https://github.com/containers/podman/releases/download/${PODMAN_VERSION}/podman-installer-macos-amd64.pkg"
          echo "${PODMAN_PKG_SHA256}  /tmp/podman.pkg" | shasum -a 256 -c -
          sudo installer -pkg /tmp/podman.pkg -target /
          echo /opt/podman/bin >> "$GITHUB_PATH"

      # init and start are separated so the start can be retried. `podman machine
      # start` returns a bare "Error: EOF" transiently here — the ssh/gvproxy
      # handshake into the VM losing its connection — and with every job blocking
      # a merge, one flaky VM boot must not be a red PR. `podman info` below is
      # the real assertion: if all three attempts failed, it fails the step.
      - name: start the podman machine
        run: |
          set -euo pipefail
          podman machine init --cpus 2 --memory 4096 --disk-size 20
          for attempt in 1 2 3; do
            if podman machine start; then break; fi
            echo "machine start attempt $attempt failed; retrying"
            podman machine stop >/dev/null 2>&1 || true
            sleep 15
          done
          podman info --format '{{.Version.Version}} | {{.Host.Arch}} | {{.Host.OS}}'

      - name: load the image
        run: |
          set -euo pipefail
          podman load -i bin/cs-sandbox-ci.tar
          podman image exists "$CS_SANDBOX_IMAGE"

      - name: smoke
        run: make test-smoke

      - name: keep this job's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-macos-intel
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: tear the machine down
        if: always()
        run: |
          podman machine stop || true
          podman machine rm -f || true

  # arm64 macOS against a REAL engine — the coverage no GitHub-hosted runner can
  # provide (see the host table at the top). This is a self-hosted Mac mini, and
  # everything below assumes the differences that come with that:
  #
  #   * Its podman machine is started at system boot by a LaunchDaemon, so there
  #     is no install-podman step and no `podman machine init`. The Intel job
  #     above does both because its runner is a fresh VM every time.
  #   * The machine is NOT thrown away at the end. A GitHub-hosted runner is
  #     destroyed after the run; this one persists, so leftovers are inherited by
  #     the next job and have to be cleaned up explicitly.
  #
  # No `concurrency:` group is needed: a self-hosted runner executes one job at a
  # time, so two runs queue rather than colliding over the fabric and the host
  # SSH port pool that `-p 1` exists to serialize.
  smoke-macos-arm64:
    # The " / self-hosted" suffix follows "windows-2025 / WSL2": it flags a host
    # that is not what its first half suggests. It earns its keep when a check
    # goes red — this one means go look at the Mac mini, not at GitHub.
    name: smoke (macos-arm64 / self-hosted)
    needs: [build-test, build-artifacts]
    # Skips cleanly for fork PRs — unlike the build-test leg, which is inside a
    # matrix and has to fail instead. Same accident-guard caveat applies: the
    # repository's "require approval for all external contributors" setting is
    # what actually protects this machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    env:
      CS_SANDBOX_IMAGE: localhost/sandbox-slim:ci
    steps:
      - uses: actions/checkout@v7
      # Off for the same reason as the build-test leg above: this runner's
      # module cache persists between jobs, and Go leaves it read-only, so the
      # restore fails trying to unpack over it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - uses: actions/download-artifact@v7
        with:
          name: cs-sandbox-ci-image
          path: bin

      # launchd does not order jobs relative to each other and `podman machine
      # start` takes 20-30s, so after a reboot the runner can pick up a job
      # before the VM is ready. Guard on state rather than calling start
      # blindly: start exits 125 when the machine is already running.
      - name: ensure the podman machine is up
        run: |
          set -euo pipefail
          if [ "$(podman machine inspect --format '{{.State}}' podman-machine-default)" != "running" ]; then
            echo "machine was down; starting it"
            podman machine start
          fi
          podman info --format '{{.Version.Version}} | {{.Host.Arch}} | rootless={{.Host.Security.Rootless}}'

      - name: load the image
        run: |
          set -euo pipefail
          podman load -i bin/cs-sandbox-ci.tar
          podman image exists "$CS_SANDBOX_IMAGE"

      - name: smoke
        run: make test-smoke

      - name: keep this job's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-smoke-macos-arm64
          path: .coverage/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # The runner is not ephemeral, so this is the equivalent of the Intel job
      # throwing its whole machine away. Containers and networks only: images are
      # left alone deliberately, since the next run reloads the CI image anyway
      # and keeping the layers is free speed. Best-effort — a cleanup failure
      # must not turn a passing smoke run red.
      - name: tear down leftovers
        if: always()
        run: |
          set -uo pipefail
          podman rm -f --all || true
          podman network prune -f || true
          echo "--- surviving containers (expect none) ---"
          podman ps -a || true

  # One number for the whole run, and the gate that keeps it honest.
  #
  # Every tier above uploads its coverage rather than judging it, because no job
  # sees more than the slice it ran: build-test never boots an engine, and a
  # smoke leg never runs the unit tier. The smoke tier alone arrives from five
  # machines and three operating systems — merged here they are one picture,
  # which is the only one worth reporting or gating on.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - build-test
      - smoke-linux
      - smoke-firecracker
      - smoke-wsl
      - smoke-macos-intel
      - smoke-macos-arm64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: collect every tier
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: .coverage-artifacts

      # Unpacked side by side as <tier>@<job> rather than merged into one
      # directory per tier: covdata data files are named after a build hash, so
      # two machines' files collide on name while differing in content.
      # scripts/coverage.sh treats every <tier>@* directory as that tier.
      - name: assemble the tiers
        run: |
          set -euo pipefail
          mkdir -p .coverage
          shopt -s nullglob
          for art in .coverage-artifacts/*/; do
            job=$(basename "$art"); job=${job#coverage-}
            for tier in unit race integration smoke cli; do
              [ -d "$art$tier" ] || continue
              cp -a "$art$tier" ".coverage/$tier@$job"
            done
          done
          echo "tier directories assembled:"
          find .coverage -mindepth 1 -maxdepth 1 -type d -printf '  %f\n' | sort

      # Prints the aggregate to the job summary and fails if a package the
      # baseline records has stopped being reached by the tier that reached it.
      - name: report and gate
        run: make coverage-check

  # Publish the three images, from main and from a release tag only.
  #
  # CI is the only publisher. A tag names the image CI built from that commit,
  # which is a promise a workstation cannot keep: the image is not reproducible
  # (SPEC §14) and a working tree can differ from what was pushed. Publishing
  # from a clean checkout of a pushed commit is what makes the name true.
  #
  # It runs after the tests, because every sandbox anybody creates runs what this
  # pushes. It does not gate them: nothing waits on this job.
  publish-images:
    name: publish images (ubuntu-latest)
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-test, smoke-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the module version is derived from the VCS stamp
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # No build cache here, deliberately. Caching the layer store cannot work:
      # rootless podman's overlay layers hold files owned by mapped subuids with
      # mode 000 (/etc/shadow and friends, inside every layer's diff/), the
      # runner user cannot read them, and tar exits 2. actions/cache reports that
      # as a warning, so the job stays green while caching nothing. Packing the
      # store under `podman unshare` would get around it, and would cost about as
      # long as the build: this one takes ~7 minutes cold, and a ~3 GB restore
      # and repack is most of that, while evicting the artifacts cache the smoke
      # jobs live on. A published image cannot seed a build cache either, because
      # podman matches steps against per-step intermediate images and a pull
      # carries none of them.

      - name: build the binary that names the images
        run: make build-go

      # Asked of the binary rather than assembled here: the name carries the
      # version, and the naming rule lives in one place.
      - name: the references this revision publishes
        id: refs
        run: |
          set -euo pipefail
          ./bin/cs-sandbox version
          # Underscores, not the hyphens the labels use: a GitHub expression
          # reads outputs.image-slim as a subtraction.
          ./bin/cs-sandbox version --images | while read -r label ref; do
            echo "${label//-/_}=$ref" >> "$GITHUB_OUTPUT"
          done

      - name: log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Each build tags the fully-qualified name, so the push takes it unaltered.
      # `build` pulls before it builds, so a re-run of this workflow finds the
      # image already published and pushes back the digest it just fetched.
      # The runner's root volume holds the whole layer store. The shipped image is
      # ~6 GB and the store is larger while a build is in flight, so print the
      # headroom either side: a job that dies at 90% for want of disk should say
      # so here rather than in a podman error about a partial write.
      - name: build and push the sandbox image
        run: |
          set -euo pipefail
          df -h / | tail -1
          ./bin/cs-sandbox build --engine podman
          df -h / | tail -1
          podman push '${{ steps.refs.outputs.image }}'

      - name: build and push the CI images
        run: |
          set -euo pipefail
          ./bin/cs-sandbox build --engine podman --slim
          podman push '${{ steps.refs.outputs.image_slim }}'
          ./bin/cs-sandbox build --engine podman --slim --with-agents
          podman push '${{ steps.refs.outputs.image_slim_agents }}'

      - name: what was published
        run: |
          {
            echo '### Images published'
            echo
            ./bin/cs-sandbox version --images | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
