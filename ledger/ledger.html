\n\nThe per-session turn lock was `flock`, which is util-linux and absent on macOS. A turn there printed `flock: command not found`, read the lock as unheld, and then told the caller `session '\u003cname>' is busy`. The turn never ran.\n\nThe background launcher was `setsid nohup`, also util-linux. With both stood in for by no-ops, a whole recorded campaign replayed on the Mac, so those two were the entire blocking path.\n\nThe third is silent and worse. `--kill` reads `/proc/\u003cpid>/cmdline` to confirm the recorded pid is the runner it started, and macOS has no `/proc` at all. The read fails, so the guard cannot be satisfied and nothing is signalled. Measured on 2026-09-09: `--kill` exited 0, said \"nothing to kill\", removed the pid file, and left the runner running. The campaign's restart ladder calls --kill first, so on a Mac a restart leaks the turn it meant to replace and loses the record of it.\n\nInstalling util-linux fixes the first two and cannot fix the third. That is why this is a defect in these scripts rather than a prerequisite to document.\n\nThe tests said so all along: 22 of them call skipUnlessLinux, whose message is \"agent-tool scripts target Linux (GNU coreutils, /proc)\". That is right for the turn drivers and the wrappers, which run inside the guest. It is not right for the cs-\u003cagent>-remote scripts, which run on the host.","notes":[{"date":"2026-09-21","text":"The job-control launch this added fails under launchd, because Apple's nohup exits there without running the turn. It was only ever run from a login session. That is SBX-068, which replaces the launch with one that needs no external program."}],"links":[]},{"id":"SBX-039","title":"An Apple silicon host runs the published sandbox image under emulation, because only amd64 is published and nothing checks","type":"defect","severity":"high","status":"closed","foundBy":"session agent, answering the maintainer's question \"in codesweep-ai are we able to publish arm64 images?\", 2026-09-14","opened":"2026-09-14","resolved":"2026-09-15","stint":"2026-09-14 arm64 image","evidence":{"commits":["9907b61"],"integrated":[],"verified":"`go test -count=1 ./internal/cli/ ./internal/doctor/ ./internal/engine/` passes, and all nine new tests pass with it. With the call sites in create.go, misc_commands.go and doctor.go reverted, four of them fail: TestBuildBuildsWhenThePullBroughtAnotherPlatform, TestEnsureImageRefusesAPullForAnotherPlatform, TestEnsureImageSaysAnUnfetchableImageIsTheWrongPlatform and TestDiagnoseImageForAnotherPlatform.\n\nEnd to end on an x86_64 host with podman 5.8.2, CS_SANDBOX_IMAGE named `docker.io/arm64v8/busybox:1.28`, stored as linux/arm64 on a linux/amd64 engine. `doctor` reported that pair and named `cs-sandbox build`. `create` exited 1 saying `the registry has no linux/amd64 image of it`, and made no sandbox. The same image tagged under localhost/ was reported present. `make check` exited 0 on the change."},"resolution":"`build`, `create` and `doctor` now compare the platform of the image in the local store with the platform podman's server runs, which on macOS is the podman machine. `build` builds a pulled image for another platform again, natively from the tiers. `create` fetches it again, and fails naming `build` when the registry has no image for this platform. An image under localhost/ is exempt. SPEC R165 holds the rule.","details":"The images a sandbox runs are published for linux/amd64 alone. `skopeo inspect --raw` on `ghcr.io/codesweep-ai/sandbox:v0.0.0-20260911220608-fe9796dafc77` and on its `sandbox-slim` twin returns a single OCI manifest whose config says linux/amd64. The tiers under them are lists of amd64 and arm64. The `publish-images` job in ci.yml builds on ubuntu-26.04 only.\n\nPodman does not refuse such an image on another architecture. On podman 5.8.2, `podman pull --arch arm64 docker.io/amd64/busybox:1.28` prints `WARNING: image platform (linux/amd64) does not match the expected platform (linux/arm64)`, exits 0, and stores linux/amd64. That was measured on an x86_64 host asking for arm64, not on a Mac.\n\ncs-sandbox never asks. `build` reads a successful pull as the image, and `create` reads `podman image exists` the same way. So on Apple silicon both settle for the amd64 image rather than building a native one from the arm64 tiers. The base-images workflow records what that costs. Under emulation, all four claude replay members timed out at 10.5s against 5.5s native.","notes":[{"date":"2026-09-15","text":"Commit 37a4b02 publishes linux/arm64 beside linux/amd64 under each version tag, so an arm64 host will pull its own image rather than build it. That half has not run in CI yet. Versions published before it stay amd64 only."}],"links":[]},{"id":"SBX-040","title":"Creates that start together in one group race to stage the lender binary, so one fails or the lender runs a partial copy","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while investigating the failed base-images run 34996055477, 2026-09-15","opened":"2026-09-15","resolved":"2026-09-15","stint":"2026-09-15 lender stage race","evidence":{"commits":["c7f53bc"],"integrated":[],"verified":"On the unfixed code, `go test -count=1 -run TestCreatesStagingTogetherEachLandACompleteCopy ./internal/cli/` failed 3 runs of 3 in its first round. The error was the one CI hit: `rename .../cs-sandbox.new .../cs-sandbox: no such file or directory`.\n\nWith c7f53bc, that test and TestStagingReplacesTheNameNotTheFile pass 20 runs in a row, and 5 more under `-race`. `make test-smoke` on an x86_64 host with podman 5.8.2 passes all 14 TestAgentReplay cells, the 7 lent ones staging in parallel, and TestCLILendKeyLive. The full `make check` gate passes too."},"resolution":"Each create now writes the lender binary to a temporary file of its own in the group's `.lender` directory, then renames it onto `cs-sandbox`. A rename can no longer take another create's file, and the last rename leaves the same complete binary.","details":"The second attempt of base-images run 34996055477 failed on amd64 in `make test-smoke`. One replay cell failed in under a second while the other thirteen passed:\n\n```\n--- FAIL: TestAgentReplay/claude-anthropic-lent (0.97s)\ncreate csvcr-claude-anthropic-l: rename .../instances/vcr8b6078dc/.lender/cs-sandbox.new .../instances/vcr8b6078dc/.lender/cs-sandbox: no such file or directory\n```\n\n`lenderBox.stage` in internal/cli/lend_box.go writes the lender binary to `\u003cgroup>/.lender/cs-sandbox.new`, then renames it onto `cs-sandbox`. Every create in a group stages while the group's lender is not running yet. The replay tier's lent cells create in one group at the same moment, so they all write that one temporary name. One create's rename takes the file another create was about to rename, and the second create fails with ENOENT.\n\nThe same race has a quieter outcome. A rename that lands while another create is still writing moves a partial binary into place, and the lender container then runs a truncated executable. The retry for two creates racing on `podman run` does not cover either case, because staging happens before it.\n\nIt is rare. Of the 30 most recent failed runs in this repository, only this one shows the error.","notes":[],"links":[]},{"id":"SBX-041","title":"On Linux every lender start copies the host's cs-sandbox into the group, though the image already carries a matching one","type":"improvement","severity":"low","status":"closed","foundBy":"maintainer, while reviewing the fix for SBX-040, 2026-09-15","opened":"2026-09-15","resolved":"2026-09-15","stint":"2026-09-15 lender stage race","evidence":{"commits":["c7f53bc"],"integrated":[],"verified":"`lenderBinary` now returns `CS_SANDBOX_LENDER_BIN` and nothing else, so with the variable unset there is no binary to stage. With no binary, TestLenderBoxJoinsOneNetworkAndNothingElse pins `--entrypoint cs-sandbox`, which runs the copy the image carries.\n\nThe old default was never used by a test. Every lending test drives the CLI in process through `execRoot`, where the executable is the test binary, and each make target that runs them sets the variable. `make test-smoke` passes all 14 TestAgentReplay cells and TestCLILendKeyLive with it set, and `make check` exits 0. A lent create on Linux against a full image, which is the new default path, was not run."},"resolution":"The lender runs the image's own cs-sandbox unless `CS_SANDBOX_LENDER_BIN` names one, so a released cs-sandbox copies nothing into the group. The test tiers still name a binary, because the slim image they boot has none.","details":"When `create` starts a group's lender container on Linux, `lenderBinary` in internal/cli/lend_create.go picks the running cs-sandbox. `lenderBox.stage` then copies that binary, about 10 MB, into `\u003cgroup>/.lender/`, and the container runs the copy.\n\nFor a released cs-sandbox the copy buys nothing. The binary names an image built from its own revision, and image/Containerfile installs the cs-sandbox that made it. The container therefore already holds a matching lender, which is what macOS runs today.\n\nThe copy is needed in two cases only. The slim image the test tiers boot carries no cs-sandbox at all, and a developer changing the lender wants their build without rebuilding the image. Both can name a binary with `CS_SANDBOX_LENDER_BIN`, and the Makefile already does for the tiers. The copy is also the step whose shared temporary name caused the race in SBX-040.","notes":[],"links":["SBX-040"]},{"id":"SBX-042","title":"The CI status reports workflows as running long after they finish","type":"defect","severity":"med","status":"closed","foundBy":"repository owner, reading the CI dashboard: \"The ledger, ui, lint, and sandbox projects all show their CI status as running, even though they completed.\"","opened":"2026-09-15","resolved":"2026-09-15","stint":"2026-09-15 CI status reported as running","evidence":{"commits":["f4dfb53"],"integrated":[],"verified":"After f4dfb53 reached main, ci finished at 22:01:04, and pages and publish images started at 22:01:06. The publish images run ended at 22:03:46, and the pages workflow ran again at 22:03:48. The status file published at 22:04:09 reports ci, publish images and pages as success on f4dfb53, with no run in flight.\n\nThe base-images and prune-images triggers have not fired yet. No push has changed the images since, and prune-images next runs on its schedule at 04:17 UTC. actionlint accepted the workflow."},"resolution":"`pages.yml` now also runs after publish images, base-images and prune-images finish. The last deploy therefore follows the last of them, so the status file reports finished runs as finished.","details":"`pages.yml` writes `ci-status.json` when ci finishes, and publish images starts at that same moment. The file is written within half a minute, so it records that run as in progress. Nothing rewrites it until the next push, so the dashboard at codesweep.ai/dashboards/ci shows this repository as running from then on.\n\nOn 135d9d4, ci finished at 20:28:27, and pages and publish images both started two seconds later. The file was generated at 20:28:54, and publish images finished at 20:31:23. The status action leaves out only the run writing the file, so publish images is reported as unfinished.\n\nbase-images can do the same. A push that changes the images starts it beside ci, and it can outlast ci. On bea6812, pushed on 2026-09-07, ci finished at 22:09:05 and base-images at 22:10:56. A status written on ci's completion would have recorded base-images as unfinished.\n\nIt began when publish images moved out of ci into a workflow of its own, in 601626e. The comment in `pages.yml` expected such a run to be a few minutes behind. It is reported as running instead, until the next push repeats the same race.","notes":[],"links":[]},{"id":"SBX-043","title":"A sandbox carries the operator's git name and address, and nothing turns that off","type":"improvement","severity":"med","status":"closed","foundBy":"session agent working in the tour repository, which records and replays a three member campaign through cs-vcr, after a recording was found to hold the operator's name and address","opened":"2026-09-19","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["e681a05"],"integrated":[],"verified":"go test ./internal/spec/ ./internal/engine/ -run 'TestParseIdentity|TestANamedOrAbsentIdentity|TestTheSeedCarries' -count=1: PASS. Live, on podman with a `--repo` clone. With `--git-identity none`, the global configuration and the clone held no name or address. With a named identity they held that one. With `host` they held the operator's, as before. A value that is none of the three was refused before anything was provisioned."},"resolution":"`create --git-identity` takes `host`, `none` or `\"Name \u003caddress>\"`. It decides the global git identity in the seed and the one each `--repo` clone is set to, on both engines. With `none` or a named identity the host's git configuration is not read. The README names the exception to its promise, and SPEC R3, R12, R67 and R68a carry the rule.","details":"Every sandbox is given the host's git identity. SPEC.md requires it: the seed carries `the host's git identity`, and the guest's global `~/.gitconfig` is seeded from the host's. `image/guest/init` and `image/rootfs/entrypoint` both do it. No flag and no variable turns it off.\n\nThat is right for a developer's own sandbox, where commits should be theirs. It has two costs when the agent's session is kept or published.\n\nThe first is a recording. An agent that runs `git config --list`, or reads `~/.gitconfig`, puts the operator's real name and address into a tool result. The tool result becomes part of every later request in that conversation. In one recorded campaign an agent's look at its git configuration put the operator's name into 54 cassette files and the address into 49. It was met by chance, because a brief line about git identity made the developer agent look. The recording before it was clean only because no agent happened to look.\n\nThe second is the README's promise. It says `Nothing on the host is shared unless you ask: not your files, not your SSH keys, and not the LLM provider keys you pay with.` A name and an address are shared without asking, and the sentence does not say so.\n\nThe tour works around it from outside. It sets `GIT_AUTHOR_*` and `GIT_COMMITTER_*` in the campaign profile, so commits carry a neutral identity, and it blanks the operator's name and address in the proxy that records. Neither removes the values from the guest's `~/.gitconfig`, where any agent can still read them.\n\nAn option to seed no identity, or a named one, would close this at the source. The README could say that the git identity is shared.\n\nTo reproduce, run `cs-sandbox create probe`, then `cs-sandbox exec probe -- git config --global --list`.","notes":[{"date":"2026-09-20","text":"The default stays `host`, so an existing caller sees no change. The record leaves the default open. A developer's own sandbox should commit as them, and SPEC R68 requires it, so withholding the identity is the choice that takes a flag."},{"date":"2026-09-20","text":"The flag covers more than the record reproduced. Each `--repo` clone is also set to the host's identity for that repo, by R67, and the flag decides that one too."},{"date":"2026-09-20","text":"With `none`, git refuses to commit until an identity is set inside the sandbox. A recorded run that commits wants a named identity. That also replaces the `GIT_AUTHOR_*` and `GIT_COMMITTER_*` variables the tour sets from outside."},{"date":"2026-09-20","text":"Two things still carry the operator into a sandbox, and no flag here removes them. The history of a repo shared with `--repo` holds its authors' names and addresses, and `git log` prints them. The sandbox's user is named after the host's user, so the home directory path carries that name. A recording proxy still has reason to blank them."}],"links":[]},{"id":"SBX-044","title":"cs-codex-turn reports a turn the provider ended with an error as a completed turn","type":"defect","severity":"high","status":"closed","foundBy":"session agent operating two eight-member campaigns side by side on one host, reading every member's own CLI session records and the lender containers' logs after both campaigns had ended","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["d6e8626"],"integrated":[],"verified":"go test ./internal/cli/ -run TestCodexTurnReportsAProviderFailure -count=1: PASS, 4 cases. With the driver reverted, the same run fails all 4 with `exit = 0; want 5`. Three of the fixture events are what codex 0.152.1 wrote against a stub provider."},"resolution":"`cs-codex-turn` reads the `task_complete` event it waited for. When the event carries `error`, the driver exits 5, prints the provider's message on stderr, and prints `failure class=\u003cclass> retry_after=\u003csecs>` for a caller to parse.","details":"**What happened.** Across two campaigns, 23 of 41 codex turns were ended by the provider: 21 on the key's tokens-per-minute limit and 2 on *\"Selected model is at capacity\"*. In the rollout JSONL each of those turns ends with a `task_complete` event whose `last_agent_message` is `null` and whose `error.message` carries the provider's text. The exit status of `cs-codex-turn` was 0 for every one of them.\n\n**Why.** The driver's completion test is a count: it waits until the rollout holds more `task_complete` events than it did before the prompt was submitted, and then reports success. It never reads the event. Its documented exit codes are *0 ok, 2 turn timed out/stalled, 3 launch/setup failure, 1 usage*. There is no code for a turn that failed, so a caller cannot tell a model that finished from a provider that refused.\n\n**The precedent is in the same directory.** `cs-opencode-turn` already treats this as its own case. Its header says provider-side API errors *\"surface only on the session's\"* record. It runs a post-check that is *\"REQUIRED even on exit 0\"*, and it exits **5, turn failed**. `cs-codex-turn` has no equivalent. Neither does `cs-claude-turn` (*0 ok, 2 turn timed out, 3 launch/setup failure, 1 usage/other*). It was not exercised by a provider error here, and it is named only because it has the same shape.\n\n**What it costs downstream.** A campaign harness that sees a finished turn and no reply concludes the member stopped. It answers with a continue and then a restart, and each re-sends the member's whole context into the limit that ended the turn. Three healthy members were written off as stuck that way. That half is filed in the campaign ledger as SAC-034, and the missing reason as SAC-035. This record is the place the reason is first lost.\n\n**How to reproduce.** Point `OPENAI_BASE_URL` at a stub that answers every model call with HTTP 429 and a rate-limit body, run one prompt through `cs-codex-turn`, and wait out codex's retries. Expected today: exit status 0, with the rollout's last `task_complete` carrying an `error`. Described from the observed records and from reading the driver; not yet run against a stub.\n\n**What would fix it.** Read the `task_complete` event the driver was waiting for. If it carries an `error`, exit with a failed-turn code as `cs-opencode-turn` does, and print the provider's message on stderr. Better still, classify it (throttled, at capacity, unauthorized, context too long, other) on a line a caller can parse. Include the provider's retry-after when it gives one.","notes":[{"date":"2026-09-20","text":"The `details` text was copy-edited so the repository's prose gate passes: long sentences were split and em-dashes removed, and no claim was changed. The text as filed is in commit c059533."},{"date":"2026-09-20","text":"The failure was reproduced with codex 0.152.1 against a stub provider. A refused turn ends with `task_complete` carrying `error.message` and `error.codex_error_info`, as the record describes. The second field is codex's own classification, and the driver reads it before it falls back on the message."},{"date":"2026-09-20","text":"The fix differs from what was asked in two places. The record asks for the provider's retry-after. Codex does not write that header to the rollout, so `retry_after` is parsed from the provider's message, and it is `-` when the message names no wait. `cs-claude-turn` was left alone, because no failed claude turn has been observed to take the shape from. SBX-051 holds that half."},{"date":"2026-09-20","text":"A failed turn still prints the session id. The TUI outlives the failure, so the caller can send the prompt again to the same session and does not need a restart."},{"date":"2026-09-20","text":"The driver has now been run against a real codex TUI in a sandbox, with a rate limit injected by `cs-sandbox lender fault`. It exited 5 after 32 seconds with `failure class=throttled retry_after=2`, and it printed the session id. A second turn sent to that session with `--uuid` met a throttle that cleared, exited 0 with the answer, and left one session file."}],"links":["SBX-045","SBX-046"]},{"id":"SBX-045","title":"The cs-codex wrapper gives codex no retry budget, so a rate limit that asks for seconds ends the turn in about a minute","type":"improvement","severity":"med","status":"closed","foundBy":"session agent operating two eight-member campaigns side by side on one host, reading every member's own CLI session records and the lender containers' logs after both campaigns had ended","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["aa6893c"],"integrated":[],"verified":"go test ./internal/cli/ -run TestCodexWrapperForwardsABaseURL -count=1: PASS, 6 cases. In the sandbox-slim image, the new wrapper and codex 0.152.1 made 13 requests against a stub that throttles inside the stream. That is 1 request and 12 retries, where codex's default made 6."},"resolution":"`cs-codex` puts `stream_max_retries=12` on the provider it declares. `CS_CODEX_STREAM_MAX_RETRIES` and `CS_CODEX_REQUEST_MAX_RETRIES` override the two counts, and an empty value leaves a count to codex.","details":"**What happened.** Under a provider's tokens-per-minute limit, every failing codex turn shows the same shape in its rollout: about five attempts some 13 seconds apart, then the turn ends with `rate limit exceeded … Please try again in 12.52s`. The provider was asking for 6 to 18 seconds. A member that had waited two or three minutes would not have failed the turn at all. A failed turn is expensive. It loses the turn's uncommitted work, and in a campaign it starts a recovery ladder that re-sends the whole context (the campaign ledger's SAC-034).\n\n**Why.** For a lent or proxied key the `cs-codex` wrapper passes codex one provider entry:\n\n    model_providers.cs-proxy={name=\"cs-proxy\", base_url=\"$OPENAI_BASE_URL\", \u003cauth>, wire_api=\"responses\"}\n\nIt sets no retry count and no stream retry count, and the seeded `config.toml` sets the model, the effort and the approval policy and nothing about retries. So codex runs on its defaults, and the five attempts in the records are those defaults. Codex documents per-provider `request_max_retries`, `stream_max_retries` and `stream_idle_timeout_ms`.\n\n**What is asked for.** A retry budget on that entry sized for an agent that is unattended for hours, where waiting is nearly free and a failed turn is not. It should be overridable, because the right number depends on the key's tier. Whether codex also honours the provider's retry-after between attempts was not established and is worth checking while here.\n\n**Not verified.** That raising these values changes the outcome under a real limit. It follows from the records and from codex's documentation, and it has not been tried. SBX-044 is needed either way: a longer budget makes the failure rarer, not visible.","notes":[{"date":"2026-09-20","text":"The `details` text was copy-edited so the repository's prose gate passes: long sentences were split and em-dashes removed, and no claim was changed. The text as filed is in commit c059533."},{"date":"2026-09-20","text":"These figures were measured with codex 0.152.1 against a stub provider. A rate limit delivered inside the response stream is retried `stream_max_retries` times, 5 by default, and codex waits the delay the provider's message names. That matches the five attempts in the campaign's records. An HTTP 429 status is never retried: with `request_max_retries=10` codex still made one request. A 503 is retried by both counts multiplied, 30 requests at the defaults. Codex stops counting stream retries at 100."},{"date":"2026-09-20","text":"The record's open question has an answer. Codex honours the wait in the provider's message, and it ignores the `Retry-After` header."},{"date":"2026-09-20","text":"The fix differs from what was asked. The record asks for a request retry count and a stream retry count. Only the stream count gets a default, because it is the one a rate limit spends. The request count does nothing for a 429 and multiplies the load on a 503, so it is passed only when set."},{"date":"2026-09-20","text":"The default is 12 and not higher for a measured reason. When a failure names no wait, codex doubles its own from 0.2 seconds with no cap. Twelve retries of a dead stream take about 14 minutes, and 14 retries take 55, which is past the turn driver's 30 minute timeout. With a named wait of 12 seconds, twelve retries last about two and a half minutes."},{"date":"2026-09-20","text":"The TUI shows `Reconnecting... 8/12` with `esc to interrupt` while it waits. `cs-codex-turn` reads that as working, so its stall watchdog does not end a turn that is retrying."},{"date":"2026-09-20","text":"The budget applies only where the wrapper declares the provider, which is when `OPENAI_BASE_URL` is set. A sandbox on a direct key uses codex's built-in provider and keeps codex's defaults."},{"date":"2026-09-20","text":"A real codex TUI sends two requests for each attempt, where the earlier stub run with `codex exec` showed one."},{"date":"2026-09-20","text":"The budget of 12 had a cost the first measurements missed, and the default is now 10. Codex spends the same counter on a `401 Unauthorized`, doubling its wait from 0.2 seconds. Measured with codex 0.152.1 against a stub that answers 401: the turn failed after 7 seconds at the default of 5 retries, and after 782 seconds at 12. In that run the eleventh request went out at 203 seconds, which is where a budget of 10 ends. SBX-057 holds the defect and the change."},{"date":"2026-09-20","text":"At 10 retries a throttle that asks for 12 seconds is waited out for about two minutes. That is the low end of the two or three minutes this record asked for. A key that is throttled often can raise `CS_CODEX_STREAM_MAX_RETRIES`, at the price of a slower failure on a bad credential."}],"links":["SBX-044"]},{"id":"SBX-046","title":"The lender logs every request and no response, so a provider throttle or outage cannot be seen from the host","type":"improvement","severity":"high","status":"closed","foundBy":"session agent operating two eight-member campaigns side by side on one host, reading every member's own CLI session records and the lender containers' logs after both campaigns had ended","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["1e9588a","713ae3b"],"integrated":[],"verified":"go test ./internal/lend/ -run 'TestTheLenderRecords|TestAThrottledSlot' -count=1 -race: PASS. Live, one sandbox with a lent key in front of a stub that answers 429. The lender logged `msg=answered sandbox=box slot=openai status=429 ms=1 retry-after=2` for each of 4 calls, and one throttling warning for the run. After `group rm` the log was on the host at mode 600, and it ended with the per-slot summary."},"resolution":"The lender logs an `answered` line for every call with the sandbox, the slot, the status and the time to the headers. A 429 or a 5xx adds the provider's retry-after and rate-limit headers. Outcomes are counted by slot and printed in the closing summary. A slot that is throttled or failing warns once a minute. The host copies a lender's log before it removes the lender.","details":"**What happened.** Two campaigns ran for hours at a provider's per-minute token ceiling, and half of one CLI family's turns were ended by it. The lender fronted every one of those calls. Its container log held a `lending` line for each: sandbox, slot, loan, method and path, more than two thousand lines across the two groups. It held **not one line recording what the upstream answered**: no status, no 429, no 5xx, no latency. The throttle was found hours later, by pulling each member's CLI session store out of its sandbox before destroy.\n\n**Why.** `Server.ServeHTTP` in `internal/lend/proxy.go` logs at the moment it decides to lend, then hands the request to an `httputil.ReverseProxy` that has a `Rewrite` and an `ErrorHandler` and no `ModifyResponse`. The response passes through untouched, which is right for the body and means the status is never looked at. `Stats` counts requests, lent, refused, tunnels and blocked, and nothing about outcomes.\n\n**Why it matters.** The lender is the one place on the host that sees every model call of every member of every group, for every provider it fronts. It is where *\"is the provider refusing us?\"* can be answered in one line, for any CLI, without reading a session format. Today a throttled key, a provider outage and a healthy quiet fleet produce the same log. An expired login already has this problem from the other side (SBX-030: the guest gets a bare 401 and nothing on the host says why).\n\n**What is asked for.** Record the upstream's answer per request: status, duration, and for 429 and 503 the `Retry-After` and any rate-limit headers the provider sends. Record headers and status only, never a body. Count outcomes in `Stats` by slot and status class, so the summary line reads, for example, `openai: 1011 lent · 214 throttled · 0 5xx`. Warn, once per slot per interval, when a slot starts being throttled or starts failing, so that it is loud at the time and not discoverable afterwards. Keep the log somewhere that outlives the group: it lives in the lender container's own log now, and destroying the group takes it.\n\n**How to reproduce the gap.** Create a sandbox with a lent key, and point the slot's origin at a stub that answers 429. Make a model call from the guest, and read the lender's log. It holds one `lending` line, identical to a success.","notes":[{"date":"2026-09-20","text":"The `details` text was copy-edited so the repository's prose gate passes: long sentences were split and em-dashes removed, and no claim was changed. The text as filed is in commit c059533."},{"date":"2026-09-20","text":"The fix differs from what was asked in where the lasting log is written. The record asks the lender to keep its log somewhere that outlives the group. The lender's mounts are read-only by design, because a process that holds real credentials writes nothing. The host copies the container's log when it removes a lender, and keeps the newest 20 for each group. A lender that is still running is read with `podman logs`, as before."},{"date":"2026-09-20","text":"The duration on each line is the time to the response headers, not the whole response. A stream's body can run for minutes, and whether the provider took the call is known when the headers arrive."},{"date":"2026-09-20","text":"The summary prints one line for each slot, for example `openai: ok 1011 · throttled 214 · refused 0 · 5xx 0 · no answer 0`. The record's example put `lent` on that line. That count is for the whole lender, so it stays on the first line."},{"date":"2026-09-20","text":"The live check found that the `lending` line printed a lent key's loan token. SBX-052 holds that, and it is fixed."}],"links":["SBX-030","SBX-044","SBX-047"]},{"id":"SBX-047","title":"Let the lender pace a key's traffic and absorb a throttle, and let tests inject provider faults through it","type":"feature-idea","severity":"med","status":"open","foundBy":"session agent operating two eight-member campaigns side by side on one host, reading every member's own CLI session records and the lender containers' logs after both campaigns had ended","opened":"2026-09-20","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"**The observation behind it.** Eight members of two campaigns shared one provider key whose limit was 500,000 input tokens a minute. Their combined demand, summed from their own session records, had a median of 483,000 a minute for the whole of both campaigns. Cached input was counted toward the limit in full. One member with a large context was enough to reach the ceiling by itself. An agent loop makes a request every ten seconds or so and each re-sends the whole context, so 145,000 tokens six times a minute is 870,000. Every member had to discover the limit separately, by failing. The members with the largest requests were the ones that lost the contention every time. Each failure cost a turn and, in a campaign, a recovery ladder that added to the load (the campaign ledger's SAC-034).\n\n**The idea.** No member can see the total. The lender can: every call on a key already passes through it. It could hold a per-slot budget and **queue** a request that would exceed it rather than forward it. When the provider throttles anyway, it could **wait the provider's retry-after and try again** instead of returning the 429. A CLI would then see latency and never a rate limit, for every CLI family at once. Two fleets on one key would become a queue rather than a fight. The budget has to be configured rather than guessed, because limits differ by key and tier. A stall watchdog downstream has to be able to tell a queued request from a wedged one, so queueing must be visible (SBX-046).\n\n**The caution.** The proxy's present virtue is that it never reads a body: *\"a stream passes through byte for byte and a request shape this build has never seen still works.\"* Pacing by tokens needs a size. The request's byte length is a usable proxy for it and keeps that property; parsing the body would not.\n\n**The second half, which is cheaper and may be worth doing first.** Because every call passes through the lender, it is also where provider faults can be **injected** for tests. It could answer the next N calls on a slot with 429, with 503, with a hang, with a 401. That gives this repository and the campaign repository a way to prove what a turn driver, a wrapper and a recovery ladder do under each fault. It needs a throwaway sandbox and not a real campaign. Every behaviour in SBX-044, SBX-045, SAC-034 and SAC-035 was learned from two four-hour campaigns because nothing cheaper could produce the condition.","notes":[{"date":"2026-09-20","text":"The `details` text was copy-edited so the repository's prose gate passes: long sentences were split and em-dashes removed, and no claim was changed. The text as filed is in commit c059533."},{"date":"2026-09-20","text":"This was measured while fixing the retry budget in SBX-045. Codex 0.152.1 never retries an HTTP 429 status, whatever its retry counts say. It retries only a rate limit delivered inside the response stream. A provider or gateway that throttles with a bare 429 ends a codex turn at once, and the lender is the only place that can absorb it."},{"date":"2026-09-20","text":"The second half is built, in commit df46cb7. `cs-sandbox lender fault \u003cname>` fails a sandbox's next lent calls with a status, a hang, a dropped connection or a supplied body, and the provider is not called. A live run armed a 503 and a 401 on a sandbox, and the calls came back with those statuses and an `X-Cs-Sandbox-Fault` header."},{"date":"2026-09-20","text":"The fault is armed on one sandbox, where the record describes it on a slot. A loan already resolves to its sandbox's directory, so the fault file sits beside the loans and goes when the sandbox does. It also lets one member be throttled while the rest run, which is the case a harness has to handle. A whole fleet is throttled by arming each of its members. `--slot` narrows a fault to one borrowed credential."},{"date":"2026-09-20","text":"`--body-file` exists because of what SBX-045 measured. A provider reports a rate limit inside a 200 stream, and codex retries that and not a 429 status. A status alone cannot reproduce the campaign's failure, so the operator supplies the provider's own event as the body."},{"date":"2026-09-20","text":"This record stays open for its first half, pacing a key's traffic and absorbing a throttle in the lender. That half needs a design for the budget, and nothing of it is built."},{"date":"2026-09-20","text":"Fault injection has now carried a whole rehearsal with no provider call. One sandbox with a lent key met an in-stream rate limit past the retry budget, then a throttle that cleared into a hand-written answer. `test/faults/` ships both bodies, and the manual has the recipe. Injected calls are logged with their method and path, which is how the two requests per attempt were seen."}],"links":["SBX-044","SBX-045","SBX-046"]},{"id":"SBX-048","title":"doctor reports an upstream that answered as one that does not answer, and its probe reaches every group on the host","type":"defect","severity":"high","status":"closed","foundBy":"session agent replaying a multi-member campaign through cs-vcr, several replays at a time on one shared host","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["d7fca43"],"integrated":[],"verified":"go test ./internal/cli/ -run TestReach -count=1: PASS, 4 cases. In the sandbox-slim image the same command returned 0 for a listener that answers every request with 429, and the listener logged 0 requests. It reported `connection refused` for a closed port and `name or service not known` for an unknown host. It gave up after 5s on an address that never answers."},"resolution":"doctor asks the lender's container to open a connection to each upstream, and it sends no request. A connection that opens counts as reachable. The lender's own health endpoint keeps `curl -f`, where anything but a 200 is a failure.","details":"**What happened.** Several campaigns were replayed at once on one host. Each used a `cs-vcr` proxy as the upstream of its lent credential. One person ran `cs-sandbox doctor`. For the members of every one of those campaigns it printed a line of this form: `NO  \u003cmember> sends its \u003cslot> traffic to \u003cupstream>, which does not answer: curl: (22) The requested URL returned error: 400`. The upstream had answered, with a 400. The hint printed under it, to use `host.containers.internal` and not `127.0.0.1`, did not apply either.\n\n**Why.** `lenderBox.probe` in `internal/cli/lend_box.go` runs `curl -fsS -o /dev/null -m 5` on the upstream address from inside the lender. The `-f` flag turns any status of 400 or more into a failure. The question the probe asks is whether the lender can reach the upstream, and any HTTP answer at all proves that it can. A provider's base address often answers a bare GET with 401, 404 or 405, so a healthy real upstream can read as unreachable too.\n\n**Why it matters.** The probe is a real request, and `doctor` sends it for every group on the host, including groups that belong to other people. A recording proxy counts such a request as one the recording never held, and a replay that had served every recorded call then fails. VCR-027 asks for the proxy's side of this to change. A `NO` on somebody else's sandbox also makes your own `doctor` end with a failure.\n\n**What is asked for.** Drop `-f`, so that a connection that completes counts as reachable whatever the status, and report the status beside it. Consider a HEAD or an OPTIONS request, which a recorder is less likely to take for a client's call. Consider limiting the upstream probe to the caller's own groups, or marking a line about another person's group as information.\n\n**How to reproduce.** Create a sandbox with `--lend-api-key` and an upstream that answers 400 to a GET on its base address. Run `cs-sandbox doctor`. It prints `does not answer` beside the 400.","notes":[{"date":"2026-09-20","text":"The fix differs from what was asked in three places. The record asks to drop `-f` and to print the status. The check now sends no request at all, so there is no status to print. A connection that opens already answers whether the lender can reach the upstream."},{"date":"2026-09-20","text":"HEAD and OPTIONS were not used, because a recorder may count those too. A connection that carries no request leaves a recorder nothing to count. As far as doctor is concerned, the recorder no longer needs the change VCR-027 asks for."},{"date":"2026-09-20","text":"The check still covers every group on the host. Nothing in the state records who owns a group, so there is no caller's own set to limit it to. A check that sends nothing costs another group nothing. A `NO` beside another group's upstream now means its lender cannot connect, which is worth seeing on a shared host."},{"date":"2026-09-20","text":"The hint about `host.containers.internal` now appears only when a connection fails, which is the one case it applies to."}],"links":["SBX-046"]},{"id":"SBX-049","title":"destroy on the last sandbox of a named group leaves the group's network, keepalive and gateway running, and says nothing","type":"improvement","severity":"low","status":"closed","foundBy":"session agent replaying a multi-member campaign through cs-vcr, several replays at a time on one shared host","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["6d2ae2e"],"integrated":[],"verified":"go test ./internal/cli/ -run TestDestroySaysWhenItEmptiesAGroup -count=1: PASS, 4 cases. The line appears for the last member of a named group, with and without `-f`. It does not appear for the default group or for a group with a member left."},"resolution":"When `destroy` empties a group other than `default`, it prints one line that names `cs-sandbox group rm \u003cgroup>`. Without `-f` it says the sandbox is the group's last.","details":"**What happened.** A person typed four commands by hand: `create \u003cname> --group \u003cgroup>`, `exec`, `fetch` and `destroy \u003cname>.\u003cgroup> --force`. The destroy printed `destroyed \u003cname>.\u003cgroup>` and nothing more. The host still held the group's keepalive container and its network. They were gone once the person ran `cs-sandbox group rm \u003cgroup>`.\n\n**Why it matters.** `create --group` makes the group when it is needed, so the person never typed a command that made one. Nothing tells them that `destroy` does not undo it. A named group that holds no sandbox is rarely wanted, and each one keeps a container, a network and a tap prefix.\n\n**What is asked for.** When `destroy` empties a group other than `default`, print one line that names `cs-sandbox group rm \u003cgroup>`. `destroy --dry-run` could list the same. Removing the emptied group automatically is the other choice, and it is a larger change in behaviour.\n\n**How to reproduce.** Run `cs-sandbox create a --group g`, then `cs-sandbox destroy a.g --force`, then `podman ps` and `podman network ls`.","notes":[{"date":"2026-09-20","text":"The fix takes the smaller of the two choices the record offers. The group is not removed automatically. `group.json` does not record whether `create --group` or `group create` made a group, so removal could take a group somebody made on purpose."},{"date":"2026-09-20","text":"The record suggests `destroy --dry-run` could list the same. `destroy` has no such flag. Running it without `-f` is its report, and the line is printed there."}],"links":["SBX-048"]},{"id":"SBX-050","title":"build --local-sandbox fails from a git worktree, and so do two unit tests","type":"defect","severity":"low","status":"closed","foundBy":"session agent, running `make check` from a git worktree while fixing SBX-044","opened":"2026-09-20","resolved":"2026-09-25","stint":null,"evidence":{"commits":["1b95c11"],"integrated":[],"verified":"As the record reproduces it: in a worktree of a scratch clone at 3b3e213, whose .git is a file, `go test ./internal/cli/ -run TestLocalModuleProxy` passes both proxy tests. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"The local module proxy zips from the checkout that holds the repository's git directory, which `git rev-parse --git-common-dir` names. A worktree shares its commits, so a build from one works. `--local-sandbox` is gone, and `build` packs its own commit through this proxy.","details":"`make check` failed in a checkout made with `git worktree add`. Two tests were the failures, `TestLocalModuleProxyInstallsAnUnpushedRevision` and `TestLocalSandboxMountsTheProxyAndOverridesGOPROXY`. The error from both was `could not find a recognized version control system`. The same commit passed from an ordinary clone.\n\nThe local module proxy zips the repository with Go's module zip code, which looks for a `.git` directory. In a worktree `.git` is a file that points at the main checkout. `cs-sandbox build --local-sandbox` takes the same path, so it fails for anyone who works from a worktree.\n\nTo reproduce, run `git worktree add ../wt origin/main`, then `go test ./internal/cli/ -run TestLocalModuleProxy` in `../wt`.\n\nResolving the worktree's real git directory before zipping would fix it. `git rev-parse --git-common-dir` names it.","notes":[],"links":[]},{"id":"SBX-051","title":"cs-claude-turn has no exit code for a turn the provider ended, and what claude records for one has not been observed","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, while fixing SBX-044, which names this driver as having the same shape","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["28dfd42"],"integrated":[],"verified":"go test ./internal/cli/ -run TestClaudeTurnReportsAProviderFailure -count=1: PASS, 5 cases, and 4 of them fail with the driver reverted. Live, a sandbox with a lent anthropic key and `cs-sandbox lender fault` armed. The old driver exited 0 and printed `API Error: Request rejected (429)` as the reply. The new one exited 5 with `class=throttled` for a 429, `class=capacity` for a 529 and `class=unauthorized` for a 401."},"resolution":"`cs-claude-turn` reads the last assistant message of the turn. When Claude Code flagged it `isApiErrorMessage`, the driver exits 5, prints the message on stderr, and prints `failure class=\u003cclass> retry_after=\u003csecs>` as `cs-codex-turn` does.","details":"`cs-claude-turn` documents *0 ok, 2 turn timed out, 3 launch/setup failure, 1 usage/other*. It has no code for a turn the provider refused. `cs-opencode-turn` exits 5 for that, and `cs-codex-turn` does too since SBX-044.\n\nNobody has yet observed what Claude Code writes to its session JSONL when a provider ends a turn with a rate limit or an outage. The codex fix began by producing that record against a stub provider, and this one should begin the same way. Point `ANTHROPIC_BASE_URL` at a stub that answers 429, run one prompt through `cs-claude-turn`, and read the last entries of the session file.\n\nIt matters for the same reason as SBX-044. A fleet harness that reads a refused turn as a finished one restarts a healthy member into the limit that refused it.","notes":[{"date":"2026-09-20","text":"The shape was observed with Claude Code 2.1.258 against a stub provider. A refused turn is an assistant entry with `isApiErrorMessage` true, a kind under `error` and the HTTP status under `apiErrorStatus`. The kinds seen were `rate_limit`, `server_error`, `authentication_failed` and `invalid_request`. A `turn_duration` marker follows it, so the turn is detected as complete."},{"date":"2026-09-20","text":"Only the last assistant message of the turn decides the outcome. Claude Code retries by itself, and a turn that met an error and then answered has succeeded."},{"date":"2026-09-20","text":"`retry_after` is `-` for every failure seen. Claude Code's message names no wait, and it does not record the provider's header."},{"date":"2026-09-20","text":"The live check for this record set `CLAUDE_CODE_MAX_RETRIES=2` to keep the runs short. With Claude Code's own default of ten retries the driver's stall watchdog ends the turn first, with exit 2, and this fix is never reached. SBX-058 holds that."}],"links":["SBX-044"]},{"id":"SBX-052","title":"The lender logs a lent API key's loan token on every call","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reading a lender's log during a live check of SBX-046","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["7cf508f"],"integrated":[],"verified":"go test ./internal/lend/ -run TestTheLenderRecordsWhatTheUpstreamAnswered -count=1: PASS, and it fails when the line logs the label. Live, the kept log of a sandbox with a lent key held 0 copies of its loan token, and its lines read `loan=loan_box_openai_98a9e5fb…`."},"resolution":"The `lending` line names a loan by its sandbox, its slot and the first 8 characters of its nonce. It never prints a label that equals the token.","details":"The lender's `lending` line prints `loan=\u003clabel>`. For a lent login the label is a short name, and the token is a forged credential file. A lent API key has no file, so `MintGuest` sets the label and the token to the same string. Every call by a sandbox with `--lend-api-key` therefore writes its working loan token to the lender's log.\n\n`Loan` documents the token as the secret. Inside the group's network it is enough to spend the host's key through the lender, for as long as the sandbox lives. Anyone who can run `podman logs` on the lender can read it, and SBX-046 now copies that log to the host's disk.\n\nTo reproduce, create a sandbox with `--lend-api-key openai`, make one model call, and compare the `loan=` value in `podman logs cs-sandbox-net-lender` with `OPENAI_API_KEY` inside the sandbox.","notes":[],"links":["SBX-046"]},{"id":"SBX-053","title":"Kept lender logs pile up for instance roots and groups that no longer exist","type":"defect","severity":"low","status":"closed","foundBy":"session agent, checking the host for leftovers after the fix for SBX-046 had been through `make ci` four times","opened":"2026-09-20","resolved":"2026-09-20","stint":"v2-fixes","evidence":{"commits":["421b162"],"integrated":[],"verified":"go test ./internal/cli/ -run 'TestStaleLenderLogs|TestStoppingALender' -count=1: PASS. A 30 day old log under another root went with its emptied directories, a day old log of another group stayed, and the log just kept was there."},"resolution":"When a lender's log is kept, every kept log older than 14 days is removed across all roots and groups, with the directories that empties. The 6 directories the gate runs had left on this host were removed by hand.","details":"SBX-046 made the host keep a lender's log under `~/.cache/cs-sandbox/lender-logs/\u003croot>/\u003cgroup>/`, and keep the newest 20 in each group's directory. Nothing removes a directory whose instance root or group is gone. Four runs of `make ci` left 6 directories there, one for each throwaway root the smoke tests made. A host that runs the tests, or makes groups with generated names, grows that tree without limit.\n\nTo reproduce, run `make test-smoke` twice and list `~/.cache/cs-sandbox/lender-logs`.\n\nThe renewer's per-root directory under `~/.cache/cs-sandbox/renewer` has the same shape and had 5 stale roots on this host. It holds a pid file and a log and grows more slowly. It is not part of this record.","notes":[{"date":"2026-09-20","text":"The smoke tests still write kept logs into the real cache, because they set the instances root and not `CS_SANDBOX_HOME`. The sweep bounds that at 14 days of runs. Pointing the tests at a cache of their own would stop it at the source."}],"links":["SBX-046"]},{"id":"SBX-054","title":"The lender logs a throttle delivered inside a 200 stream as a success","type":"improvement","severity":"high","status":"open","foundBy":"session agent, answering a consumer's question about which kind of throttle its failed turns had met","opened":"2026-09-20","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The lender records what an upstream answered from the status line and the headers, and it never reads a body. A provider can report a rate limit inside a `200` response stream, as a `response.failed` event whose error code is `rate_limit_exceeded`. The lender logs that call as `status=200`. It counts it as `ok`, and it prints no throttling warning.\n\nThis is the form codex retries, as measured for SBX-045, so it is the form a fleet at its limit is most likely to meet. For that fleet the lender's log and its per-slot summary still read as healthy, which is the gap SBX-046 set out to close.\n\nTo reproduce, arm `cs-sandbox lender fault \u003cname> --status 200 --content-type text/event-stream --body-file \u003cevent>` with such an event, make a call, and read the lender's log. An injected answer is not logged as `answered` at all, so the same event has to come from a stub upstream to see the `status=200` line.\n\nThe lender's rule is that a stream passes through byte for byte and is never parsed. Watching the first bytes of an event stream for a failure event, without holding or changing them, may keep that rule. It needs a design before it is built.","notes":[],"links":["SBX-046","SBX-045","SBX-047"]},{"id":"SBX-055","title":"create removes a lender that will not start again without keeping its log","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reading the lender's start path while answering when a lender's log is kept","opened":"2026-09-20","resolved":"2026-09-20","stint":"v3-ledger","evidence":{"commits":["7b3a6ea"],"integrated":[],"verified":"go test ./internal/cli/ -run TestALenderThatWillNotStartKeepsItsLog -count=1: PASS, and it fails with the change reverted. The fake runner shows `podman logs` before `podman rm -f`, and the log is on the host at the lender logs path."},"resolution":"`lenderBox.ensure` copies a lender's log to the host before it removes a container that will not start again.","details":"`lenderBox.ensure` finds a lender container that exists and is not running, tries to start it, and removes it with `podman rm -f` when it will not start. It does not call `keepLog` first. SBX-046 keeps a lender's log when `destroy`, `rm` or `group rm` removes the lender. This path handles a lender that died, which is when its log is most wanted.\n\nTo reproduce, stop a group's lender so that it cannot start again, for example by removing the staged binary it runs. Then run `create` with a lend flag in that group. The old container's log is gone and nothing is written under the lender logs directory.\n\nCalling `keepLog` before that removal would close it.","notes":[],"links":["SBX-046"]},{"id":"SBX-056","title":"Nothing inside a sandbox says whether an agent is in the middle of a turn, so a caller can only ask whether a turn driver is alive","type":"improvement","severity":"med","status":"closed","foundBy":"session agent maintaining a harness that computes each member's state from inside its sandbox","opened":"2026-09-20","resolved":"2026-09-20","stint":"v6","evidence":{"commits":["1010535"],"integrated":[],"verified":"go test ./internal/cli/ -run 'TestTurnDriversSay|TestStateAnswersForEverySession|TestOpenCodeStateAsks' -count=1: PASS, 23 cases across the three families, and tmux is never asked to create, type into or end a session. Live in one sandbox: all three answered `absent` before any session. During a throttled turn codex and Claude Code answered `busy retrying` and OpenCode `busy`, polled every 5 seconds from outside the drivers. With Claude's driver killed mid-turn, `pgrep` counted 0 drivers and `--state` still answered `busy retrying`. All three answered `idle` once the turns ended."},"resolution":"`cs-codex-turn --state`, `cs-claude-turn --state` and `cs-opencode-turn --state` print one line and exit 0: `busy`, `idle`, `blocked`, `unknown` or `absent`. The answer is the driver's own judgement, `detect_state` for codex and Claude Code and the server's session status for OpenCode, so it covers a turn the agent started itself. The shipped briefs document it.","details":"**The gap.** A harness that drives agents through `cs-\u003ccli>-remote` needs to know whether a member is working. The only signal it has from inside the sandbox is the process table: is a `cs-\u003ccli>-turn` driver alive for that CLI family? A driver wraps a turn that the host started, and it exits when that turn ends.\n\n**Where that goes wrong.** An agent CLI can start a turn of its own. A Claude Code session left a background command running and ended its turn, so the driver exited. When the command finished, the CLI's runtime delivered the result to the session as a new turn, and the session worked for forty more minutes. No driver wrapped that turn. The harness reported the member as stopped for all of it, and offered to nudge a session that was busy.\n\n**The knowledge already exists here.** Each turn driver decides whether its agent is still working, and none of them rests on its own presence to do it. `cs-claude-turn` and `cs-codex-turn` classify the TUI screen, where `esc to interrupt` means working. `cs-opencode-turn` asks the server, where a present `/session/status` entry means busy. That logic sits inside the drivers, so it only runs while a driver runs.\n\n**What is asked for.** A small command in the image that answers whether the agent is in a turn right now, whoever started the turn. It could be one command for each family, or one that takes the family. It should take the session name, as `cs-\u003ccli>-remote-status` does. It should print one word, such as `busy`, `idle` or `absent`, and exit 0 for all three. A caller can then run it inside one probe and parse the answer. It should be cheap enough to run every few seconds, and it must never start or wake a session. The drivers could then use the same code, so the two answers cannot disagree.\n\n**Why a file's age is not enough.** A caller can read the age of the session record, and one harness now prints it beside the state as evidence. It cannot decide the state. An agent that is blocked in one long tool call writes nothing to its record, and its turn is very much alive. The screen and the server know that, and a file does not.\n\n**How to see the gap.** In a sandbox, start a Claude Code session through `cs-claude-remote`. Have it run a long command in the background and end its turn. When the command finishes, the session goes on working, and `pgrep -f cs-claude-turn` finds nothing.","notes":[{"date":"2026-09-20","text":"The screen classification this record wants to share had a hole, found the same day. Claude Code retries a throttled or refused call for minutes with a pane that reads `Retrying in 14s · attempt 3/10`. It shows no `esc to interrupt`, so `cs-claude-turn` read it as `ready`. SBX-058 holds that and fixes it in the driver. A command built for this record should take that classification from the drivers and not copy it, so that such a fix reaches both. It may also want a fourth answer beside `busy`, `idle` and `absent`, because an agent waiting out a provider error is busy in a way a caller should not nudge."},{"date":"2026-09-20","text":"Taken up as a mode of the turn drivers, `cs-\u003ccli>-turn --state`, so the answer and the driver's own judgement are one function. With no handle it answers for every session of that family in the sandbox, which is what a probe that knows only the family can call. A harness of the kind this record describes starts its turns from another machine, so the session names live there and not in the member it probes."},{"date":"2026-09-20","text":"The build differs from what was asked in three places. It is a mode of each turn driver and not a separate command. The driver is one file that `cs-\u003ccli>-remote` copies to wherever the agent runs, so a flag on it shares the judgement with no second file to deploy or drift."},{"date":"2026-09-20","text":"It takes no session name. A probe of the kind this record describes runs inside the member and knows only the family, and the names live on the machine that started the turns. With no handle the command answers for every session of the family there: `busy` if any is, `idle` only if all are. `--tmux` or `--uuid` narrows it to one. A wrapper that takes a name was not built."},{"date":"2026-09-20","text":"It prints two words beyond the three asked for. `blocked` is a screen that needs a person. `unknown` is one the driver does not recognise, so that something new is never reported as `idle`. `busy` may carry a second word, `busy retrying`. A caller that nudges only on `idle` needs no change for any of them."},{"date":"2026-09-20","text":"The screen answers rest on text that codex 0.152.1 and Claude Code 2.1.258 print. The table test holds one pane for every state, and it is where a version bump that changes a screen will show."}],"links":["SBX-044","SBX-051","SBX-058"]},{"id":"SBX-057","title":"Codex and Claude Code retry a rejected credential for minutes, and the turn drivers wait with them","type":"defect","severity":"med","status":"closed","foundBy":"session agent, running a real codex TUI against injected faults after the fix for SBX-045. User questions (host) drove the rest: \"7mins is a long time to wait\", and \"no point waiting for 12mins if we have invalid creds\"","opened":"2026-09-20","resolved":"2026-09-20","stint":"v4","evidence":{"commits":["6aa8f6b","82ec1e5"],"integrated":[],"verified":"go test ./internal/cli/ -run 'TestCodexTurnCutsShort|TestClaudeTurnCutsShort' -count=1: PASS, 6 cases, and a 503 and a 429 retry are still waited out. Live, one sandbox lending all three providers with `cs-sandbox lender fault --status 401` armed. `cs-codex-turn` exited 5 with `class=unauthorized` after 7 seconds, and `cs-claude-turn` after 3 seconds. A second turn to the same codex session exited 0. A second Claude turn resumed the same conversation, with one session file that still held the first turn's prompt."},"resolution":"Both turn drivers read the refusal off the agent's pane while it retries, and report exit 5 with `class=unauthorized` within seconds. `cs-codex-turn` sends Esc, and the session stays up. `cs-claude-turn` ends the TUI, and the next turn resumes the conversation. Codex's default budget also went from 12 to 10, which bounds every other failure that names no wait at 3.4 minutes.","details":"A rejected credential does not get better with waiting, and two of the three agents wait anyway. Neither treats a `401` apart from a failure that waiting can fix, and neither has a setting for it.\n\nCodex keeps one retry count for every failure. A failure that names no wait doubles codex's own from 0.2 seconds. SBX-045 raised that count from 5 to 12 so that a rate limit is waited out, and a `401` spends the same count. Measured with codex 0.152.1 against a stub that answers 401: the turn failed after 7 seconds at 5 retries, and after 782 seconds at 12. Codex writes nothing to the rollout while it waits.\n\nClaude Code 2.1.258 has its own retry, and with its defaults it tries a `401` ten times. Under an injected 401 it sent ten requests over 2 minutes 27 seconds, and the pane then read `attempt 10/10` with a wait still to run.\n\nOpenCode 1.18.22 gave up on the same fault after 3 seconds and 2 requests, and `cs-opencode-turn` exited 5.\n\nThe failure is reported correctly in the end, as exit 5 with `class=unauthorized`. It is reported minutes late, and a caller whose timeout is shorter sees a timeout. The cases that reach a guest as a 401 are an expired host login, which SBX-030 holds, a revoked key, and a loan the lender no longer knows.\n\nTo reproduce, create a sandbox with a lend flag, arm `cs-sandbox lender fault \u003cname> --status 401 --count 500`, and run one prompt through the agent's turn driver.","notes":[{"date":"2026-09-20","text":"Esc was tried for Claude Code first and did not work. The sandbox's Claude runs in vim mode, where the first Esc only leaves insert mode. The second one interrupts, and it puts the prompt back in the input box. A Claude left retrying writes its completion marker into the next turn."},{"date":"2026-09-20","text":"The drivers match text that codex 0.152.1 and Claude Code 2.1.258 print. When an agent changes that text the match stops, and the turn waits out the agent's own retries as before. It still ends as exit 5 with the same class."}],"links":["SBX-030","SBX-045","SBX-058"]},{"id":"SBX-058","title":"cs-claude-turn reports a turn that Claude Code is still retrying as stalled","type":"defect","severity":"high","status":"closed","foundBy":"user question (host): \"you have to test this across all three agent's right?\", answered by running all three turn drivers against an injected 429","opened":"2026-09-20","resolved":"2026-09-20","stint":"v4","evidence":{"commits":["5b7a7a5"],"integrated":[],"verified":"go test ./internal/cli/ -run TestClaudeTurnWaitsOutClaudesOwnRetries -count=1: PASS, and it exits 2 with the change reverted. Live, under an injected 429 with Claude Code's default retries, the driver exited 5 with `class=throttled` after 228 seconds. Before the change it exited 2, stalled, at 181 seconds."},"resolution":"`cs-claude-turn` reads a pane that shows `Retrying in \u003cn>s · attempt \u003cn>/\u003cm>` as working, so the stall watchdog leaves a retrying turn alone.","details":"Claude Code 2.1.258 has its own retry, and with its defaults it tries a `429` ten times. It waits the provider's `Retry-After` and then longer, about 3 minutes 40 seconds in all. While it waits, the pane reads `429 … · Retrying in 14s · attempt 10/10`, the session file does not grow, and the words `esc to interrupt` are absent. `cs-claude-turn` reads that pane as `ready`. Its stall watchdog then ends the turn after 180 seconds with exit 2 and `turn stalled`.\n\nMeasured on a sandbox with a lent key and `cs-sandbox lender fault --status 429 --retry-after 12`. The exit status of the driver was 2, at 181 seconds. Claude Code wrote its flagged error message and the `turn_duration` marker at 218 seconds, to a driver that had gone.\n\nA caller is told that a throttled member stalled, while the member is still working in its TUI. A fleet harness answers a stall with a restart, which re-sends the whole context into the limit. That is the outcome SBX-044 and SBX-051 were filed to prevent. The fix for SBX-051 was verified with `CLAUDE_CODE_MAX_RETRIES=2`, which ends before the watchdog, so it did not meet this.\n\n`cs-codex-turn` is not affected, because codex shows `esc to interrupt` while it reconnects. `cs-opencode-turn` waits on the client's exit and has no such watchdog. Under the same fault it exited 5 after 64 seconds and 9 requests.","notes":[],"links":["SBX-044","SBX-051","SBX-056"]},{"id":"SBX-059","title":"cs-opencode-turn fails a turn with exit 5 and prints no failure class","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, running all three turn drivers against an injected 429 and an injected 401","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["fc37321"],"integrated":[],"verified":"`go test ./internal/cli/ -run TestOpenCodeTurnCompletionSemantics -count=1` passes, and its provider error case now wants `failure class=unauthorized retry_after=-`. In a real sandbox a 429 with `Retry-After: 7` was injected on a lent key. `cs-opencode-turn` exited 5 after 41 seconds and printed `failure class=throttled retry_after=7`. The wait came from the response headers OpenCode keeps on the error."},"resolution":null,"details":"`cs-codex-turn` and `cs-claude-turn` end a turn the provider refused with exit 5 and a line a caller can parse, `failure class=\u003cthrottled|capacity|unauthorized|context|other> retry_after=\u003csecs|->`. `cs-opencode-turn` exits 5 too, and prints only `session postcheck: error:\u003cname>:\u003cmessage>`. A caller that handles all three families has to read OpenCode's message text to tell a throttle from a rejected credential.\n\nBoth figures were measured under `cs-sandbox lender fault`. A 429 ended the turn after 64 seconds and 9 requests with `error:APIError:Rate limit reached`. A 401 was over in 3 seconds and 2 requests, and the message was `error:APIError:Incorrect API key provided`. This repository's fixture for a failed OpenCode turn carries the provider's status as `data.statusCode`. If the session record does hold it, the class can come from that and not from the text.","notes":[{"date":"2026-09-20","text":"The class is read from `data.statusCode` first, as the record suggested, and from the message only when there is no status. A turn that failed for a reason that is not the provider's, such as an incomplete reply, still prints no class line."}],"links":["SBX-044","SBX-051"]},{"id":"SBX-060","title":"A turn's end is written only to the caller's output, so nothing on the agent's own machine says how its last turn ended","type":"improvement","severity":"high","status":"closed","foundBy":"session agent, maintainer of this repository and of a harness that drives these tools, while designing how that harness should read a failure class","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["fc37321","b16ae35"],"integrated":[],"verified":"`go test ./internal/cli/ -count=1` passes with the new `turn_log_test.go`. The provider failure tests for all three drivers fail against the old drivers with `ended a turn and left no line`. In real sandboxes, a codex turn refused with an injected rate limit left `5 throttled 12.5 turn failed: rate limit exceeded` in `~/.cs-turns/codex.log`. An opencode turn left `5 throttled 7`, and a successful turn left `0 - - -`. A fleet harness read those lines through its probe and waited the throttle out. Claude was checked by unit test only, because the host's login had expired."},"resolution":null,"details":"**What is missing.** The turn drivers now say why a turn ended. `cs-codex-turn` and `cs-claude-turn` exit 5 and print `failure class=\u003cclass> retry_after=\u003csecs>` (SBX-044, SBX-051). That line goes to the driver's standard error. With `cs-\u003ccli>-remote -b` it ends up in a log file on whichever machine started the turn. Nothing is left on the machine where the agent runs.\n\n**Why that is the wrong place for a harness.** A harness that supervises many agents asks each agent's machine about that agent, in one round trip. That is how it already learns whether an agent is in a turn (`--state`, SBX-056). The reason a turn ended is a fact of the same kind, and today it cannot be asked for there. The machine that started the turn may be a different one for every agent. It may be another sandbox, and it may be gone. A harness that wants the reason has to find the right log on the right machine and parse a line meant for a person. One such harness does not read the reason at all. It treats a throttled agent as one that stopped, and it restarts the agent into the same rate limit.\n\n**What is asked for.** Each driver appends one line to a turn log in the agent's home when a turn ends, for every exit code and not only 5. The line holds:\n\n- when the turn ended, in epoch seconds;\n- the driver's exit code;\n- the failure class, or `-` when there is none;\n- the provider's requested wait, or `-`;\n- the first line of the provider's message, or of the driver's own error.\n\nThe log is append-only and bounded, so an old line is dropped and never rewritten. One format serves all three agent families, so a caller needs no knowledge of which CLI wrote it. A successful turn is recorded too. A caller can then tell that the newest turn ended well and that an older failure no longer applies.\n\n**What it must not do.** It must not change any exit code or any line the drivers print today. `--state` must not write to it, because asking is not a turn. A driver that cannot write the log must still finish the turn and report it as before.\n\n**How to see the gap.** Run a turn that the provider refuses, using `cs-sandbox lender fault \u003cname> --status 429`. The caller is given exit 5 and the class line. Then look in the sandbox for any trace of how that turn ended. There is none outside the agent's own session record, which has a different format for each CLI.","notes":[{"date":"2026-09-20","text":"The log is written by an EXIT trap in each driver, so every exit path is covered by one piece of code. `--state`, `--help` and a usage error write nothing. A driver that is killed writes nothing, so a missing line means the ending is not known. The file keeps between 200 and 400 lines, and `CS_TURN_LOG` names another path."}],"links":["SBX-044","SBX-051","SBX-056","SBX-059"]},{"id":"SBX-061","title":"A remote tool deploys the turn driver from the caller's home, so an older install there silently replaces a newer image's driver","type":"defect","severity":"high","status":"closed","foundBy":"session agent, maintainer of this repository, during a live check of a sandbox built from a newer checkout on a host that also had an older install of the tools","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["e2233f0","6ebe054"],"integrated":[],"verified":"`TestRemoteDeploysTheDriverItShipsWith` passes for all three families. Against the old tools it fails with `deployed \"# STALE\"`. In a real sandbox, with an older `cs-codex-turn` in the caller's `~/.local/bin`, a turn started with the newer tools from their own directory. The guest's driver answered `--state` afterwards and wrote its turn log. Before the change the same turn had replaced the guest's driver with the older one."},"resolution":null,"details":"**What happens.** `cs-codex-remote`, `cs-claude-remote` and `cs-opencode-remote` copy a turn driver into the machine they drive before every turn, whenever its checksum differs from theirs. The copy replaces whatever driver is there. The driver they send is `$HOME/.local/bin/cs-\u003ccli>-turn` on the calling machine, wherever the remote tool itself was run from.\n\n**Why that is wrong.** A remote tool and its driver are one version of one thing. They ship together and are installed side by side. The caller's home is a different place with its own history. A host can hold an older install in `~/.local/bin` and also run newer tools from a pinned directory, which is what a project that pins its tools does. The newer remote tool then sends the older driver. The machine ends up with a driver that matches neither its image nor the tool that started the turn.\n\n**What it looked like.** A sandbox was built from a checkout whose drivers know `--state` and write a turn log. The image held those drivers, checked by reading the file in the guest. One turn was started from the host with the newer `cs-codex-remote`, run from its own directory. After that turn the guest's driver no longer knew `--state`, and no turn log was written. The file had been replaced with the host's older copy. The turn succeeded, and nothing anywhere said the driver had changed.\n\n**Why it matters more for a fleet.** A harness starts its supervisor's turns from the host, and the supervisor starts the workers' turns from inside its own sandbox. So the supervisor runs the host's driver and the workers run the image's. Two driver versions then sit in one fleet. Which failures each member can classify, and whether it can report that it is in a turn, depends on what somebody installed on the host months ago.\n\n**How to reproduce.** Put an older `cs-codex-turn` in `~/.local/bin`. Install newer tools in another directory and put it first on `PATH`. Create a sandbox from the newer image and run one turn with `cs-codex-remote -H \u003csandbox>`. Compare the checksum of `~/.local/bin/cs-codex-turn` in the guest before and after.\n\n**What would fix it.** Send the driver that sits beside the remote tool. Fall back to `~/.local/bin` only when there is none beside it, and keep `CS_\u003cCLI>_TURN_SRC` as the explicit override.","notes":[{"date":"2026-09-20","text":"The fix broke the macOS leg of CI within minutes of landing, and the cause is worth keeping. The deploy step compares checksums with `md5sum`, which macOS does not have. That line was older than this record. It had never run in a test, because the step returned early wherever no driver source was found, and a test's empty home held none. Once the driver beside the tool was always found, the step always ran, and three tests failed on macOS with `md5sum: command not found`. The same line would have stopped a real turn started from a Mac. The tools now take a file's MD5 from `md5sum` or from `md5`, on both sides of the copy. `TestRemoteDeploysWithoutMd5sum` runs all three tools on a PATH that holds everything but `md5sum`, so the next slip of this kind fails on Linux."}],"links":["SBX-056","SBX-060"]},{"id":"SBX-062","title":"A turn that ended because no provider answered is classed as other, which tells a caller to try again at once","type":"defect","severity":"med","status":"closed","foundBy":"session agent, maintainer of this repository, measuring a real codex turn while every model call was dropped for five minutes","opened":"2026-09-20","resolved":"2026-09-20","stint":null,"evidence":{"commits":["a9127e1"],"integrated":[],"verified":"`TestCodexTurnReportsAProviderFailure` passes with the measured message as a new case. In a real sandbox every model call was dropped. Codex ended the turn after 4m51s with `failure class=unreachable retry_after=-`. OpenCode ended it after 1m15s with the same class, on the message `Cannot connect to API: The socket connection was closed unexpectedly`. Both turn logs carried `5 unreachable`. The words Claude Code uses for a failed connection were not captured, and its rule is a guess from the SDK's error text."},"resolution":null,"details":"**What was measured.** A sandbox borrowed a provider key, and `cs-sandbox lender fault \u003cname> --hang 1s --count 600` dropped every model call unanswered. Codex retried by itself for five minutes and then ended the turn. The exit code of `cs-codex-turn` was 5, and its class line was `failure class=other retry_after=-`. The message was `stream disconnected before completion: error sending request for url`, and codex's own `codex_error_info` was `other`. A shorter outage of 100 seconds was never seen by the caller. Codex rode it out and the turn succeeded.\n\n**Why `other` is the wrong class.** The classes exist so that a caller can choose a move. The documented move for `other` is to try once or twice and then escalate. For a fleet harness that means its recovery ladder, which sends the agent's whole context again and then restarts the session. None of that helps when the network is down, and the agent did nothing wrong. The right move is the one for `throttled` and `capacity`: wait, then carry the same session on. A caller cannot tell the two apart without reading the message text, which is what the class line was added to avoid.\n\n**What is asked for.** A class of its own, `unreachable`, for a turn that ended with no answer from any provider. That covers a connection that was refused or dropped, a name that did not resolve, and a lender that was gone. All three drivers should print it, and the t
