  <body>
    <script id="ledger-data" type="application/json">{"project":"sandbox","staleAfterDays":14,"records":[{"id":"SBX-001","title":"Building a microVM's image-store disk holds the whole store in memory","type":"defect","severity":"high","status":"open","foundBy":"session agent, while reading internal/fcdisk/cache.go","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`Cache.StoreDisk` tars a shared image store inside a helper container and captures the archive through the `run.Runner` seam (`internal/fcdisk/cache.go:140`). `run.Exec.Run` collects a command's stdout into a `bytes.Buffer` and returns it as a string, so the entire tar lands in memory. `os.WriteFile` at line 147 then converts that string to a byte slice, which copies it a second time.\n\nA shared store exists to hold container images, so its size is measured in gigabytes rather than megabytes. This project's own image is 9.3 GB, or 693 MB for the CI slim build. Seeding a store with it and creating a microVM against that store asks the host for roughly twice the store's size in resident memory, at once.\n\nTo see it, run `cs-sandbox seed-store big \u003ca large image>` and then `cs-sandbox create x --engine firecracker --image-store big`, watching the RSS of the `cs-sandbox` process. The miss path is the one that costs: a cache hit returns early at line 128 and never tars anything.\n\nThe smoke test that covers this path (`TestCLINestedSandboxInVMLive`) defaults to the slim image, so CI never reaches a size where the allocation hurts. Streaming the tar to the temp file, rather than through a captured `Result`, would keep the cost flat.","notes":[{"date":"2026-08-16","text":"Unchanged, and the cost is still only paid on a cache miss: internal/fcdisk/cache.go returns early at line 128 on a hit and never tars anything. The CI smoke profile uses the 693 MB slim image, so the runner never reaches a size where the allocation hurts."}],"links":[]},{"id":"SBX-002","title":"A pid file that outlives a host reboot can make stop signal an unrelated process","type":"defect","severity":"high","status":"open","foundBy":"session agent, while reading internal/engine/firecracker_proc.go and internal/forward/forward.go","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Two places decide a tracked process is alive by sending signal 0 to a recorded pid, and neither checks that the process is the one they recorded. `fcRunning` reads `\u003cinstance>/fc.pid` for a microVM (`internal/engine/firecracker_proc.go:132`). `alive` reads the pid out of a forward record for a detached `ssh -N` child (`internal/forward/forward.go:244`).\n\nBoth records live under the instances directory, which survives a host reboot, and nothing sweeps them at boot. Linux issues pids from a counter that restarts low after a reboot and wraps, so a number recorded before the reboot can belong to something else after it.\n\nThe consequences follow from the check alone. `cs-sandbox ls` reports a dead microVM as running, `start` refuses it as already up, and `stop` sends SIGTERM and then SIGKILL to whatever now holds the number (`killFirecracker`). `unforward`, `rm` and `destroy` reach the same code for forwards. The victim is another process of yours, because a pid you can signal is one you own.\n\nReproduce it by creating a Firecracker sandbox, rebooting the host, and comparing `cat \u003cinstance>/fc.pid` against `ps -p \u003cpid>`. Recording the process start time from field 22 of `/proc/\u003cpid>/stat` beside the pid, and requiring both to match, closes it without a new dependency.","notes":[],"links":[]},{"id":"SBX-003","title":"Building a --snapshot disk changes the permissions of the caller's own files","type":"defect","severity":"med","status":"open","foundBy":"session agent, while reading internal/fcdisk/fcdisk.go","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`BuildExt4Dir` runs `find \"$FC_DIR\" ! -readable -exec chmod u+rX {} +` over its source directory before `mke2fs -d` reads it (`internal/fcdisk/fcdisk.go:143`). The pre-pass was added for image stores, which carry the mode-0000 `/etc/gshadow` that every distro base image ships, and which would otherwise stop the build dead.\n\n`buildSnapshotDisks` passes the user's own host path as that directory (`internal/engine/firecracker.go:601`). So `--snapshot`, documented as a read-only point-in-time copy of a host directory, edits the source it claims only to read.\n\nfakeroot does not contain the change. It records the intended mode in its own database and still issues a real `chmod`, which lands on disk. Measured directly: a file created 0000, passed through `fakeroot -- bash -c 'find \u003cdir> ! -readable -exec chmod u+rX {} +'`, comes back 0600.\n\nReproduce it with `chmod 000 ~/keys/secret`, then `cs-sandbox create x --engine firecracker --snapshot ~/keys`, then `stat -c %a ~/keys/secret`. The image-store path already unpacks into a temp tree first (`internal/fcdisk/cache.go`), which is where the pre-pass belongs for a snapshot too.","notes":[],"links":[]},{"id":"SBX-004","title":"A microVM silently drops its fifteenth shared disk","type":"defect","severity":"med","status":"open","foundBy":"session agent, while reading image/guest/init","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The guest init walks its auxiliary disks with a fixed letter list, `_letters=(c d e f g h i j k l m n o p)` (`image/guest/init:236`). That covers `/dev/vdc` through `/dev/vdp`, which is fourteen devices, and `--repo`, `--snapshot` and `--image-store` all advance the same cursor.\n\nPast the fourteenth the index reads off the end of the array. The script does not run under `set -u`, so the expansion is empty, the device path becomes `/dev/vd`, the `[ -b ]` test fails, and the loop moves on without printing anything.\n\nNothing on the host side caps the count. `fcconfig.Build` sizes the drive list from the spec, and no caller validates it. So `create` attaches fifteen drives, reports success, and hands back a sandbox missing one of the directories you asked for. A repo you expected at `~/\u003cname>` is absent.\n\nThe Podman engine bind-mounts each share and has no such limit, so the same command line means different things on the two engines. Either reject the fifteenth share in `create` with a clear message, or extend the guest past `vdp`.","notes":[],"links":[]},{"id":"SBX-005","title":"An undocumented environment variable can publish sandbox SSH beyond loopback","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while comparing the CS_SANDBOX_* variables in the code against the ones in the docs","opened":"2026-08-15","resolved":"2026-08-22","stint":"2026-08-22 spec/code alignment pass","evidence":{"commits":["4281690"],"integrated":[],"verified":"`grep -rn CS_SANDBOX_SSH_BIND *.md` returned nothing before and now returns two lines: MANUAL.md's second Environment table, with the 127.0.0.1 default, and SPEC.md §13, where the paragraph beside R142 gives the cost. `grep -c CS_SANDBOX_SSH_BIND .cs-lint.yaml` returned 1 before and returns 0 now, and `make walkthrough` passes without the waiver: `0 error(s), 0 warning(s), 3 skipped`."},"resolution":"Documented rather than validated, which is the first of the two options this record asked for. R142 stated an absolute the code did not hold; it now states the loopback default and the opt-in the way R143 states --privileged, with the cost beside the rule. `create` still accepts any bind, so the override is a documented choice rather than a rejected one.","details":"R142 in SPEC.md §13 states that SSH ports must bind `127.0.0.1` only. `internal/cli/root.go:174` reads `CS_SANDBOX_SSH_BIND`, defaulting it to `127.0.0.1`, and passes the value through unvalidated. It reaches podman's publish flag at `internal/engine/podman.go:95` and the microVM's host forwarder at `internal/engine/firecracker.go:285`, and a group's gateway takes the same value.\n\nSo `CS_SANDBOX_SSH_BIND=0.0.0.0 cs-sandbox create web` puts that sandbox's SSH port on every interface of the host, on both engines. Confirm it with `ss -ltnp | grep \u003cport>` after the create.\n\nNo document mentions the variable. Sandboxes accept key authentication only, so this is not an open door. It moves a boundary the spec states as a requirement, and it does so through a name a reader can only find in the source.\n\nDecide which one is true. Either the spec should describe the override and what it costs, or `create` should reject a non-loopback value. The rule is that a flag with a cost says so where the reader meets it.","notes":[{"date":"2026-08-16","text":"CS_SANDBOX_SSH_BIND is still undocumented, and is now the only environment variable that is: the Environment tables in MANUAL.md gained CS_SANDBOX_ENGINE on this date and cover every other one. Documenting it without validating it would publish the override rather than fix R142."},{"date":"2026-08-17","text":"CS_SANDBOX_GROUP and CS_SANDBOX_TZ were undocumented too, and SBX-017 has now added both. CS_SANDBOX_SSH_BIND is genuinely the only one left, and it stays undocumented until the decision this record asks for is made."},{"date":"2026-08-17","text":"`cs-lint walkthrough` would report the variable as read and undocumented, which is what this record says. The waiver sits in .cs-lint.yaml under walkthrough.envInternal and names this record as the reason, so it goes when the decision is made."},{"date":"2026-08-22","text":"Decision made: the spec describes the override. R54 gained the same treatment in the same pass, because `forward --bind` has the shape R142's override has. Its cost differs: a forwarded port carries whatever authentication the sandbox service has, which is often none."}],"links":["SBX-006"]},{"id":"SBX-006","title":"CS_SANDBOX_ENGINE selects the engine and appears in no document","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while comparing the CS_SANDBOX_* variables in the code against the ones in the docs","opened":"2026-08-15","resolved":"2026-08-16","stint":"2026-08-16 publication readiness","evidence":{"commits":["98c42cc"],"integrated":[],"verified":"`grep -rn CS_SANDBOX_ENGINE *.md` returned nothing before and now returns MANUAL.md's Environment table, second group, with the podman default the flag parser applies."},"resolution":null,"details":"`internal/cli/create.go:65` defaults the `--engine` flag from `CS_SANDBOX_ENGINE`. Grepping the markdown for that name returns nothing, in MANUAL.md or anywhere else.\n\nSo a user on a Linux host with KVM who wants Podman has to pass `--engine podman` on every create. The alternative is reading the source to learn that one export would do it. The variable is the closest thing the tool has to a user-level engine default, and it is invisible.\n\nMANUAL.md is where a flag's meaning lives, by the table in CONTRIBUTING.md, so the entry belongs beside `--engine` there.","notes":[{"date":"2026-08-17","text":"The closing evidence said the Environment table carries \"the podman default the flag parser applies\". The parser applies no default: internal/cli/create.go reads envOr with an empty fallback, and the effective engine is firecracker on Linux with KVM. SBX-017 updates the table."}],"links":["SBX-010"]},{"id":"SBX-007","title":"The first install path in INSTALL.md leads to an empty releases page","type":"defect","severity":"med","status":"in-progress","foundBy":"session agent, while checking INSTALL.md against the repository's tags","opened":"2026-08-15","resolved":null,"stint":"2026-08-16 publication readiness","evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"INSTALL.md §1 offers two ways to get the binary, and leads with \"Download a release\": grab `cs-sandbox_\u003cversion>_\u003cos>_\u003carch>.tar.gz` and `checksums.txt`, verify the checksum, then verify the cosign signature.\n\nNothing is published behind that. `git ls-remote --tags origin` returns no output, so the repository has never been tagged, and `.github/workflows/release.yml` fires on a tag. The releases page is empty.\n\nA first-time reader takes the first path offered, finds nothing to download, and has to work out that only the second half of the section works today. That is the worst moment in the documentation to lose someone.\n\nCutting a first tag closes it and makes the whole section true at once. Until then, lead the section with the source build and say plainly that no release is published yet.","notes":[{"date":"2026-08-16","text":"Still open because no v* tag exists. The release path itself was verified this week: `make release-check` validates the manifest and `make snapshot` builds every target, so what is missing is the tag rather than the machinery. Closes when the first release is published."},{"date":"2026-08-17","text":"INSTALL.md now says plainly that no version has been tagged and the releases page is empty, which is the sentence the tracer repository already carries. The section still leads with the release route rather than the source build, matching the sibling projects. This record stays open until a tag exists."}],"links":[]},{"id":"SBX-008","title":"The in-use guard on rm-store cannot see a microVM that reads the store","type":"defect","severity":"low","status":"open","foundBy":"session agent, while reading internal/store/store.go","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`Manager.Remove` refuses to delete a shared image store that is in use, and it establishes use with `podman ps -a --filter volume=cs-sandbox-shared-\u003cname>`. That query finds container sandboxes and nothing else.\n\nA Firecracker sandbox reads a store as a read-only ext4 disk built from the volume, and holds no podman container against it. So `cs-sandbox rm-store big` succeeds while every microVM on the host is mounting `big`, and the error that would have named those sandboxes never appears.\n\nNothing breaks at that moment, because the cached disk under the artifact cache keeps running VMs and their restarts alive. The next `create --image-store big` fails with \"volume does not exist\", a long way from the command that caused it.\n\nThe check reads as a safety net, which is why the blind spot matters more than the immediate damage. Instance state already records the answer: `state.Instance.Shared` holds the store names a sandbox was created with.","notes":[],"links":[]},{"id":"SBX-009","title":"The spec says a group's tap prefix is never reclaimed, and the code reclaims it","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while checking SPEC.md §17's open questions against the code","opened":"2026-08-15","resolved":"2026-08-16","stint":"2026-08-16 publication readiness","evidence":{"commits":["98c42cc"],"integrated":[],"verified":"Read against internal/cli/group_commands.go:249: allocTapPrefix builds `taken` from state.ListGroups, so a removed group's prefix is absent and returns to the pool. Open question 2 now says that, and names the collision it leaves unmeasured."},"resolution":null,"details":"Open question 2 in SPEC.md §17 reads: \"A group's tap prefix is allocated and never reclaimed within a host's lifetime. Whether exhaustion is reachable in practice has not been measured.\"\n\n`App.allocTapPrefix` builds its taken set from the groups that exist right now (`internal/cli/group_commands.go:246`) and returns the lowest `fd%04x` not in it. A removed group is not in `state.ListGroups`, so its prefix is free again on the next allocation. Exhaustion needs 65536 groups alive at once, which answers the second sentence too.\n\nThe live hazard runs the other way, and the open question does not name it. A reissued prefix is only safe because `removeGroup` drops the host-route leg, takes the fabric down and reclaims the network before the group record goes. That ordering is what a reader should be warned about, rather than an exhaustion that cannot happen.\n\nRewrite the open question as a statement of what the allocator does, or close it.","notes":[],"links":[]},{"id":"SBX-010","title":"Give a user a persistent way to choose the default engine","type":"feature-idea","severity":"low","status":"open","foundBy":"SPEC.md §17, open question 1","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The engine default is derived from the host: Firecracker on x86_64 Linux with a usable `/dev/kvm`, and Podman everywhere else (`internal/cli/create.go:25`). Open question 1 in SPEC.md §17 asks whether a user-level default should override that, and where it would be configured.\n\nThere is a real reason to want one. A developer on a KVM host who is debugging a container-engine behaviour, or who wants the faster create path, repeats `--engine podman` on every command that creates something.\n\nHalf the mechanism already exists and is undocumented: `--engine` defaults from `CS_SANDBOX_ENGINE`. The open question is really whether that is the whole answer, or whether the tool should grow a config file for it.\n\nAn environment variable is the cheaper answer and fits a tool that keeps no host-wide config today. Documenting it and saying so in the spec would close the question without new code.","notes":[],"links":["SBX-006"]},{"id":"SBX-011","title":"Nothing reclaims the data that rm leaves behind","type":"improvement","severity":"med","status":"open","foundBy":"SPEC.md §17, open question 3","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`cs-sandbox rm` deliberately keeps a sandbox's home so that `create` with the same name reuses it. `internal/engine/orphan.go` makes that data visible: `ls` shows it with status `removed` and an age, and `destroy` purges it.\n\nWhat is missing is any pressure to act. Open question 3 in SPEC.md §17 records this as undecided. A host used daily accumulates a microVM `rootfs.ext4` or a `cs-sandbox-home-\u003cname>` volume per removed sandbox, each holding a full home directory. Only a human reading the `ls` output will ever notice.\n\nThe pieces for a policy are already there. `Orphan.Since` carries the age, and the Firecracker artifact caches already prune on a TTL that `CS_SANDBOX_FC_REPO_CACHE_TTL_DAYS` controls.\n\nA `prune` verb that purges orphans older than a TTL would follow the pattern the caches already set, and would keep deletion explicit rather than automatic. Reporting the total size that `removed` data occupies would be the smaller first step.","notes":[],"links":[]},{"id":"SBX-012","title":"Agent sandboxes in one group can SSH into each other, and only --solo prevents it","type":"feature-idea","severity":"med","status":"open","foundBy":"SPEC.md §14, first limitation","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"SPEC.md §14 records the boundary honestly: agent sandboxes in a group share that group's agent tier key, so any of them can SSH into any other in the same group. Agents are walled off from you and from your user sandboxes, and not from each other.\n\nThat is the right default for the driving pattern the README shows in walkthrough 7, where one agent runs a session on another. It is the wrong default when two agents are running untrusted work side by side, because one compromised agent reaches every peer in its fleet. The agent tools make reaching a peer a single command.\n\nThe two escapes each cost something. `--solo` removes a sandbox's outbound SSH entirely, so it can no longer drive anyone. `--group` separates whole fleets and shares no key across the boundary, so it also separates the fixtures you wanted to compare.\n\nWhat is missing is the middle: a way to say which peers a given agent sandbox may reach. Per-sandbox keys with an explicit allow list would give it, at the cost of a key per member rather than a key per tier.","notes":[],"links":[]},{"id":"SBX-013","title":"An arm64 Linux host falls back to Podman even though Firecracker supports aarch64","type":"feature-idea","severity":"low","status":"open","foundBy":"session agent, while reading the engine default in internal/cli/create.go","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`defaultEngine` chooses Podman whenever `runtime.GOARCH != \"amd64\"`, and R112 in SPEC.md §12 makes that a requirement (`internal/cli/create.go:25`). So an arm64 Linux host with a working `/dev/kvm` gets a container sandbox and cannot ask for a microVM at all.\n\nFirecracker itself runs on aarch64, and part of the support is already written. `fcArch` maps `arm64` to `aarch64`, and `fcDigests` carries a pinned checksum for the aarch64 release tarball (`internal/fcdisk/build.go:41`).\n\nThe guest side is what is missing, and the comment on the gate says so: the artifacts target x86_64. Two pieces would need work. The kernel build lifts an ELF out of Fedora's `kernel-core` with the upstream `extract-vmlinux` script, which is written around an x86 bzImage. `DefaultBootArgs` opens `console=ttyS0`, which is the wrong console for an arm64 guest.\n\nThe payoff is a real one: an arm64 Linux server, or an Ampere or Graviton host, is a plausible place to run a fleet of agent sandboxes. Nothing else in the tool is x86-only.","notes":[],"links":[]},{"id":"SBX-014","title":"Two builds of the sandbox image a week apart are different images with the same name","type":"improvement","severity":"low","status":"open","foundBy":"SPEC.md §14, second limitation","opened":"2026-08-15","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"SPEC.md §14 records that the image is not bit-for-bit reproducible, because `image/Containerfile` runs a package update at build time and a rebuild can pick up newer upstream packages.\n\nThe consequence is that two hosts running the same `cs-sandbox build` from the same commit can hold materially different sandboxes, and neither can say how they differ. When an agent's work reproduces on one host and not another, the image is a suspect nobody can rule out.\n\nFull reproducibility is expensive and probably not worth it here. Recording what was built is cheap, and answers the question that actually gets asked. The guest kernel already shows the shape: `CS_SANDBOX_FC_KVER` pins a Fedora `kernel-core` NVR, and `kernelRebuildReason` rebuilds when the pin moves.\n\nWriting the package manifest into the image, and surfacing it from `inspect` or `doctor`, would let two hosts diff their sandboxes. Pinning the base image by digest rather than by tag would narrow the drift at the same time.","notes":[{"date":"2026-08-26","text":"Publishing by version answers the part of this that bites. The image is now named after the cs-sandbox that built it, and is published per commit. Two hosts that pull the same tag hold the same digest and can be compared by name. What this record asks for is still open for the case that remains. A host that builds its own image gets different bytes from CI's for the same commit, because `dnf update` still floats, and neither image records what it installed. The package manifest and the digest-pinned base would close that."}],"links":["SBX-028"]},{"id":"SBX-015","title":"exec addressed a sandbox's host key by its bare name, so a second group's copy failed","type":"defect","severity":"high","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["e0cfea4"],"integrated":[],"verified":"Reproduced on this host with README walkthrough 8: exec of api.cache-redis then api.cache-memory, the second exiting 255 on Host key verification failed. After the change, TestSSHArgsKeysHostKeyOnTheObjectName asserts the alias for three groups and the unset one, and fails on the previous code with `HostKeyAlias \"api\", want \"api.default\"`."},"resolution":null,"details":"README walkthrough 8 creates `api` and `bench` in two groups, then runs:\n\n```\ncs-sandbox exec api.cache-redis  pwd\ncs-sandbox exec api.cache-memory pwd\n```\n\nThe second command exits 255 with \"REMOTE HOST IDENTIFICATION HAS CHANGED\". `internal/engine/firecracker.go` passed `HostKeyAlias=\u003cname>` to ssh, dropping the group, so both sandboxes shared the entry `api` in `~/.ssh/known_hosts.cs-sandbox` and the second presented a different key for it. Under `BatchMode=yes` there is nobody to accept it.\n\n`hostcfg.Ref` already documents the invariant: the object name is \"a sandbox's canonical, always-unambiguous ssh alias\". The generated ssh config and `forward` both kept it. `exec`, `cs-sandbox ssh` and the `fetch`/`push` transport did not.\n\nThe podman engine was never affected: `podman.Exec` addresses the container as `\u003cname>.\u003cgroup>` and says why.","notes":[],"links":[]},{"id":"SBX-016","title":"A dry-run create allocated a port, wrote a record, and waited two minutes for nothing","type":"defect","severity":"med","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["5ed0617"],"integrated":[],"verified":"Before: `cs-sandbox --dry-run create drytest` left drytest in `cs-sandbox ls` holding port 2301 and 10.89.4.201, and `cs-sandbox start drytest` had to be killed at 60s. After: the same command prints the plan, reports `would create drydemo2`, exits 0 in seconds, and leaves neither a record nor an instance directory. TestSaveSkipsUnderDryRun and TestWaitReadyReturnsAtOnceUnderDryRun cover both halves, the second with a negative case that still fails a sandbox that never answers."},"resolution":null,"details":"MANUAL.md offers `--dry-run` as \"print the external commands instead of running them\", and its notes for agents say to use it to show a user the plan before acting.\n\n`cs-sandbox --dry-run create \u003cname>` did more than print. It allocated an IP and a host port, persisted the instance record, and wrote the per-instance seed (which carries an inherited agent login). Then it polled for a microVM that a dry run never booted, until the 120-second readiness budget ran out and the command failed with exit 1.\n\nInterrupt it before that and the record survives: the name appears in `ls` as \"stopped\", holding a port and an address, with no sandbox behind it. `cs-sandbox start` on that record then waits the same two minutes.\n\nOnly `run.Exec` honoured the flag, so anything the CLI wrote itself was written for real.","notes":[],"links":[]},{"id":"SBX-017","title":"The manual gave CS_SANDBOX_ENGINE a default it does not have, and missed two variables","type":"defect","severity":"low","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["0f0025a"],"integrated":[],"verified":"`grep -rhoE '\"CS_SANDBOX_[A-Z_]+\"' internal/ cmd/` lists 25 names. Every one a user can set is now in MANUAL.md's Environment section. Two are left out as test instrumentation: CS_SANDBOX_COVERAGE_LOG and CS_SANDBOX_IT_HOSTROUTE. CS_SANDBOX_SSH_BIND is left out too, because SBX-005 holds it open on purpose."},"resolution":null,"details":"MANUAL.md's Environment section gave `CS_SANDBOX_ENGINE` a default of `podman`. `internal/cli/create.go` reads it as `envOr(\"CS_SANDBOX_ENGINE\", \"\")`, and the flag's own help says \"default: firecracker on Linux/KVM, else podman\". A reader on a Linux host with KVM would expect Podman and get Firecracker.\n\nTwo more variables the code reads were absent from the same tables. `CS_SANDBOX_GROUP` is `create`'s default group, and `CS_SANDBOX_TZ` sets the timezone a sandbox boots with, defaulting to America/Los_Angeles.\n\n`-f` also has a long form, `--force`, which appeared only in `--help`.","notes":[],"links":["SBX-006","SBX-005"]},{"id":"SBX-018","title":"The manual told agents every command was non-interactive, and two wait for a human","type":"defect","severity":"med","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["29b8321"],"integrated":[],"verified":"Read against internal/cli/misc_commands.go, where agent-login passes engine.ExecIO{Interactive: true}, and against MANUAL.md's own host-route paragraph, which says `up` asks for sudo once."},"resolution":null,"details":"MANUAL.md's notes for agents opened with \"Every command is non-interactive. Nothing waits on an answer, so nothing hangs unattended.\" That section exists so an automated caller can trust the surface.\n\n`agent-login` runs the agent inside the sandbox with `Interactive: true` and prints \"follow the prompts, then exit\" (`internal/cli/misc_commands.go`). `host-route up` asks for `sudo`, as the same manual says two sections earlier. An agent that trusts the note calls either one unattended and hangs.","notes":[],"links":[]},{"id":"SBX-019","title":"The walkthroughs promise to run end to end and open on a repo the reader does not have","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["8d3951e"],"integrated":[],"verified":"Read against the eight walkthrough blocks: five name a path under ~/projects, and nothing before them creates or introduces one."},"resolution":null,"details":"The README introduces its walkthroughs with \"Each block is runnable end to end\". Every block that shares a repo names `~/projects/api`, `~/projects/web` or `~/projects/bench`, which are the reader's to supply and are described nowhere. A reader who copies the first block gets a path error on their first command.\n\nThe writing rules ask that every example be runnable as written, and that a reader never meet a file they were not given. One sentence in the introduction resolves it without turning the walkthroughs into a setup guide.","notes":[],"links":[]},{"id":"SBX-020","title":"The ledger doctrine an agent is routed to needs a binary no document offers","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["ce318d3"],"integrated":[],"verified":"`grep -rn cs-ledger *.md ledger/AGENTS.md` returned only the two lines telling a contributor to run it. CONTRIBUTING.md now carries the go install line the Makefile prints."},"resolution":null,"details":"`AGENTS.md` sends an agent to `ledger/AGENTS.md` before it starts work, and that file says to run `cs-ledger render && cs-ledger check` before any commit touching the directory. Nothing in the document set says where `cs-ledger` comes from.\n\nThe answer existed only inside the Makefile's `ledger` target, in the error message printed when the binary is missing. An agent that has not yet failed the command cannot find it.\n\nThe same gap is in the tracer and vcr repositories, which carry the same router and the same doctrine.","notes":[],"links":[]},{"id":"SBX-021","title":"A brief written for agents ships in every sandbox and no document introduces it","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["c660901"],"integrated":[],"verified":"`grep -rn CS_SANDBOX.md *.md` returned one hit, inside a code block comment. The README's \"What's in a sandbox\" list and INSTALL.md's install step now both introduce it."},"resolution":null,"details":"`image/rootfs/home/.local/bin/CS_SANDBOX.md` is a reference written for an agent driving cs-sandbox. It covers what the tool is, the create-work-fetch-destroy loop, and what to do from inside a sandbox, where the CLI is deliberately absent. `make install` puts it on the host beside the binary, and the image bakes it into every sandbox.\n\nThe document set mentioned it once, in a comment on the `make install` line in INSTALL.md, and never said what it was. The reader it was written for could not find it.","notes":[],"links":[]},{"id":"SBX-022","title":"The ledger's own page is titled \".\" because the project name was never set","type":"defect","severity":"low","status":"closed","foundBy":"session agent, walking README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["a65f06a"],"integrated":[],"verified":"`ledger/ledger.json` carries \"project\": \"sandbox\", and the rendered page's title reads \"sandbox · ledger\" where it read \". · ledger\"."},"resolution":null,"details":"`ledger/ledger.json` carries `\"project\": \".\"`, so every render titles the page `. · ledger` and the masthead names the project `.`. The sibling repositories carry `ledger`, `tracer` and `vcr`.\n\nThe page is published, so the name is the first thing a reader sees.","notes":[],"links":[]},{"id":"SBX-023","title":"A turn that dies while minting an opencode session strands a server on its port","type":"defect","severity":"high","status":"closed","foundBy":"session agent, investigating why the campaign project's opencode-fireworks smoke scenario is excluded from CI","opened":"2026-08-23","resolved":"2026-08-23","stint":"2026-08-23 opencode turn driver","evidence":{"commits":["18433a8"],"integrated":[],"verified":"go test ./internal/cli/ -run TestOpenCodeTurn -count=1: 6 tests PASS, including TestOpenCodeTurnStartsOneServerForANewSession, which fails against the previous driver with \"transient opencode server never became healthy\". In a Firecracker member: one listener on the derived port and no `opencode serve` process, where the driver used to leave a second server. On cs-campaign, `make test-smoke SMOKE_TESTS=TestSmokeReplay/opencode-fireworks`: PASS in 107.97s, 53 requests replayed, 0 misses, 0 upstream calls."},"resolution":"The TUI is now the only server on the port. A new session is minted on its own API and selected in it, so nothing else is started, killed or waited for. A server the driver still finds there with no tmux session behind it is reclaimed by name.","details":"`cs-opencode-turn` booted a second opencode server to mint a session id. `mint_session` started `cs-opencode serve` on the derived port, waited for it, posted `/session`, killed it, then launched the TUI on the same port. Its only EXIT trap removed temp files, so a turn that died in that window left the transient server running.\n\nNothing took it down afterwards. `cs-opencode-remote --kill` runs `tmux kill-session`, and the stranded server is not in a tmux session, so every later turn met it again.\n\nEvery guard then passed against the wrong server. Reproduced in a microVM: the stranded server answered `wait_healthy`, so the session was minted on it. That bound the session to the stranded server's own working directory, the sandbox user's home, rather than the one the turn asked for. `kill` reached only the driver's own unbound server, and the 10s port-free loop fell through silently. The TUI then could not bind, yet `wait_healthy` and `session_known` both answered from the stranded server. So `ensure_session` returned 0, and the turn ran against a server no one could see. An agent whose file tools run in the wrong directory produces no reply, which reads from the host as a member that never started its turn.\n\nA second opencode server also costs about 1 GiB. A member is given 2048 MiB, so a stranded server leaves little for the one doing the work.","notes":[{"date":"2026-08-23","text":"Removing the transient server exposed a second defect it had been hiding. The old mint ran `cd \"$dir\" 2>/dev/null || cd \"$HOME\"`, so a working directory that does not exist fell back silently. Binding the session to the directory explicitly made opencode honour it, and every prompt then failed with `FileSystem.realPath (/workspace) ENOENT`. The cs-campaign project asks every turn to run in /workspace, which a Firecracker member does not have. The driver now checks the directory and says which one it used."}],"links":[]},{"id":"SBX-024","title":"A turn dispatched behind another mints a second session instead of resuming","type":"defect","severity":"high","status":"closed","foundBy":"cs-campaign's CI, on the first run with the opencode-fireworks smoke scenario re-enabled","opened":"2026-08-23","resolved":"2026-08-23","stint":"2026-08-23 opencode turn driver","evidence":{"commits":["b6157c8"],"integrated":[],"verified":"go test ./internal/cli/ -run TestRemoteLearnsTheSessionIdBeforeTheNextTurn -count=1: PASS for both tools, and FAIL for both against the previous scripts, where the overlapping turn drove with no --uuid. The test overlaps the two turns deliberately; sequential turns pass either way, which is how this reached CI. cs-campaign's make test-smoke: all five scenarios PASS in 476.57s. That local pass does not prove the race, which needs a loaded host to appear."},"resolution":"Both tools read the learned id while holding the per-session turn lock, and store it before releasing that lock. A turn blocked on the lock therefore finds the id the turn ahead of it learned.","details":"`cs-opencode-remote` and `cs-codex-remote` learn their agent's session id from the first turn's trailing sentinel. Both read it when the process started and stored it after releasing the per-session turn lock. A second turn that overlapped the first therefore read nothing, passed no `--uuid`, and the remote minted a new session.\n\nTurns overlap by design. A campaign dispatches the next turn as soon as the previous turn's reply lands, and the reply is written before the driver that produced it exits.\n\nA new session is not merely untidy under replay. OpenCode generates a title for a session that has none, which is a model call, and no cassette recorded one at that point. Measured on cs-campaign's CI: an orchestrator ran its two turns on two sessions. The second turn missed the cassette at step 8 of `csrocfw-orchestrator` (`messages: 18 items vs 2`, no tools), and died 11 seconds in. The campaign saw only a member that had gone quiet, waited out its 300s settling window and stalled at 424s.\n\nSequential turns pass either way, which is why this survived every run on a machine with room.\n\n`cs-claude-remote` does not have it. It mints the session id locally and has nothing to learn.","notes":[],"links":["SBX-023"]},{"id":"SBX-025","title":"OpenCode cannot borrow its own login, only a provider key","type":"feature-idea","severity":"low","status":"wont-fix","foundBy":"session agent, while building credential lending (SPEC 10.2)","opened":"2026-08-24","resolved":"2026-08-24","stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":"Decided against, by the maintainer, while the credential matrix was being built. OpenCode reaches a provider through whichever model it is running, so a lent credential belongs to that provider rather than to OpenCode. The key slots already cover it: --lend-api-key anthropic, openai and fireworks all reach OpenCode. The Fireworks slot was added for the model the image pins. What a login slot would add is the ability to lend a subscription OpenCode signed in for. Nothing in the design needs it: the same subscriptions are lent through the claude and codex slots to the clients that own them.\n\nThe path is not closed. The slot table carries a per-slot credential file and a fabricator. Adding one is a table entry and a reader, the same shape the claude and codex slots already have.","details":"--lend-agent-login takes claude and codex. OpenCode is absent because its ~/.cs-opencode/auth.json is a map of providers to credentials rather than one credential. A single slot therefore cannot say which upstream a loan is good for. The shape could not be verified against a real OpenCode login while the feature was built.\n\nOpenCode is not left out entirely: it reads ANTHROPIC_API_KEY / OPENAI_API_KEY and the matching base URL variables, so --lend-api-key anthropic and --lend-api-key openai reach the lender from it. Verified in a sandbox, with one caveat worth knowing: the image pins OpenCode to a model on a third provider. A lent key applies only once the model is one of those two: `cs-opencode run -m anthropic/\u003cmodel>`, or a pinned model changed in the profile. Its own base URL variable, OPENCODE_BASE_URL, is not something a loan can travel in, because the credential still belongs to whichever provider the model names.\n\nWhat it would take: expand the auth.json map into one slot per provider at read time. The loan token then carries a slot id naming the provider rather than the agent. The slot table in internal/lend already carries a per-slot origin and header shape, so the work is a reader plus a table entry, not a new mechanism.","notes":[{"date":"2026-08-24","text":"Verified OpenCode spends every key slot end to end, including a lent Fireworks key on the image's pinned model, in the live-agents tier."}],"links":[]},{"id":"SBX-026","title":"A lent sandbox loses all HTTPS egress if the lender stops","type":"improvement","severity":"med","status":"open","foundBy":"session agent, while building credential lending (SPEC 10.2)","opened":"2026-08-24","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"A sandbox created with a loan gets HTTPS_PROXY pointing at the lender, so the lender can refuse the hosts it fronts (R153). That variable governs every https client in the sandbox, not just the agent, so a lender that is not running takes git, curl and every package manager with it. The model calls fail either way; the rest of the sandbox need not.\n\nThe failure is quiet from inside: a tool reports a proxy it cannot reach, and nothing says which process was supposed to be listening.\n\nThere are two options. The first is to have the guest fall back to a direct route when the proxy refuses to connect, which weakens R153 exactly when it matters least. The second is to keep a lender running for the life of any sandbox that holds a loan, and have `doctor` and `ls` say plainly when one is missing. The second keeps the property and needs supervision the forward package already models.","notes":[],"links":["SBX-002"]},{"id":"SBX-027","title":"The host's own name resolves to the podman VM, not the host, on macOS","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while fixing the lender's guest address (SBX CI, run 32792053483)","opened":"2026-08-24","resolved":"2026-08-25","stint":"2026-08-25 reaching the host from a sandbox","evidence":{"commits":[],"integrated":[],"verified":"go test -tags integration -run TestCLIHostByNameLive and TestCLIHostByNameFirecrackerLive: PASS. Both now serve a page on this host and fetch it from inside the sandbox, by the host's own name and by host.containers.internal. They no longer only resolve a name, which is the check whose absence let the address be wrong on macOS and on a pre-5.0 podman without anything failing."},"resolution":"The guest init takes the host's address from what the engine published rather than from the seed. Podman writes host.containers.internal into /etc/hosts with the address that reaches its own host, whichever of pasta, slirp4netns or a machine VM it is running. The entrypoint reads that entry and re-points the seeded host names at it. The seeded literal remains the fallback for a guest nothing published a name to, which is the microVM, where it is right because that engine is Linux and KVM only.","details":"R52 pins the host's own names to the literal 169.254.1.2 in the seed's host_hosts. That address is the host only on a Linux box running podman itself with pasta. An older podman maps the host at slirp4netns' own address, and under a podman machine the literal is the VM rather than the Mac. So `ssh \u003cyour-hostname>` or `curl \u003cyour-hostname>:PORT` from a sandbox reaches the wrong machine on macOS and on a pre-5.0 podman, while R109 claims macOS parity.\n\nThis is the same defect R52a already fixed for the lender, which now points a sandbox at host.containers.internal and lets podman supply the address. The host's own names were left on the literal.\n\nIt is invisible to CI: TestCLIHostByNameLive and TestCLIHostByNameFirecrackerLive are integration-tier and run on Linux only. The smoke tier reached this class of bug only when TestCLILendKeyLive first opened a connection to the host rather than resolving a name.\n\nOne fix needs no host-side platform detection. Have the guest init resolve host.containers.internal at boot, and pin the host's names to whatever that gives. The seeded literal stays the fallback for a guest nothing published such a name to, which is the microVM guest, where the seed pins it already.","notes":[],"links":["SBX-026"]},{"id":"SBX-028","title":"Publishing an image needs a workflow; there is no way to push one by hand","type":"feature-idea","severity":"low","status":"open","foundBy":"user (host), while settling the publish design: \"no cs-sandbox push for now, add a ledger entry for it as an idea\"","opened":"2026-08-26","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"CI is the only publisher of the sandbox images. It builds them from a clean checkout of a pushed commit, and pushes them to `ghcr.io/codesweep-ai/sandbox` and the two `-slim` packages. That is what makes a tag mean \"the image CI built from this commit\".\n\nThat leaves no supported way for a maintainer to publish one from a workstation. The cases where it would matter are narrow: a workflow that is broken, a registry outage that dropped a tag, or a one-off image for a revision CI skipped. `podman push` does the job today, because `cs-sandbox build` already tags the fully qualified name that a push takes unaltered.\n\nA `cs-sandbox push` would add the checks a bare `podman push` has no way to make. It would refuse a `-dirty` tag, and a revision the module proxy cannot resolve. It would also refuse an image whose `cs-sandbox` came from `--local-sandbox` rather than from the version its tag names. Each of those cases ships something the tag misdescribes.\n\nWorth doing only if hand-publishing turns out to be a thing that happens. Until then the absence is deliberate, and this record is here so the reason is findable.","notes":[],"links":["SBX-014"]},{"id":"SBX-030","title":"The lender presents an expired agent login, so a lent sandbox gets a bare 401","type":"improvement","severity":"med","status":"open","foundBy":"session agent, re-recording the cassette matrix on 2026-09-01: codex-login-lent failed while codex-login-shared passed","opened":"2026-09-01","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`readCodexLogin` in internal/lend/cred.go reads `tokens.access_token` and the account id. It does not read `tokens.refresh_token`, and it does not look at the token's expiry. An access token that has passed its `exp` is handed to the guest and spent, and chatgpt.com answers 401.\n\nThe two credential modes diverge here, and only one of them can recover. A shared sandbox receives a copy of the whole auth.json, so the Codex CLI inside refreshes the token itself and the session proceeds. A lent sandbox holds a loan token instead, and the lender swaps in the access token alone, so nothing on the path is able to refresh.\n\nThe matrix was re-recorded on 2026-09-01, when the host's Codex access token had already expired on 2026-08-30. Every request of codex-login-lent came back 401. That was three GETs of /models and two POSTs of /responses. The paired codex-login-shared cell passed in the same run, against the same profile. A new login on the host cleared it, and the cell then recorded a clean session.\n\nWhat reaches the person is the part worth fixing. The agent prints a model error, the recording writes a cassette of five 401s, and nothing names the cause. A stale cassette of refusals is worse than a failure, because it replays green until somebody reads it.\n\nTwo things would help, and they are independent. The lender could refuse to lend a login whose `exp` has passed, and say which profile to renew. It could also refresh the token itself, since the refresh token is in the file it already opens. The first is small and turns an opaque 401 into a sentence; the second removes the failure.","notes":[],"links":["SBX-026"]}],"drafts":[],"queue":{"recommendedBy":"session agent, from the 2026-08-22 spec/code alignment pass","updated":"2026-08-22","items":[{"id":"SBX-002","why":"A stale pid file can send SIGKILL to another of your processes after a host reboot."},{"id":"SBX-003","why":"Creating a sandbox silently changes the permissions of files in the directory you shar
