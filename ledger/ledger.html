mits":["143ac79"],"integrated":[],"verified":"Probes on real microVMs, on each of Claude Code, Codex and OpenCode. A task needing more context than its line answered all 14 of its items once across 3 to 4 hand-offs per CLI, with no item done twice. A session that kept calling tools after writing its handoff was ended by the hook on Claude Code (4 of 4) and OpenCode (5 of 5). Codex ended its turn on the nudge in every asked session. On Claude Code and OpenCode a batch of four sub-agents finished inside the turn before its hand-off, and only the main session was asked. Replayed Claude Code records put each ask 227 to 720 tokens under the next call. In a real campaign the harness kept a session that handed off, and that session's next turn was asked again and ended as class `handoff`. In the same campaign a Claude Code member handed off 7 times with no compaction. In a second campaign OpenCode members handed off 4 times, each reported as class `handoff`. `TestTheContextHookAsksForAHandoffAgainInALaterTurn` and `TestALaterTurnThatRewritesItsHandoffIsAHandOff` fail with the re-ask removed. `make check` passed on the feature commit, with every package `ok`."},"resolution":"A sandbox may carry a line, `CS_HANDOFF_TOKENS`, with the handoff's path and the sentence to ask with (`CS_HANDOFF_FILE`, `CS_HANDOFF_ASK`). A hook for Claude Code and Codex, and a plugin for OpenCode, read the context the next model call will carry. Past the line they append the ask to each tool result until the handoff file is newer than the ask, then nudge once, then end the turn. A later turn of a session still over its line is asked again. The turn drivers report such a turn end as class `handoff`, exit 0, and `--context` reports the line and a floor. A session whose first reading is over its line is never asked. Sub-agents, child sessions and a CLI the agent starts itself are never asked over the agent's own file. Nothing runs unless the line is set.","details":"An agent in a sandbox runs one CLI session across many turns, and its context grows with every tool result. When the context nears the model's window, the CLI compacts the conversation by itself. The summary keeps what the CLI chose to keep, and the agent carries on from it, re-orienting by guesswork. A caller that drives long work through the turn drivers has no way to see that coming, and no way to have the agent write down what it needs first.\n\nWanted: a line, in tokens of context, that a caller sets per sandbox. Past it, something on the agent's own machine asks the agent to write a handoff with its own tools and end its turn. The turn driver reports that ending as a hand-off. The caller can then start the agent fresh and point the new session at the handoff. The sandbox should hold no words of the caller's: the line, the handoff's path and the sentence the agent is asked with come from the caller. A line below what a fresh session costs would hand off forever, so a session that starts over its line must not be asked. Sub-agents and CLI sessions the agent starts itself must not be asked over the agent's own file. Every CLI's own compaction stays on as a safety net.","notes":[],"links":[]},{"id":"SBX-106","title":"Shipping the OpenCode context hook in the profile makes every OpenCode first start install the plugin SDK, and fails it with no network","type":"defect","severity":"high","status":"closed","foundBy":"sandbox CI on 7ea098e: every OpenCode agent-replay job failed on its first turn, on podman, Firecracker and macOS alike","opened":"2026-10-25","resolved":"2026-10-25","stint":"context hand-off, 2026-10-17 to 2026-10-25","evidence":{"commits":["5948f34"],"integrated":[],"verified":"Unit: `go test ./internal/cli/ -run 'TestOpenCodeProfileShipsNoPlugin|TestOpenCodeWrapperLinksTheHookOnlyWithALine|TestOpenCodeTurnWaitsForTheFirstSessionWithALine' -count=1` PASS; the wrapper test fails with the link made unconditionally, and the driver test fails with the single ask restored. Replay: `make test-agents-replay AGENTS_REPLAY_CASES='TestAgentReplay/opencode-.*-shared$'` on the slim CI image built from this tree: 3 of 3 cells PASS, `cs-vcr served 6 request(s) and missed 0`; on 7ea098e the same cells failed on their first turn. Live: a campaign of three OpenCode members, every one with a line, on the full image built from this tree. Each member's first start logged `the server answers but gave no session yet; waiting for its first start to finish` and then finished with exit 0; no member was continued. The campaign met its mission in 24 minutes 36 seconds with 4 hand-offs. The orchestrator handed off at 40,688 tokens over a line of 40,000, and the agents once and twice on their dispatch. The run before this fix, on the same profile, continued every member once at readback. `make check` passed every gate on this commit, with the partial smoke tier the replay leaves set aside."},"resolution":"The hook ships at `~/.local/share/cs-opencode/plugins/cs-context-hook.ts`, outside the profile. `cs-opencode` links it into `~/.cs-opencode/plugins/` only when `CS_HANDOFF_TOKENS` names a line, and says so on stderr when the hook is missing rather than failing the start. A member with no line starts as it did before the hook. With a line, `cs-opencode-turn` asks for the first session up to twelve times, ten seconds each, while OpenCode's one-time SDK install runs, and once as before without a line.","details":"The context hook for OpenCode is a plugin, and 143ac79 shipped it in the profile's plugins directory, `~/.cs-opencode/plugins/`, for every member. OpenCode installs its plugin SDK, `@opencode-ai/plugin`, from npm on every start, into each config directory it reads. When a config directory holds a plugin, it holds the first session until that install is done. In a CI replay the network is a recorder that answers no npm request, so the install hung. The turn driver asks for a session once, for ten seconds, and the ask came back empty: `cs-opencode-turn: could not create an opencode session (got '')`, exit 3. That was 15 of 15 OpenCode cells. The same first-start failure had been seen on every OpenCode member of two live campaigns and taken for a flake. With the network the install finishes within a minute, and the next turn found the session.\n\nReproduced in a sandbox from the same image with `HTTP_PROXY` pointed at a closed port, as the replay sets it: the first turn fails at 11 seconds. The same turn on a machine whose profile already holds the SDK succeeds. A fresh machine with the SDK copied into the profile alone still fails, because OpenCode runs the install for its other config directory too.\n\nA member with no hand-off line has no use for the plugin and must start exactly as before this feature. A member with a line needs the install once per machine, with the network, and its first start has to be given the time.","notes":[{"date":"2026-10-25","text":"Baking the SDK into the image was tried and set aside: OpenCode installs it per config directory, and making that reliable would depend on its installer's internals. It stays an option if the one-time install on a lined machine proves slow."}],"links":["SBX-105"]},{"id":"SBX-107","title":"doctor has no probe that starts an agent cold from the image, so a first-start stall reaches CI and campaigns first","type":"improvement","severity":"med","status":"open","foundBy":"repository owner, after SBX-106: \"it would have caught the plugin-install stall before any campaign or CI run\"","opened":"2026-10-25","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"SBX-106 was a first start that never answered for a session, and nothing on the host could have said so before a campaign or CI run did. `cs-sandbox doctor` checks the host and the bundled tools, and boots nothing.\n\nWanted: a doctor probe that boots one sandbox from the image, cold, with a lined OpenCode profile, so the plugin is present. It asks the turn driver for a first session. If the session is not created within the driver's wait, the probe refuses by name. The probe should also run the same start with no line, because that is the start CI replays.\n\nOpen questions for whoever takes it. The probe needs an engine and the image, so it is slower than the rest of doctor and should be asked for, as a flag or a separate verb. The lined start needs the network once, for OpenCode's plugin SDK install, so a host with none would fail the lined half for the wrong reason. The driver's wait is two minutes, which sets the probe's floor.","notes":[],"links":["SBX-106"]},{"id":"SBX-108","title":"The Neovim pre-build ships language servers for languages outside the mainstream set","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner: \"807Mb for an editor is a lot, can we remove some of the LSPs and neovim support for some languages that aren't mainstream, basically outside of Python, Java, Javascript/Typescript, Bash/sh, Go, C/C++?\"","opened":"2026-10-29","resolved":"2026-10-29","stint":"2026-10-29 image size session","evidence":{"commits":["ebe2a76"],"integrated":[],"verified":"I ran the pre-build step from Containerfile.base on this config, in a container from the 2026-09-29 image. `:MasonInstallSync!` and `:TSInstallSync!` both returned 0. `du -sm /opt/nvim/mason` gave 257 MB against 697 MB before, and the pre-build output measured 307 MB against 725 MB. As an ordinary user, Python, Go, TypeScript, JavaScript and Java files attached basedpyright, gopls, ts_ls, ts_ls and jdtls. Bash, C, C++ and Lua files got treesitter highlighting, and nothing wrote to stderr. `make ci` passed on the tree that became ebe2a76."},"resolution":"The image now installs language servers and tools for Python, Java, Go, JavaScript and TypeScript only. Its parsers cover those languages, Bash, C, C++, Lua and the config formats. A user who needs another server can install it into a private `$MASON_ROOT`.","details":"Neovim costs about 807 MB of the shipped image, and the Mason root under /opt/nvim/mason is 697 MB of it. Most of that root serves languages outside Python, Java, JavaScript, TypeScript, Bash, Go and C/C++. The largest are GraphQL at 128 MB, HTML and CSS at 94 MB, Emmet at 69 MB and Svelte at 65 MB. Prisma takes 47 MB, Lua and its formatter 32 MB, and Tailwind 10 MB. The treesitter list also builds parsers for Nix, Rust, Scala, Lua, HTML and CSS.\n\nThe sizes come from `du -sm /opt/nvim/mason/packages/*` in ghcr.io/codesweep-ai/sandbox:v0.0.0-20260929195333-38b6867ec3dd.\n\nWanted: the config in image/rootfs/home/.config/nvim installs servers, tools and parsers for the mainstream languages only. A user who needs another server can still install it into a private `$MASON_ROOT`.","notes":[{"date":"2026-10-29","text":"The trimmed config ran the base image's pre-build step from Containerfile.base in a container from the 2026-09-29 image. `:MasonInstallSync!` and `:TSInstallSync!` both returned 0. The Mason root went from 697 MB to 257 MB. The pre-build output went from 725 MB to 307 MB on disk, and from 208 MB to 135 MB gzipped. Python, Go, TypeScript, JavaScript and Java buffers attached their servers as an ordinary user. Bash, C, C++ and Lua buffers got treesitter highlighting, and nothing wrote to stderr. The Lua parser stays in the list, because without it every Lua buffer fails to open with an error. SBX-109 has the cause."}],"links":["SBX-109"]},{"id":"SBX-109","title":"`:help` in a sandbox's Neovim fails with an error because the vimdoc parser never loads","type":"defect","severity":"low","status":"open","foundBy":"session agent, while checking SBX-108's trimmed parser list in the shipped image","opened":"2026-10-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Running `:help` in a sandbox's Neovim prints `E5113: … Parser could not be created for buffer 2 and language \"vimdoc\"`. A buffer whose filetype is `query` fails the same way. Neovim's own ftplugins for both start treesitter without a guard.\n\nNeovim bundles the vimdoc, vim, query, lua, c and markdown parsers in /usr/local/lib/nvim/parser. At startup lazy.nvim resets the runtimepath and leaves that directory out, so none of the bundled parsers are found. Under `nvim --clean` the same parsers load. The config installs its own lua, c and markdown parsers through nvim-treesitter, which is why only vimdoc and query show the error.\n\nReproduce in ghcr.io/codesweep-ai/sandbox:v0.0.0-20260929195333-38b6867ec3dd with `HOME=/sandbox/home nvim --headless +help +qa!`.\n\nA fix puts /usr/local/lib/nvim back on the runtimepath through lazy.nvim's `performance.rtp.paths`, or installs vimdoc and query alongside the other parsers. The first also lets SBX-108's list drop its own lua parser.","notes":[],"links":["SBX-108"]},{"id":"SBX-110","title":"The tree-sitter CLI's own dnf step adds a second copy of the rpm database to the base image","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, while measuring the Neovim layers for SBX-108","opened":"2026-10-29","resolved":"2026-10-29","stint":"2026-10-29 image size session","evidence":{"commits":["4178421"],"integrated":[],"verified":"I built the base tier at 04cd4e2 with `podman build -f image/Containerfile.base image/rootfs`, and the build passed. Read from podman's layer store, the new base carries the rpm database in three layers: the Fedora base, the main install and Chromium. The 2026-09-29 image carries a fourth copy, 34 MB of its 42 MB tree-sitter layer. In the new base `tree-sitter --version` printed 0.26.11, `rpm -qa 'nodejs*'` listed nothing, and the Neovim pre-build passed. The build used this host's cached fedora:44, so the main layer's size does not compare with a published one."},"resolution":"The main package transaction now installs tree-sitter-cli, so the base image carries one fewer copy of the 35 MB rpm database.","details":"Containerfile.base installs tree-sitter-cli in a dnf transaction of its own, after the main package install. Every dnf transaction writes a fresh copy of the rpm database into its layer, and that database is 35 MB in the shipped image. The package is 7.1 MB, but its layer is 45 MB in ghcr.io/codesweep-ai/sandbox:v0.0.0-20260929195333-38b6867ec3dd.\n\nWanted: tree-sitter-cli installs in the main package transaction, so the image carries one copy of the database. The step stood alone to keep its Recommends from pulling in a second Node, and the global `install_weak_deps=False` in dnf.conf does that now.","notes":[],"links":["SBX-108"]},{"id":"SBX-111","title":"Sandboxes that run syslang install Lean and cvc5 themselves, because the image carries neither","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner, through the brief tasks/lean-in-the-sandbox-image.md that the syslang-playbooks session wrote: \"The user has decided to put Lean and cvc5 in the image\"","opened":"2026-10-29","resolved":"2026-10-29","stint":"2026-10-29 Lean in the image","evidence":{"commits":["da19ffc"],"integrated":[],"verified":"I built all three tiers locally from the tree that became da19ffc, with `cs-sandbox build --rebuild-base`. The Lean layer measured 2837 MiB on disk and 769 MiB gzipped, and the cvc5 layer 30 MiB and 11 MiB. In a Podman sandbox and a Firecracker one, `lean` and `lake` printed 4.34.1 and `cvc5 --version` printed 1.4.2. `lean --run` ran a one-line program, and `lake env true` exited 0 with the network cut. The arm64 build has not run yet; its digests match GitHub's. `make check` passed."},"resolution":"The base tier installs elan, the Lean toolchain syslang pins and cvc5, each checked against a pinned digest. Each user's ~/.elan links the shared toolchain, so another Lean version installs there without sudo.","details":"Every sandbox that runs syslang needs Lean, because `cs-syslang validate` and every command that proves, simulates or mutates runs it through `lake`. The image has no Lean, so each campaign member installs elan and the toolchain itself. That costs a 0.6 GB download and 3 GB written to the sandbox's own disk, twice per campaign. The prover in syslang and `cs-syslang analyze` also ask the cvc5 SMT solver. Without it, more claims stay unproved.\n\nWanted: the base tier installs elan 4.2.4, the Lean toolchain syslang pins (leanprover/lean4:v4.34.1) and cvc5 1.4.2 on both architectures. Each download is checked against a pinned digest. The slim CI image drops all three.\n\nA project that pins another Lean version gets it the way a Go project gets another Go. A per-user `~/.elan` links the image's toolchain, and elan downloads any other one there without `sudo`.","notes":[{"date":"2026-10-29","text":"A local build of all three tiers passed, from the working tree on top of 91e42fc. The Lean layer is 2837 MiB on disk and 769 MiB gzipped. The cvc5 layer is 30 MiB on disk and 11 MiB gzipped. In a Podman sandbox and in a Firecracker one, `lean` and `lake` printed 4.34.1, `cvc5 --version` printed 1.4.2, and `lean --run` ran a one-line program. With the network cut, `lake env true` exited 0. elan tries to write /opt/elan/known-projects on every call, gets EACCES and carries on. A project pinning v4.33.0 had elan install it into ~/.elan in 58 seconds, without sudo."}],"links":[]},{"id":"SBX-112","title":"`sudo pyenv` and `sudo nvm` do not work, though SPEC.md says a new Python or Node version needs `sudo`","type":"defect","severity":"low","status":"open","foundBy":"session agent, while comparing how each /opt toolchain adds a version for SBX-111","opened":"2026-10-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"SPEC.md §3.1 says the toolchains under /opt are read-only for the dev user, so a new language version needs `sudo`. As the sandbox user, `sudo pyenv --version` prints `sudo: pyenv: command not found`. Fedora's sudo replaces PATH with its `secure_path`, which does not name /opt/pyenv/bin, and it drops PYENV_ROOT. `sudo nvm` cannot work at all, because nvm is a shell function that ~/.bashrc sources.\n\nReproduce in ghcr.io/codesweep-ai/sandbox:v0.0.0-20260929195333-38b6867ec3dd as a user with the image's NOPASSWD sudo.\n\nA user who follows the rule meets a failure that names nothing about /opt. A fix either makes sudo find the tools, for example with a sudoers drop-in that extends `secure_path` and keeps PYENV_ROOT and NVM_DIR, or documents the commands that work.","notes":[],"links":["SBX-111"]}],"drafts":[],"queue":{"recommendedBy":"session agent, after the reliability session of 2026-09-28","updated":"2026-10-19","items":[{"id":"SBX-047","why":"Two fleets on one key still fight for it, and a bare 429 ends a codex turn at once. Only the lender can pace or absorb that."},{"id":"SBX-054","why":"A throttle delivered inside a 200 stream reads as a success in the lender's log, so a fleet at its limit still looks healthy."},{"id":"SBX-003","why":"Creating a sandbox silently changes the permissions of files in the directory you shared."},{"id":"SBX-001","why":"A store holding real images needs twice its size in host memory to build a microVM disk."},{"id":"SBX-004","why":"Past fourteen shares a microVM drops one and still reports success."}]},"description":null,"links":[],"commitUrlTemplate":null,"rendererVersion":"0.7.5","uiVersion":"0.3.1-dev.20261029181327.893b2b0","lastActivity":"2026-10-29","derived":{"terminalStatuses":["closed","wont-fix","moved-to-roadmap"],"lastActivity":{"SBX-001":"2026-08-16","SBX-002":"2026-10-19","SBX-003":"2026-09-02","SBX-004":"2026-08-15","SBX-005":"2026-08-22","SBX-006":"2026-08-17","SBX-007":"2026-08-17","SBX-008":"2026-08-15","SBX-009":"2026-08-16","SBX-010":"2026-08-15","SBX-011":"2026-08-15","SBX-012":"2026-08-15","SBX-013":"2026-08-15","SBX-014":"2026-08-26","SBX-015":"2026-08-17","SBX-016":"2026-08-17","SBX-017":"2026-08-17","SBX-018":"2026-08-17
