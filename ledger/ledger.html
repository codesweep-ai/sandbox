urn log (SBX-060) should carry it.\n\n**How to reproduce.** Arm `--hang 1s --count 600` on a sandbox that borrows a key, and run one turn with `cs-codex-remote`. Read the class line after about five minutes.","notes":[],"links":["SBX-044","SBX-059","SBX-060","SBX-026"]},{"id":"SBX-063","title":"A prompt is entered twice, and its transcript is waited for only ten seconds","type":"defect","severity":"high","status":"closed","foundBy":"session agent, maintainer of this repository, reading the evidence a failed continuous integration leg kept","opened":"2026-09-21","resolved":"2026-09-21","stint":null,"evidence":{"commits":["262b747"],"integrated":[],"verified":"Two tests drive the driver against a stubbed terminal. One accepted prompt is entered once, and was entered twice before. A transcript that never appears is waited for twice over a budget the failure names, and the wait was a fixed ten seconds that said nothing. Both are red on the driver as it was, the second after exactly ten seconds."},"resolution":null,"details":"**What happened.** A replay leg failed where two other legs of the same commit passed. The cause was not where it was reported. The driver had submitted a prompt and then looked for the transcript the agent writes. It found none within ten seconds, so it ended the turn. What came after that was correct at every step, and misleading at every step. The harness read a member that had stopped and climbed its ladder. Each rung sent text the recording does not hold, so what reached a reader was a recording miss three rungs from its cause.\n\n**Two faults sit behind this one screen.** The wait is ten seconds, spelled as twenty tries of half a second. What it is really waiting on is a loaded machine, and a loaded machine is exactly when it is asked for. The failure names no duration, so nothing tells a reader whether it waited a moment or an hour.\n\n**The second fault does its damage quietly.** The prompt is submitted with one Enter and then a second is sent unconditionally, on the reasoning that a spare keystroke falls on an empty composer. It does, while the first is still rendering. Once the prompt has gone the composer is live again. The keystroke then stays in it until the NEXT prompt is pasted in front of it. One turn was seen reaching the model as two carriage returns followed by text the recording holds without them. That cannot match, and the agent family that does this is the one whose replay failed.\n\n**How to reproduce.** Submit a prompt on a machine slow enough that the transcript takes more than ten seconds to appear. For the second, submit two turns in a row and read the text of the second as it reaches the provider.\n\n**What would help.** Wait for a span of time rather than a count of tries, and name that span when it runs out. Send the second Enter only where it is the remedy, which is after nothing has appeared rather than beside the first.","notes":[],"links":["SBX-060"]},{"id":"SBX-064","title":"The login renewer's claude turn fails with a message about a missing prompt","type":"defect","severity":"med","status":"in-progress","foundBy":"session agent, maintainer of this repository, lending an expired host login to a sandbox during a live check","opened":"2026-09-21","resolved":null,"stint":"reliability session, 2026-09-21","evidence":{"commits":["af0437e"],"integrated":[],"verified":null},"resolution":null,"details":"**What happened.** A host's claude login had expired, and it was lent to a sandbox. The renewer ran its renewing turn to refresh the token. The turn failed, and the client's message was `Input must be provided either through stdin or as a prompt argument`. The login stayed expired, so the lent sandbox got a bare 401.\n\n**What is known.** The renewing turn is the claude wrapper run with `-p ping --model haiku`, inside a container. The wrapper adds `--strict-mcp-config` and a permission flag ahead of those arguments. The message is the client's own, and it means the client found no prompt.\n\n**What is not known.** The cause has not been traced. The prompt `ping` is plainly on the command line, so something between the renewer and the client loses it or reads it as a flag's value. It has not been checked whether the same turn fails when the login is still valid.\n\n**Why it matters.** Renewal is the only thing that keeps a lent login alive, and this failure means it may never have worked for this client. It compounds the expired-login defect in SBX-030, where the lender hands out an expired token and the guest sees a bare 401. A campaign whose orchestrator runs on a lent claude login stops when that login expires.\n\n**What would help.** Run the renewing turn by hand in the renewer's container and read what the client receives. A driver test should then pin the argument order the wrapper hands the client.","notes":[{"date":"2026-09-21","text":"The cause is found. The function that builds the container command ended its list at the image name, so the turn's arguments were never passed. The client started with no prompt and exited before it authenticated. Codex fails the same way, with `stdin is not a terminal`. No login was ever renewed, for either client. The renewer's log line printed the arguments anyway, so its log read as though the turn had run."},{"date":"2026-09-21","text":"It was reproduced with no credential and no provider call. The old command printed the client's message about a missing prompt and exited 1. With the turn appended, the same container prints `Not logged in`, so the client now reaches sign-in, which is where a refresh happens."},{"date":"2026-09-21","text":"Commit af0437e appends the turn. `TestContainerArgvHandsTheClientItsTurn` failed for both clients before it and passes after it. An existing test forbade `-p` anywhere in the command, meaning a published port. It now reads podman's own options only, because the client's `-p` is a prompt. This record stays open until a real login is seen to rotate, which spends one small turn on the owner's subscription."}],"links":["SBX-030"]},{"id":"SBX-065","title":"The three remote tools find their driver with `readlink -f`, which older macOS does not have","type":"improvement","severity":"low","status":"open","foundBy":"session agent, maintainer of this repository, reviewing the remote tools for what macOS runs differently","opened":"2026-09-21","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"**What is there.** Each of the three remote tools copies a turn driver to the member. It finds the driver beside itself by resolving its own path with `readlink -f`. The `-f` flag is GNU. The BSD `readlink` on macOS gained it in version 12.3, and older systems reject it.\n\n**What happens there.** The substitution fails, and the tool falls back to the driver under the user's local bin directory. That fallback is safe when the tools were installed together. It is wrong when an older install sits there, because the older driver is then copied over a newer one on the member, and nothing says so. The comment above that code names this exact hazard.\n\n**Why it matters.** Little today, since supported hosts are newer than that. It is recorded because the failure is silent, and a stale driver is slow to diagnose.\n\n**How to reproduce.** Put a `readlink` that rejects `-f` first on PATH and run a remote tool from a directory other than the local bin one.\n\n**What would help.** Resolve the path with a portable loop over plain `readlink`, or say out loud when the fallback is taken.","notes":[],"links":[]},{"id":"SBX-066","title":"Start on a running microVM launches a second one, fails after two minutes and leaves `ls` wrong","type":"defect","severity":"med","status":"closed","foundBy":"session agent, maintainer of this repository, running `start` twice while measuring SBX-026","opened":"2026-09-21","resolved":"2026-09-21","stint":null,"evidence":{"commits":["ab85404"],"integrated":[],"verified":"Before: `start` on a running microVM exited 1 after 2m0s with `failed to become ready`, and the serial log held a busy-tap error. Then `ls` read `stopped` while `exec` into the same sandbox still returned 0. After: the same command exited 0 in 0.33 s and `ls` read `running`. `go test ./internal/engine/ -run TestFirecrackerStartLeavesARunningVMAlone -count=1`: red before with 8 commands run, ok after with none."},"resolution":null,"details":"**What happened.** `cs-sandbox start` was run on a microVM sandbox that was already running. It waited the whole readiness budget of two minutes, then failed with `failed to become ready`. Afterwards `ls` listed the sandbox as `stopped`, while `exec` into it still worked and its process was alive.\n\n**Why.** Start launched a new virtual machine monitor without asking whether one was running. The second one could not open the network tap the first still held, so it exited at once. Launching had already replaced the recorded process id with its own. That id was now dead, and the status check reads only that record.\n\n**Why it matters.** A harmless repeat of a command cost two minutes and an error. Worse, it left the tool's own record wrong about a sandbox that never stopped. A later `start` then repeats the failure, because the record says stopped. Only `stop` followed by `start` clears it, since `stop` also finds the process by its config file.\n\n**How to reproduce.** Create a microVM sandbox, run `start` on it, and then run `ls`.\n\n**What would help.** Start should return at once when the recorded process is alive, and leave the record alone.","notes":[{"date":"2026-09-21","text":"Commit ab85404 makes start on a running microVM change nothing. A sandbox already left in the wrong state by an older build is still cleared by `stop` and then `start`."}],"links":["SBX-026"]},{"id":"SBX-067","title":"The macOS jobs trust a podman machine that calls itself running while its socket is dead","type":"defect","severity":"med","status":"in-progress","foundBy":"session agent, maintainer of this repository, reading the first failing line of two red macOS jobs","opened":"2026-09-21","resolved":null,"stint":"reliability session, 2026-09-21","evidence":{"commits":["8d5e892"],"integrated":[],"verified":null},"resolution":null,"details":"**What happened.** The self-hosted macOS runners came back after an outage. On the next push, the macOS image build and the macOS smoke job both failed with `unable to connect to Podman socket`. A re-run of the failed jobs failed the same way.\n\n**Why.** Each macOS job begins with a guard that starts the podman machine when its state is not `running`. The machine reported `running`, so the guard started nothing and printed nothing. The forwarded socket was still refusing every connection. A plain start does not help a machine in that condition. It needs a stop first.\n\n**Why it matters.** Images are published only after the whole run succeeds. One wedged machine therefore blocks every consumer from pinning a new commit, and only a person with access to that machine can clear it. The guard exists to remove exactly that dependency.\n\n**How to reproduce.** Leave the machine in a state where `podman machine inspect` says `running` and `podman info` fails, then run any macOS job.\n\n**What would help.** The guard should ask the socket with `podman info`. When there is no answer it should stop the machine, start it, and wait for the socket. Three runners share the machine, so the final `podman info` should decide the step, not the exit status of the start.","notes":[{"date":"2026-09-21","text":"Commit 8d5e892 changes all three guards that way, and `actionlint` passes. It stays open until a run on the self-hosted runner shows the guard restart a machine and the job go on to pass."},{"date":"2026-09-21","text":"The new guard ran on the self-hosted runner and fired in both macOS jobs, printing `podman does not answer; machine says: running`. So the diagnosis was right. The remedy did not work. The stop and the start each reported success, but podman's own start warned `API socket failed ping test`. After the two-minute wait the socket still refused with `ssh: rejected: connect failed (open failed)`. A stop and start is therefore not enough for this condition, and the machine needs attention from someone with access to it. The guard is still an improvement: the job now fails at the guard with the cause named, where it used to fail later inside an image build."}],"links":[]},{"id":"SBX-068","title":"A background turn launched from under launchd never starts on macOS","type":"defect","severity":"high","status":"closed","foundBy":"campaign CI: every smoke podman (macos-arm64) leg since the self-hosted runners came back as LaunchDaemons on 2026-09-21; diagnosed by session agent","opened":"2026-09-21","resolved":"2026-09-23","stint":"macOS runner session, 2026-09-21","evidence":{"commits":["b9183b6"],"integrated":[],"verified":"go test ./internal/cli -run TestRemoteBackgroundTurnRuns -count=1 passes for claude, codex and opencode at 213c0de. In ci run 35943262899 at 213c0de, build-test on the self-hosted macos-arm64 runner passed internal/cli under make test-race. Campaign's ci run 35943266251 passed every smoke leg on that runner, where the record saw background turns never start."},"resolution":"The remote tools now start a background turn with `set -m` and `trap '' HUP`, using neither nohup nor setsid, so launchd has nothing to refuse.","details":"**What happened.** On macOS, `cs-\u003cagent>-remote -b` prints `Running:  background (PID unknown)` and the turn never runs. The log holds the prompt header and nothing else, `-output -s` calls the session crashed, and the per-session `.runner` script is left behind unexecuted. In campaign CI, every macOS smoke leg waited out its 15-minute readback with no member having run a turn.\n\n**Why.** The launch SBX-038 added for hosts without `setsid` is `( set -m; nohup \"$RUNNER_FILE\" … 2>&1 & )`. Apple's `nohup` is not GNU's. It calls `_vprocmgr_detach_from_console` before it execs, and when its caller runs in launchd's system domain, as a LaunchDaemon does, launchd refuses (`Session adoption is only allowed in user domains`). nohup then exits `can't detach from console` without running anything. That message goes to /dev/null with the rest of the launch's output. The self-hosted runners had been started by hand from a login session, where the detach succeeds, and SBX-038 was verified there. So the launch never ran under launchd until the machine rebooted and the runners came back as services.\n\n**Why it matters.** A CI runner, a launchd job, or anything else that drives turns from under launchd on a Mac cannot dispatch a single background turn, and nothing says why.\n\n**How to reproduce.** Run `cs-claude-remote -b` from any process in launchd's system domain on macOS. A self-hosted Actions runner installed with `svc.sh install` is one. The unified log shows `nohup[…] Could not adopt Background session: 125` at the moment of the launch.\n\n**What would help.** Launch with a form that needs no external program, so it behaves the same on every host. `set -m` gives the runner a process group of its own, and the hangup is ignored before the exec rather than by nohup.","notes":[{"date":"2026-09-21","text":"The three remote tools now launch with `( set -m; trap '' HUP; \"$RUNNER_FILE\" … & )` on every host, with no setsid and no nohup. On Linux and macOS, with and without a terminal, the runner gets its own process group, ignores SIGHUP, and survives its caller killing its own group. `TestRemoteBackgroundTurnRuns` runs every family with a nohup that fails the way Apple's does under launchd. It fails on the old launch (`PID unknown` for claude, codex and opencode) and passes on the new one. It stays open until a macOS runner, which runs as a LaunchDaemon, passes that test."}],"links":["SBX-038"]},{"id":"SBX-070","title":"make repin pins a sibling's tip whether or not its CI passed","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"If I wanted make repin to look for the last green built commit, could this just work with curl?\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["6bb1a6e","57caf31","213c0de"],"integrated":[],"verified":"`make repin` in a clean clone of main at 213c0de pinned each codesweep-ai tool at the first commit in its project's `built` list. The pin on lint went to its last build, though lint's main had since moved on to commits that changed only the ledger."},"resolution":"`make repin` pins each codesweep-ai tool to the first commit in the `built` list of that project's status file. A tool whose project lists no build keeps its pin rather than moving to the tip.","details":"`make repin` moves every codesweep-ai tool pin to its sibling's main with `go get …@main`. The tip of main may be a commit whose CI failed, one still building, or one that changed only the ledger and was never built. The status file each project publishes now names the newest commit its CI built and passed, as `built`. `make repin` pins that commit, and falls back to the tip where the file names none.","notes":[{"date":"2026-09-23","text":"`make repin` now reads `built` as the list the status file holds, and keeps a pin whose project lists no build. Moving it to the tip would pin a commit that may not have built."}],"links":[]},{"id":"SBX-071","title":"A push that changes only the ledger runs ci and republishes both images","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"support ledger builds on pushes that only contain ledger changes, with just linting, ledger checking, and a pages build to publish the ledger page\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"ledger-builds","evidence":{"commits":["2d544fc"],"integrated":[],"verified":"Pushing a164fd2, which changed only `ledger/`, started the ledger and pages workflows and no ci. Both passed, and the status file still lists 213c0de first in `built`. With no ci, publish images did not run either."},"resolution":"ci skips a push that changes only `ledger/`. The ledger workflow runs the ledger check and the document linters, and pages republishes the ledger's page. Nothing is built or published, so `built` stays.","details":"Closing an issue is a commit that changes only `ledger/`, and pushing it runs the whole of `ci`. `ci` finishing then publishes a build of code that has not changed: both images, on both architectures. Such a push needs only the ledger check, the document linters and a site build, which publishes the ledger's page.","notes":[],"links":[]},{"id":"SBX-072","title":"A ledger-only push during ci keeps the tested build out of `built`","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while tracing which commit a publish images run is listed under","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["213c0de"],"integrated":[],"verified":"sandbox's status file lists 213c0de first in `built`, found by the version tags ghcr.io holds for both images. The action's tests hold that a build counts by the registry, whatever commit GitHub lists its image run under."},"resolution":"The status file no longer pairs runs. A commit is built once ci passed on it and both images' version tags are in the registry.","details":"GitHub lists the `publish images` run that `ci` finishing starts under main's head at that moment, not the commit `ci` built. A ledger-only push that lands while `ci` runs puts the run under the ledger commit, which has no `ci` run. The status file then never names the build, and campaign, which pins only a built sandbox, waits for the next code push.","notes":[],"links":[]},{"id":"SBX-073","title":"cs-claude-turn classes a response that failed mid-stream as capacity, which tells a caller to wait","type":"defect","severity":"med","status":"closed","foundBy":"user report (host): a caller's session log from a sandboxed Claude Code turn on build 3d3fbb666359, confirmed against main by reading the driver","opened":"2026-09-25","resolved":"2026-09-26","stint":"2026-09-26 session","evidence":{"commits":["e39de4b"],"integrated":[],"verified":"TestClaudeTurnReportsAProviderFailure passes under `go test ./internal/cli/ -count=1`. Its mid-response case prints `failure class=capacity retry_after=0`, and the 529 overload and the 500 refused at the start still print `retry_after=-`. With the driver from 0f56c9a the mid-response case fails and the others pass. The full gate, `make check`, exits 0."},"resolution":"A response that broke after it began keeps the class `capacity` and now carries `retry_after=0`. CS_CLAUDE_REMOTE.md says what that means: send the prompt again to the same session at once. A class of its own would have been worse for the campaign side. Its turn-end parser counts only `throttled`, `capacity` and `unreachable` as a refusal that is resumed with no rung spent. Any other class falls to the ladder, which continues and spends a rung. Kept as `capacity`, the break reaches the `resume` that SAC-054 derives, after the shortest hold of 30 seconds.","details":"**What was seen.** A turn ended with Claude Code's message `API Error: Server error mid-response. The response above may be incomplete.` The assistant message was flagged `isApiErrorMessage`, with `error: \"server_error\"` and no `apiErrorStatus`. `cs-claude-turn` exited 5 and printed `failure class=capacity retry_after=-`. The request had streamed part of its answer for about three minutes before it failed. It was the only error in a long session.\n\n**Why.** The classifier in `image/rootfs/home/.local/bin/cs-claude-turn` maps every server error to one class:\n\n```\nelif kind == \"server_error\" or (isinstance(status, int) and status >= 500):\n    cls = \"capacity\"\n```\n\n**Why it matters.** CS_CLAUDE_REMOTE.md tells a caller to wait after `capacity`, as it does after `throttled`. A fleet harness that honours the class then idles for its capacity back-off. A stream that broke once is a transient failure of that one request, and the provider was answering. Sending the prompt again at once is the right move for it.\n\n**How to reproduce.** Append to a turn's session JSONL a last assistant message with `\"isApiErrorMessage\": true`, `\"error\": \"server_error\"`, no `apiErrorStatus`, and the text above, then a `turn_duration` marker. The driver prints `class=capacity`. A lender fault that closes a 200 stream partway would reproduce it live.\n\n**What is asked for.** Tell a stream that failed after it began apart from an overload or a 5xx refused at the start. The message text `mid-response` and the missing status both mark it. Give it `other` or a class of its own whose documented move is to retry promptly.","notes":[],"links":["SBX-051","SBX-062"]},{"id":"SBX-074","title":"agent-login refuses a sandbox named with its group, so it cannot log in a sandbox outside the default group","type":"defect","severity":"med","status":"closed","foundBy":"user report (host): agent-login failed on a sandbox in a named group on build 3d3fbb666359, confirmed against main by reading the command","opened":"2026-09-25","resolved":"2026-09-26","stint":"2026-09-26 session","evidence":{"commits":["b549614"],"integrated":[],"verified":"TestAgentLoginTakesTheReferenceExecTakes passes under `go test ./internal/cli/ -count=1`. Two sandboxes named `worker` sit in `team` and in `default`, and `agent-login claude worker.team` launches cs-claude in `worker.team` while the bare `worker` reaches `worker.default`. With the command from a84365f the qualified case fails and the bare one passes. The full gate, `make check`, exits 0."},"resolution":"`agent-login` now hands the engine the resolved sandbox's own name, as `exec` does, so it accepts every reference `exec` accepts. The repository had no table of commands tested with a group-qualified reference, so the test stands on its own in internal/cli/group_test.go.","details":"**What was seen.** This is what it prints for a sandbox in a group other than `default`:\n\n```console\n$ cs-sandbox agent-login claude \u003cname>.\u003cgroup>\ncs-sandbox: launching cs-claude inside \u003cname>.\u003cgroup> — follow the prompts, then exit.\ncs-sandbox: invalid sandbox name \"\u003cname>.\u003cgroup>\": use letters, digits and dashes only (must start and end alphanumeric)\n```\n\nThe bare name resolves only in `default`, and fails with `no such sandbox \"\u003cname>\" in group \"default\"; it exists as \u003cname>.\u003cgroup> — name the group`. The command has no flag for the group. So `agent-login` cannot reach any sandbox outside `default`. `cs-sandbox exec \u003cname>.\u003cgroup>` accepts the same reference.\n\n**Why.** `newAgentLoginCmd` in `internal/cli/misc_commands.go` resolves the reference with `app.engineFor(name)` and then passes the unresolved `name` to `e.Exec`. The engine validates it as a bare sandbox name and refuses the dot. `exec` passes `in.Name`, the resolved instance's own name, and works.\n\n**Why it matters.** SPEC section 10.1 names `agent-login` as the route for a sandbox that needs a login of its own. It is also how a person replaces an inherited login that has stopped working. The launch line printed before the failure also reads as though the login had started.\n\n**Workaround.** Run `cs-sandbox exec \u003cname>.\u003cgroup>`, start the agent's CLI there, and log in by hand.\n\n**What would help.** Pass `in.Name` to `Exec`, as `exec` does, and add `agent-login` to the table of commands tested with a group-qualified reference.","notes":[],"links":[]},{"id":"SBX-075","title":"cs-claude-turn does not recognise Claude Code's one-time promotional dialog, and fails the turn after waiting a minute","type":"defect","severity":"med","status":"closed","foundBy":"user report (host): a turn failed at setup on Claude Code 2.1.258 on build 3d3fbb666359, confirmed against main by reading the driver","opened":"2026-09-25","resolved":"2026-09-26","stint":"2026-09-26 session","evidence":{"commits":["717f168"],"integrated":[],"verified":"TestClaudeTurnAnswersADialogOrSaysWhoMust and TestTurnDriversSayWhetherAnAgentIsInATurn pass under `go test ./internal/cli/ -count=1`. On the renderer dialog the driver sends Escape, the turn exits 0 with its answer, and the turn log reason reads `dismissed a dialog: Try the new fullscreen renderer?`. On an unknown numbered dialog the driver presses nothing and exits 3 within seconds, quoting the screen, and `--state` reads `blocked`. With the driver from 389253c both turn cases time out after 60 seconds with `last state: unknown`, as reported. The full gate, `make check`, exits 0."},"resolution":"The driver works in two tiers. It keeps a short list of one-time dialogs whose refusal is safe, each with the key that refuses it, and answers them itself. The renderer offer is refused with Escape, and the turn log records the dismissal. Any other screen whose bottom shows a numbered choice or a confirm prompt reads `blocked`, and the turn fails at once with the screen's text in its message. The screens the driver already knew are read as before. Answering first-run prompts ahead of time in the member image's config, and pinning the Claude Code version, belong to the apparatus side and not to this repository.","details":"**What was seen.** Claude Code 2.1.258 showed a one-time dialog at start-up, after an interactive session had run in the same config directory:\n\n```\nTry the new fullscreen renderer? …\n1. Yes, try it\n2. Not now\nEnter to confirm · Esc to cancel\n```\n\n`cs-claude-turn` waited for the TUI to become ready, then printed `timed out waiting for the TUI to become ready (last state: unknown)` and exited 3, a setup failure. Every later turn in that session would meet the same dialog until a person answered it.\n\n**Why.** `detect_state` knows the trust prompt, the sign-in and onboarding screens, a picker that reads `Enter to select … Esc to cancel`, and a tool approval. This dialog matches none of them, so it reads `unknown`. `wait_ready` treats `unknown` as a screen still loading and polls it for 60 seconds. `--state` also answers `unknown` rather than `blocked`.\n\n**Why it matters.** A caller learns only that the driver timed out, not that a screen is waiting for a person or what it says. Claude Code adds dialogs like this from release to release, so a list of known screens will keep falling behind.\n\n**How to reproduce.** Start a tmux session whose pane shows the text above and no status line, then run a turn against it. After about 60 seconds the driver fails with exit code 3, and its message says `last state: unknown`.\n\n**What would help.** Read a pane with a numbered choice and `Enter to confirm` or `Esc to cancel` as `blocked`, and put the screen's text in the failure message. A dialog whose refusal is safe, like this one, could be answered with Esc, the way the trust prompt is answered with Enter.","notes":[],"links":["SBX-056"]},{"id":"SBX-076","title":"A passing make ci leaves no build a sibling can pin","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["18f4083"],"integrated":[],"verified":"`make ci` at 3b3e213 ended `record-build: recorded sandbox 3b3e213 as a local build in ~/.local/share/cs-builds/codesweep-ai (go v0.0.0-20260926051938-3b3e2139d9e9)`. dashboards' tests/test_record_build.py passes all 15 of its tests against this same scripts/record-build.sh, byte for byte. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"A clean, passing `make ci` now records its commit in the owner's build store, `~/.local/share/cs-builds/\u003cowner>/`. It keeps the Go module in the module proxy's layout, the npm packages where the project has them, and an entry naming the versions. A run over uncommitted changes records nothing, and says so.","details":"`make ci` runs every gate CI runs, on this machine, and leaves nothing another project can pin. Pins move only to commits GitHub CI lists as built. So a change across several projects has to be pushed and built one project at a time before the next can pin it. A clean passing run could record its commit as a local build instead: the module zip Go resolves it from, and an entry naming its versions. They would go in a store the sibling projects read. Go and npm builds of a clean commit are byte-identical to CI's. A pin on such a build is therefore the pin CI writes once that commit is pushed.","notes":[],"links":[]},{"id":"SBX-077","title":"make repin cannot pin a sibling's local build","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["18f4083"],"integrated":[],"verified":"dashboards' tests/test_repin_go.py passes all 7 of its tests against this same scripts/repin-go.sh. They pin and name a newer local build, and take CI's under `LOCAL=0`, when CI's is newer, and on a tie. They hold a build awaiting images, and skip one whose commit left the branch. In a scratch workspace, campaign's copy left out sandbox's newest local build once the sandbox checkout beside it held that commit on no branch. It said so, and took the build CI had made. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"`make repin` now moves each cs- pin to the newer, by commit time, of the sibling's last CI build and its newest local build. It names each pin taken from a local build, and resolves those through the store's module proxy ahead of the usual one. `make repin LOCAL=0` takes CI builds only, and no module is fetched with `GOPROXY=direct` any more.","details":"`make repin` moves each codesweep-ai tool pin to the first commit in `built` of its project's status file, and to nothing else. A build that a clean `make ci` recorded in the build store is invisible to it. So a change made across several projects cannot pin its own parts before they are pushed. Every module is also fetched with `GOPROXY=direct`. On a cold cache that reaches every module's source host, and it hung for over seven minutes where one did not answer.","notes":[],"links":[]},{"id":"SBX-078","title":"A local image build takes the name CI publishes","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reviewing how local builds reach images (tasks/pin-on-local-builds.md, section 7)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1b95c11"],"integrated":[],"verified":"TestEnsureImagePrefersThePublishedImage, TestEnsureImageFallsBackToTheLocalBuild and TestEnsureImageWithNeitherNamesBuild pass, and the build tests now expect the localhost/ names. For real, `cs-sandbox build` at 3b3e213 found no published image, and built localhost/codesweep-ai/sandbox:v0.0.0-20260926051938-3b3e2139d9e9. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"An image `build` makes on this host is tagged `localhost/\u003cowner>/sandbox:\u003cversion>`, or sandbox-slim for the slim one, never the name CI publishes (SPEC R166). `create` takes the published image first, from this host or the registry, and the local build only when neither has it.","details":"`cs-sandbox build` of a version no registry holds tags the image `ghcr.io/\u003cowner>/sandbox:\u003cversion>`. That is the name CI pushes for the same version, so bytes built on this machine pass for CI's. Images are not reproducible, so the two differ. `create` only ever asks for that name, so a host keeps its local image even once CI publishes the real one. The slim image is named the same way.","notes":[],"links":[]},{"id":"SBX-079","title":"build installs a sibling's local build only by hand","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach images (tasks/pin-on-local-builds.md, section 7)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1b95c11"],"integrated":[],"verified":"TestBuildTakesAPinTheStoreHolds, TestBuildPacksItsOwnUnrecordedCommit, TestBuildTakesItsOwnCommitFromTheStoreFirst, TestLocalModulesNoneReadsNothing and TestLocalModulesNamesAnotherStore pass. For real, `cs-sandbox build` at 3b3e213 installed sandbox v0.0.0-20260926051938-3b3e2139d9e9 from the local build store. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"`build` installs each pinned cs- tool from the owner's build store where it holds that version, and from the Go module proxy otherwise. It packs its own commit from its checkout when no store holds it (SPEC R167). `--local-modules DIR` reads another store, `--local-modules none` reads none, and `--local-sandbox` is gone.","details":"The image installs each cs- tool by version from proxy.golang.org. A tool pinned at a version a clean `make ci` recorded in the local store is not there, so the image stops at `go install`. `--local-sandbox` covers cs-sandbox's own commit, and nothing covers a sibling's. It is also a flag to remember for what should be the default.","notes":[],"links":[]},{"id":"SBX-080","title":"The local module proxy writes the wrong go.mod and no time","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reviewing internal/cli/localproxy.go (tasks/pin-on-local-builds.md, section 9)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1b95c11"],"integrated":[],"verified":"TestLocalModuleProxyServesTheRevisionNotTheTree passes. With go.mod edited in the working tree, the proxy serves the revision's own go.mod, and its `.info` carries the commit's time. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"The local module proxy takes go.mod from the revision it zips rather than from the working tree. Its `.info` carries the commit's time as well as the version.","details":"`localModuleProxy` zips a revision but copies go.mod from the working tree, so a checkout with an edited go.mod serves a manifest that does not match its zip. Go records the manifest's hash in go.sum, so the line it writes is wrong. Its `.info` carries only `Version`, with no `Time`, which Go reads to order versions.","notes":[],"links":[]},{"id":"SBX-081","title":"A local image build leaves nothing a sibling's repin can wait on","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach images (tasks/pin-on-local-builds.md, section 7)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1b95c11"],"integrated":[],"verified":"TestBuildRecordsItsImageForASiblingsRepin, TestBuildCommitsItsImageRecordInARepositoryStore and TestBuildRecordsNoImageSiblingsMayNotPin pass. For real, `cs-sandbox build` and `cs-sandbox build --slim` at 3b3e213 wrote sandbox.json and sandbox-slim.json under images/sandbox/\u003ccommit>/ in the store. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"An image `build` makes of a commit the store records is recorded there, and committed where the store is a git repository (SPEC R168). The `make ci` here records its build awaiting both images, so a sibling's repin waits for them.","details":"CI's status file lists a sandbox commit only once both of its images are published. `make ci` records a local build of sandbox with no word of images, and `cs-sandbox build` writes nothing to the build store once it has made one. So campaign's `make repin` cannot tell a local sandbox build that has its images from one that has none.","notes":[],"links":["SBX-078"]},{"id":"SBX-082","title":"build cannot read a store named outright, as a campaign member's is","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach campaign members (tasks/pin-on-local-builds.md, section 8)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1b95c11"],"integrated":[],"verified":"TestBuildStore passes: `CS_BUILD_STORE` names the store outright, ahead of `CS_BUILDS_DIR` and the default. TestLocalModulesNamesAnotherStore passes too. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"`build` reads the store `CS_BUILD_STORE` names, as the other tools do, and `--local-modules DIR` names one for a single build.","details":"`cs-sandbox build` reads the store of the owner it names its images after. A campaign member holds its store as a clone at a path of its own. The other tools will find that path through CS_BUILD_STORE (DSH-029), and `build` does not read it.","notes":[],"links":[]},{"id":"SBX-083","title":"make build-go names a fork's images codesweep-ai","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reviewing how local builds reach installs (tasks/pin-on-local-builds.md, section 9)","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1c5870f"],"integrated":[],"verified":"In a scratch clone at 3b3e213 whose origin is `git@github.com-fork:forker/sandbox.git`, `make build-go` built a bin/cs-sandbox whose `version --images` names ghcr.io/forker/sandbox and localhost/forker/sandbox. GitHub CI's `ci` passed on 3b3e213, once the nested sandbox smoke job was run again: its microVM had stopped answering."},"resolution":"The owner is read from origin with a pattern that takes an SSH host alias, as record-build.sh already did. A fork's build now names its images after the fork's owner.","details":"`Makefile's IMAGE_OWNER` reads the owner from origin with `[@/]github\\.com[:/]`, which needs a `:` or `/` right after `github.com`. An SSH host alias such as `git@github.com-fork:forker/sandbox.git`, which a fork's clones use, does not match. The build then falls back to `codesweep-ai`, so a fork's binary names its images under this project's name.","notes":[],"links":[]},{"id":"SBX-084","title":"Codex 0.156.1 and later exit at startup when a sandbox holds a lent ChatGPT login","type":"defect","severity":"high","status":"closed","foundBy":"session agent, re-recording the agent fixtures for a bump to Codex 0.157.1","opened":"2026-09-25","resolved":"2026-09-26","stint":"codex-discovery","evidence":{"commits":["804ee40","3ca7df4","bd96377"],"integrated":[],"verified":"In a lent Firecracker sandbox with Codex 0.157.1, a real turn answered, and the lender answered the discovery and lent the model calls. The same sandbox without the new variable failed with the error above. With the host's own login shared into a sandbox, Codex 0.157.1 recorded a real turn through cs-vcr and replayed it with 0 misses and 0 upstream calls. The four Codex fixtures were re-recorded on 0.157.1, and `make ci CI_SLIM_FLAGS='--slim --rebuild-base'` passed on bd96377 with all 14 agent replays."},"resolution":"The lender answers Codex's workspace discovery itself for a lent login, under a second name, cs-lender-chatgpt (R146a). For a shared login cs-vcr answers it, under cs-vcr-chatgpt, which the agent matrix now points a shared Codex at. Each answer names the account and a concrete HTTPS origin, which Codex requires. The image's Codex is now 0.157.1.","details":"On a ChatGPT login, Codex's TUI now makes a workspace routing discovery call to chatgpt.com at startup. When that call fails, Codex prints `Error: account/read failed during TUI bootstrap: account/read failed: workspace routing discovery failed (code -32603)` and exits 1.\n\nA sandbox created with `--lend-agent-login codex` cannot make that call succeed. Its side calls to chatgpt.com are blocked by default. With `--block-side-calls=false` the call carries the sandbox's fabricated token, and Codex exits on `workspace routing discovery unauthorized (401)` instead. A sandbox given the real login with `--inherit-agent-login codex` starts normally.\n\nEach stable release was started with a lent login in the slim image. Releases 0.152.1, 0.153.4, 0.154.0 and 0.155.1 reach the prompt. Releases 0.156.1, 0.157.0 and 0.157.1 exit, and 0.156.0 was not tested. The fixture recording fails the same way in both codex-login cases, because cs-vcr refuses chatgpt.com in the shared case as well.\n\nThis holds the image's Codex pin at 0.155.1. Moving past it needs the lender, and cs-vcr in replay, to answer the discovery call for a lent login.\n\nTo reproduce, build the image with `CODEX_VERSION=0.156.1`, create a sandbox with `--lend-agent-login codex`, and run `cs-codex` inside it.","notes":[{"date":"2026-09-26","text":"804ee40 has the lender answer the discovery itself for a lent login, under a second name, cs-lender-chatgpt (R146a). In a lent Firecracker sandbox with Codex 0.157.1 installed, a real turn answered, and the lender answered the discovery once and lent the model calls. Without the new variable, the same sandbox failed with the error above. Codex 0.155.1 still works through the change, and all 14 agent replays pass on an image rebuilt with it. The pin stays at 0.155.1 for two reasons. The fixture recording's codex-login-shared case still fails, because cs-vcr refuses chatgpt.com there. And 0.157 opens the dialog in SBX-085."},{"date":"2026-09-26","text":"The shared case is fixed too. Now cs-vcr answers the discovery itself, as its record VCR-044 describes. Commit 3ca7df4 pins that build and points the agent matrix's shared Codex login at it under a second name, cs-vcr-chatgpt. Codex 0.157.1 recorded and replayed a real turn that way with the host's own login, and all 14 agent replays pass. What still holds the pin at 0.155.1 is the dialog in SBX-085."}],"links":[]},{"id":"SBX-085","title":"cs-codex-turn reads Codex's model migration dialog as ready and pastes the prompt into it","type":"defect","severity":"med","status":"closed","foundBy":"session agent, re-recording the agent fixtures for a bump to Codex 0.157.1","opened":"2026-09-25","resolved":"2026-09-26","stint":"codex-discovery","evidence":{"commits":["72aeff9"],"integrated":[],"verified":"`go test ./internal/cli/ -run 'TestCodexTurnAnswersADialogOrSaysWhoMust|TestTurnDriversSayWhetherAnAgentIsInATurn' -count=1` passes on 72aeff9, and both dialog cases fail without its driver change. In a sandbox on the rebuilt image, Codex 0.157.1 was offered gpt-6-sol from a replayed catalog. The driver logged `answered a dialog: Use existing model`, and Codex wrote the acknowledgement to config.toml. The matrix's codex-login-shared replay passed with the same offer, and `make ci` passed with all 14 agent replays."},"resolution":"The Codex driver keeps a table of known one-time dialogs, as the Claude driver does. It declines a newer-model offer with 2, which keeps the configured model, and says so in the turn log. Any other modal, a migration that cannot be declined among them, fails the turn at once and quotes the screen, and the driver presses nothing on it. The live catalog no longer offers gpt-5.6-sol an upgrade, so the recorded fixtures do not show the dialog.","details":"Codex 0.157.0 added a dialog that offers a newer model when the configured one has a successor. With `model = \"gpt-5.6-sol\"`, which the agent matrix configures, it opens at startup as `Meet GPT-6 Sol` with `1. Try new model` and `2. Use existing model`.\n\nThe dialog's footer, `enter/esc confirm · ctrl+c quit`, contains the ` · ` separator that `detect_state` takes for Codex's status line. The driver therefore reads the dialog as ready and pastes the prompt into it. No turn starts, and the driver exits 3 with `could not locate the codex rollout JSONL after submitting` about 25 seconds later.\n\nChoosing `2. Use existing model` writes `\"gpt-5.6-sol\" = \"gpt-6-sol\"` under `[notice.model_migrations]` in config.toml, and the dialog does not return. The image's Codex is held at 0.155.1 by the lent-login failure in SBX-084, and that release has no such dialog. A bump to 0.157 needs the driver to recognise the dialog and keep the configured model.","notes":[],"links":["SBX-084"]},{"id":"SBX-086","title":"The lent Claude login replay misses on Claude Code 2.1.283, because the replay host names no account","type":"defect","severity":"high","status":"closed","foundBy":"session agent, replaying the fixtures re-recorded for a bump to Claude Code 2.1.283","opened":"2026-09-25","resolved":"2026-09-25","stint":"agent-cli-bump","evidence":{"commits":["34a01b6"],"integrated":[],"verified":"With the fixtures recorded on Claude Code 2.1.283, `make test-agents-replay` passed 14 of 14 cases in two podman runs and in one with `AGENTS_ENGINE=firecracker`. Before the change, claude-login-lent missed in 4 runs out of 4 with `4 items vs 3`. The `make ci` gate then passed, all 14 replays included."},"resolution":"The replay host now names a fabricated account, as a signed-in host does. A lent replay then carries an address as well, the recorder strips it on both sides, and the requests match.","details":"Recorded on Claude Code 2.1.283, `TestAgentReplay/claude-login-lent` misses at its third request with `messages[0].content: 4 items vs 3 recorded`. It failed 4 runs out of 4, and the other 13 cases pass.\n\nA lent Claude login carries the host's `oauthAccount`, address included, into the sandbox. A recording runs on the real profile, so its sandbox knows an address, and Claude Code writes it into a `# userEmail` section of a system reminder. The recorder, cs-vcr, strips that section and leaves the reminder. The replay host is fabricated with a credential and no account, so its sandbox knows no address and sends no reminder at all.\n\nClaude Code 2.1.258 was not affected. Its reminder also carried `# claudeMd` and `# currentDate`, so it was present either way. 2.1.283 moved both out, and the address is now all that reminder holds.\n\nThe replay is part of `make test-smoke`, so a cassette recorded on 2.1.283 turns CI red.","notes":[],"links":[]},{"id":"SBX-087","title":"The smoke tests leave the machine's network keepalive running on a directory they delete","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reproducing a failed oss-repin gate on a developer machine","opened":"2026-09-28","resolved":"2026-09-28","stint":null,"evidence":{"commits":["2b8fd5a"],"integrated":[],"verified":"With the default keepalive removed first, `make test-smoke` on 2b8fd5a ran in the group smoke-2059934 and passed. Afterwards no cs-sandbox-net-keepalive existed, no cs-sandbox-smoke-* network remained, and the host ran as many dnsmasq processes as before. An earlier run that failed its nested microVM test also left no network behind. `make ci` on 2b8fd5a then passed, with the smoke profile in the group smoke-2102683 and the same state afterwards."},"resolution":"`make test-smoke` runs the profile in the group that CS_SANDBOX_GROUP names, or in a new one for each run. Its sandboxes get their own network, keepalive and gateway, never the machine's default ones. When the profile ends, pass or fail, the recipe stops the group's resolver and removes its network. `make test-integration` is unchanged, and still runs in the default group.","details":"The smoke profile's live tests create the machine-wide `cs-sandbox-net-keepalive` with its gateway seed bind-mounted from the test's own temp directory, and with `--restart=always`. The test then deletes that directory and leaves the container running. A later create on the same machine reuses it, because a running keepalive that has the fabric resolver is taken as healthy. After a reboot or a podman restart it cannot start again, since its mount source is gone. Until 7ecbc17 that failed every later create with \"the container name is already in use\". Since then the next create replaces it.\n\nTo see it, run `make test-smoke`, then `podman inspect cs-sandbox-net-keepalive --format '{{range .Mounts}}{{.Source}}{{end}}'`.","notes":[],"links":[]},{"id":"SBX-088","title":"After the host's address changes, a microVM create fails with an error that blames the podman version","type":"defect","severity":"high","status":"closed","foundBy":"session agent, reproducing a failed oss-repin gate on a laptop that had changed Wi-Fi networks","opened":"2026-09-28","resolved":"2026-09-28","stint":"reliability session, 2026-09-28","evidence":{"commits":["d0c3796"],"integrated":[],"verified":"`go test ./internal/engine/ -run 'TestStaleAddr|TestRootlessBusy|TestStaleError' -count=1` passes on d0c3796. On a live host, the namespace was made stale by hand with an extra address on wlp0s20f3. StaleRootlessAddr reported it, and rootlessBusy found only the idle keepalive. releaseRootless then left a fresh namespace within 3.3 seconds, and the probe at 169.254.1.2 answered in it. `make ci` on d0c3796 passed afterwards, with the fabric brought up again. A real change of network was not repeated after the fix."},"resolution":"A firecracker create whose probe fails compares the namespace's addresses with the host's, interface by interface. Where they differ and only idle fabrics hold the namespace, it takes those down and waits for podman to set up a fresh one. It then brings the fabric up again and probes once more. Anything else still running there is named in the error, and `cs-sandbox doctor` reports the stale address in the same words.","details":"Podman's rootless network namespace keeps the host address that pasta copied into it when it started. When the host moves to another network, as a laptop does on a new Wi-Fi lease, the namespace keeps the old address. From then on nothing answers at 169.254.1.2 inside it, and every firecracker create fails. The error says the engine needs podman 5.0 or later with pasta, which is not the cause. A lent sandbox loses the host the same way: the smoke test's lender could no longer reach its recorder.\n\nIt lasts for as long as anything holds the namespace, and the fabric's keepalive and dnsmasq always do. On 2026-09-27 the namespace held 192.168.40.105 while the host had 192.168.5.109. It cleared once the keepalive was removed and dnsmasq was stopped.","notes":[],"links":["SBX-035"]},{"id":"SBX-089","title":"A smoke run that fails breaks every later make ci, which judges the smoke coverage an earlier run left","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reading why a sandbox gate failed in oss-repin","opened":"2026-09-28","resolved":"2026-09-28","stint":"reliability session, 2026-09-28","evidence":{"commits":["14f671d"],"integrated":[],"verified":"With a partial smoke tier in .coverage, `scripts/coverage.sh check` failed as before, and `scripts/coverage.sh check unit` passed. `make ci` on d0c3796 printed `coverage: every package in .coverage-baseline is still reached (tiers: unit)` inside check. After test-smoke it printed the same for `(tiers: unit smoke)`."},"resolution":"`coverage.sh check` takes the tiers to judge. `make ci` judges the unit tier inside check, then the unit and smoke tiers once test-smoke has made them. It judges smoke only where podman and /dev/kvm let the whole profile run. The data another run left is no longer read.","details":"`make ci` runs `coverage-check` inside `make check`, before its own `test-smoke`. That check judges every tier present in .coverage, so the smoke tier it reads is whatever an earlier run left. When that run failed partway, the tier is partial. Every later `make ci` then fails with packages \"no longer reached by the smoke tier\" before its own smoke run starts. A passing earlier run hides the other half of the fault: the smoke coverage of the run in progress is never judged.\n\nOn 2026-09-27 a smoke run that failed in its first minute failed the next two gates this way.","notes":[],"links":[]},{"id":"SBX-090","title":"The Codex and Claude turn drivers give up on a dialog they know after three quick answers","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reading a failed agent replay in a local smoke run","opened":"2026-09-28","resolved":"2026-09-28","stint":"reliability session, 2026-09-28","evidence":{"commits":["e02e24c"],"integrated":[],"verified":"`go test ./internal/cli/ -run 'TestCodexTurnAnswersADialogOrSaysWhoMust|TestClaudeTurnAnswersADialogOrSaysWhoMust' -count=1` passes on e02e24c. Its new cases, where the TUI ignores its first four keys, fail on the drivers before that commit after about 3 seconds. `make ci` on d0c3796 passed."},"resolution":"Both drivers answer a known dialog again every second for up to 15 seconds. The two variables CS_CODEX_DIALOG_SECS and CS_CLAUDE_DIALOG_SECS change that limit. Only then do they take it for a screen that needs a person. The answer is logged once.","details":"cs-codex-turn and cs-claude-turn answer a one-time dialog they know with its key. They try three times, a second apart, then fail the turn as one that needs a person. A TUI ignores keys that arrive before it takes input, and on a busy host that can be several seconds after the dialog is drawn.\n\nOn 2026-09-28 the codex-openai-lent replay of a local smoke run failed this way. The screen still showed Codex's newer-model offer, with its first option selected. The same case passed in the next run.","notes":[],"links":["SBX-085","SBX-075"]},{"id":"SBX-091","title":"The integration tier, and an engine-level member of the smoke profile, still use the machine's default network","type":"defect","severity":"med","status":"closed","foundBy":"session agent, extending the SBX-087 fix to make test-integration","opened":"2026-09-28","resolved":"2026-09-28","stint":"reliability session, 2026-09-28","evidence":{"commits":["5fb190e"],"integrated":[],"verified":"`make test-smoke` with TestPodmanCreateLive and TestFirecrackerCreateLive ran both engine-level tests in the group smoke-2143452, and both passed. The default fabric's hosts.d was untouched, and the group used a directory of its own. No default keepalive, group network or resolver was left afterwards. The full `make test-integration` ran in the group integ-2147238 in 19 minutes and left the same state. Its one failure was SBX-092, which fails on unmodified main too. `make ci` on cf550a1 passed."},"resolution":"`make test-integration` runs in the group CS_SANDBOX_GROUP names, or a new one for each run, as `make test-smoke` does. It removes that group's resolver and network when it ends. The engine-level live tests take that group, its network and a tap prefix of their own, and the CLI-level ones look for their state in it. The host-route test still covers the default group on purpose, and runs only when CS_SANDBOX_IT_HOSTROUTE asks for it.","details":"SBX-087 moved `make test-smoke` into a group of its own, but `make test-integration` still runs every live test in the default group. It makes and reuses the machine's default network and keepalive, as the smoke profile did before. The engine-level live tests build their own Deps with the network `cs-sandbox-net`, whatever group a target names. One of them, TestPodmanCreateLive, is a smoke member, so its container joins the default network even inside the smoke profile's own group.","notes":[],"links":["SBX-087"]},{"id":"SBX-092","title":"TestBuildWithoutARevisionPacksNothing fails wherever CS_SANDBOX_IMAGE is set, as make test-integration sets it","type":"defect","severity":"low","status":"closed","foundBy":"session agent, running make test-integration while verifying SBX-091","opened":"2026-09-28","resolved":"2026-09-28","stint":"reliability session, 2026-09-28","evidence":{"commits":["cf550a1"],"integrated":[],"verified":"`go test -tags integration ./internal/cli/ -run '^TestBuildWithoutARevisionPacksNothing$'` passes on cf550a1, with CS_SANDBOX_IMAGE unset and with it set to an image. Before cf550a1 the same test failed with it set. `make ci` on cf550a1 passed."},"resolution":"The test clears CS_SANDBOX_IMAGE, so the build it runs has to name its image from its version, and it meets the refusal under test.","details":"The test builds with no version and expects the refusal of a build that cannot name its image. `make test-integration` sets CS_SANDBOX_IMAGE, and a build takes its image name from there. So it passes that refusal and meets a later one about the module version, and the test fails although the build is still refused. It fails only in that target, which no gate runs, so nobody saw it.","notes":[],"links":[]},{"id":"SBX-093","title":"Neovim's Mason installs nothing into a root that does not exist yet","type":"defect","severity":"med","status":"closed","foundBy":"session agent, setting up this repo's Neovim config on a host without /opt/nvim/mason","opened":"2026-09-28","resolved":"2026-09-28","stint":"host Neovim setup session, 2026-09-28","evidence":{"commits":["4d50966"],"integrated":[],"verified":"I ran headless nvim on fresh XDG directories with no Mason root. On 75c104e the registry refresh was off, no registry downloaded and `html-lsp` was not found, for both the `stdpath(\"data\")/mason` fallback and a new `$MASON_ROOT`. On 4d50966 the refresh was on, the GitHub registry downloaded and `html-lsp` was found in both cases. A `$MASON_ROOT` that cannot be created, and an existing directory the user cannot write, still start with no error and stay read-only. `make ledger prose refs` passed."},"resolution":"`mason.lua` creates its Mason root before it tests whether it can write there. A new private root therefore counts as writable, and Mason fetches its registry.","details":"`lua/plugins/mason.lua` treats its Mason root as read-only when the directory is missing, because `vim.uv.fs_access()` returns false for a missing path. A read-only root turns off Mason's registry refresh, so the registry is never downloaded. `:MasonInstallSync!` then fails with `Cannot find package \"html\"`, and nothing installs.\n\nIt happens to any root that nobody created in advance. One is `$MASON_ROOT` pointed at a new directory, which SPEC.md offers for a private writable package set. Another is the `stdpath(\"data\")/mason` fallback on a host without /opt/nvim/mason. The image build never sees it, because it creates /opt/nvim/mason before the pre-build.","notes":[],"links":[]},{"id":"SBX-094","title":"The build store keeps every npm package it is given, which slows every install through it","type":"defect","severity":"low","status":"closed","foundBy":"session agent, investigating campaign's failed `make repin` of 2026-09-29","opened":"2026-09-29","resolved":"2026-09-29","stint":"2026-09-29 npm build store","evidence":{"commits":["44ce57a"],"integrated":[],"verified":"dashboards' tests/test_record_build.py passes 18 of 18 against this record-build.sh, byte for byte, and its prune test fails against the previous copy. Run over a copy of the owner's store, the prune took npm/ from 179 packages (311 MB) to 47 (83 MB), keeping each project's three newest."},"resolution":"Each recorded build removes the npm packages of older ones. A project keeps them for its three newest builds recorded within three days, and for its newest whatever its age. Entries, modules and images stay, and a store that is a repository, as a campaign's is, is left whole.","details":"Nothing removed npm packages from the owner's build store. Each clean `make ci` in lint, ledger or npmrevs adds five there, and `npm run ci` in ui adds one. The cs-npmrevs registry reads every package it serves before it answers, and `scripts/with-npmrevs.sh` serves the store, so each build made every later install through it wait longer. By 2026-09-29 the store held 179 packages (311 MB), the registry took about 9 seconds to start, and campaign's `make repin` failed waiting for it. This project records no npm package, but it carries the same script, so a build recorded here is a moment the store can be pruned.","notes":[],"links":[]},{"id":"SBX-095","title":"The lender forwards a dot-segment path upstream with the real credential","type":"defect","severity":"high","status":"closed","foundBy":"session agent, comparing the lender with another credential gateway","opened":"2026-10-18","resolved":"2026-10-18","stint":"lender-fixes","evidence":{"commits":["657bf89"],"integrated":[],"verified":"go test ./internal/lend/ -count=1: TestAnUncleanPathIsRefusedAndNeverForwarded PASS with 21 cases over the five slots, 0 upstream calls and 0 credential reads. With the guard removed, all 21 cases fail and the upstream is called 20 times. The full `make ci` gate on the four lender commits together exited 0, with 14 of 14 agent replay cells passing on podman."},"resolution":"The lender refuses, with 400 `unclean_path`, any path holding a dot segment in any spelling, an empty segment, a backslash, an encoded slash or an escape left after decoding. It does so before anything reads the path (R146b).","details":"The lender joins the inbound path into the slot's origin unchanged, and the backend check reads the raw prefix. A sandbox that sends `/../wham/accounts/check` to the Codex slot reaches the upstream as `/backend-api/codex/../wham/accounts/check`, with the host's real ChatGPT token attached. Sending `%2e%2e` instead has the same effect.\n\nIf the provider or its CDN resolves dot segments, that reaches the backend endpoints R146a refuses, with the user's credential. The same applies to `/v1/../` on every other slot.\n\nTo reproduce, send a raw request line with `..` in the path to the lender with a valid loan, and read the path the upstream receives. A client like curl may resolve the segment before sending it.","notes":[],"links":["SBX-097"]},{"id":"SBX-096","title":"The lender container mounts the whole host home and every group's instances","type":"defect","severity":"high","status":"closed","foundBy":"session agent, comparing the lender with another credential gateway","opened":"2026-10-18","resolved":"2026-10-18","stint":"lender-fixes","evidence":{"commits":["4726d1b","2df7853"],"integrated":[],"verified":"go test ./internal/cli/ -count=1: TestTheLenderMountsOnlyWhatItReads and TestEnsureReplacesALenderWithOlderMounts PASS. With the narrowed mounts, `make test-agents-lent` on podman 5.8.7 ran 7 of 7 cells green. The full `make ci` gate on the four lender commits together exited 0, with 14 of 14 agent replay cells passing on podman. Unit tests alone cover the replacement of a box with the old mounts."},"resolution":"The lender mounts read-only just the directory each slot's credential lives in, plus its own group's directory. A directory is mounted rather than a file, because a credential is replaced by a rename. A lender created with the old mounts is replaced on the next create or start in its group (R150f).","details":"The lender box bind-mounts the agent login home, `$HOME` by default, and the whole instances root, both read-only. The lender reads only the credential files and its group's loans. Any bug that lets a sandbox read a file through the lender therefore exposes `~/.ssh`, the tier keys, and every group's loans and keys.\n\nTo see it, run `podman inspect cs-sandbox-net-lender --format '{{json .Mounts}}'` on a host with a lent sandbox.","notes":[],"links":["SBX-095"]},{"id":"SBX-097","title":"A loan token works from any sandbox that reads it, not only its own","type":"defect","severity":"med","status":"closed","foundBy":"session agent, comparing the lender with another credential gateway","opened":"2026-10-18","resolved":"2026-10-18","stint":"lender-fixes","evidence":{"commits":["041be58"],"integrated":[],"verified":"go test ./internal/lend/ -count=1: the refusal tests in bind_test.go PASS, and 4 of them fail with status 200 when the binding check is removed. In TestCLILendBoundToItsSandboxLive on podman, a peer holding the owner's token gets 403 `wrong_sandbox` with 0 provider calls. The owner gets 200. The lent replay matrix ran 7 of 7 green on podman and on firecracker. On firecracker, codex-openai-lent needed one rerun, because Codex stopped on its upgrade screen before reaching the lender. The full `make ci` gate on the four lender commits together exited 0, with 14 of 14 agent replay cells passing on podman."},"resolution":"A lender honours a loan only from the address its sandbox's name resolves to on the group's DNS. It also refuses a loan minted in another group (R152a). It does not stop a member that forges its source address or poisons the lender's ARP.","details":"The lender accepts a loan token from any caller inside the boundary. A token is a bearer value that leaks through a readable credential file, an environment, a log or a shared repository. Any group member that finds one can spend the host's credential with it, and the lender's log then attributes the spend to the wrong sandbox.\n\nTo reproduce, copy the seeded credential from one lent sandbox into another in the same group and make a model call. The lender serves it.","notes":[],"links":["SBX-095"]},{"id":"SBX-098","title":"Nothing caps a sandbox's processes, CPU or memory, so a fleet of agents can starve the desktop","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, comparing with another agent sandbox","opened":"2026-10-19","resolved":"2026-10-19","stint":"sandbox-hardening","evidence":{"commits":["ec803b6","086f032"],"integrated":[],"verified":"On this 28-core host, a podman sandbox made with `--cpus 2 --mem 3072` read pids.max 8192, cpu.max `200000 100000` and memory.max 3221225472. Four busy loops were throttled, and a 4 GiB allocation was OOM-killed while the container stayed up. A microVM's scope sat under cs-sandbox.slice with CPUQuota 3s/s and TasksMax 1024, and kept both after stop and start. Under podman's cgroupfs manager, create succeeded outside the slice with the same container limits. TestCLINestedSandboxInVMLive and TestCLINestedRootlessPodmanLive PASS. The full `make ci` gate on the six commits together exited 0, with 14 of 14 agent replay cells passing on podman. `make test-agents-lent AGENTS_ENGINE=firecracker` passed 7 of 7."},"resolution":"Every sandbox runs under cs-sandbox.slice, capped at 75% of memory with no swap, all but an eighth of the cores, and a quarter of the kernel's tasks (R171). A podman sandbox gets a pids limit by default and takes `--cpus` and `--mem` as caps. The scope of a microVM is limited to its vCPUs plus one core (R130a).","details":"A podman sandbox ran with podman's default of 2048 pids and no CPU or memory cap. The scope of a microVM had a memory cap and nothing else. Ten agents building at once could take every core and all memory, and nothing bounded the fleet as a whole.","notes":[],"links":[]},{"id":"SBX-099","title":"Nothing restarts sshd in a sandbox, so a crashed sshd leaves it unreachable until a restart","type":"defect","severity":"med","status":"closed","foundBy":"session agent, comparing with another agent sandbox","opened":"2026-10-19","resolved":"2026-10-19","stint":"sandbox-hardening","evidence":{"commits":["de290f7"],"integrated":[],"verified":"On a real microVM, `pkill -x sshd` used to leave `exec` failing for 20 seconds without recovery. With the fix, one attempt failed and `exec` and `ssh` worked again 0.9 seconds later. Killing the vsock bridge, and the sshd supervisor itself, were each recovered too. A TERM sent to PID 1 in the guest now gives a clean reboot in 0.25 seconds. On podman, `ssh` was back 0.22 seconds after `pkill sshd`. The full `make ci` gate on the six commits together exited 0, with 14 of 14 agent replay cells passing on podman. `make test-agents-lent AGENTS_ENGINE=firecracker` passed 7 of 7."},"resolution":"sshd and the vsock bridge run under a small supervisor that restarts them with a backoff, on both engines (R99a, R131a). In a microVM, bash stays PID 1 and reaps orphans, and TERM to it syncs and reboots.","details":"The microVM's init ended in `exec socat`, so the vsock bridge was PID 1 and nothing watched sshd. If sshd died, `cs-sandbox ssh` and `exec` failed until the sandbox was restarted. A TERM sent to the bridge made the guest kernel panic. The podman entrypoint had the same gap, since it left sshd in the background unwatched. There, the ready file could also appear before sshd listened.","notes":[],"links":[]},{"id":"SBX-100","title":"Stopping a microVM always waits out an eight-second ssh timeout","type":"defect","severity":"low","status":"closed","foundBy":"session agent, comparing with another agent sandbox","opened":"2026-10-19","resolved":"2026-10-19","stint":"sandbox-hardening","evidence":{"commits":["b3f7136"],"integrated":[],"verified":"Five stops on a real microVM took 8.67 to 8.70 seconds before the fix and 0.92 to 1.0 seconds after. The guest's serial log still shows a clean reboot. go test ./internal/engine/ -count=20: TestRebootGuestReturnsWhenTheVMMExits PASS. The full `make ci` gate on the six commits together exited 0, with 14 of 14 agent replay cells passing on podman. `make test-agents-lent AGENTS_ENGINE=firecracker` passed 7 of 7."},"resolution":"`stop` runs the reboot ssh beside a poll of the VMM and cancels the ssh as soon as Firecracker exits (R73a).","details":"`stop` asks the guest to reboot over ssh. A guest that reboots sends no FIN, so ssh waited its full eight-second timeout after the VM was already gone.","notes":[],"links":[]},{"id":"SBX-101","title":"Waiting for a sandbox to become ready polls once a second, which adds up to a second to every create","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, comparing with another agent sandbox","opened":"2026-10-19","resolved":"2026-10-19","stint":"sandbox-hardening","evidence":{"commits":["f4c5dbd"],"integrated":[],"verified":"Over five creates per engine, a Firecracker create went from 4.4 to 5.1 seconds down to 3.6 to 4.1. A podman create went from 2.77 to 2.97 seconds down to 2.08 to 2.63. The full `make ci` gate on the six commits together exited 0, with 14 of 14 agent replay cells passing on podman. `make test-agents-lent AGENTS_ENGINE=firecracker` passed 7 of 7."},"resolution":"Readiness is polled every 50 ms with a backoff, capped at 100 ms for a microVM's serial log and at one second for podman's exec check (R138a).","details":"Both engines checked for readiness once a second, so a sandbox that became ready just after a check waited almost a second more.","notes":[],"links":[]},{"id":"SBX-102","title":"The pid-identity tests fail on macOS, where no start time or argv can be read","type":"defect","severity":"med","status":"closed","foundBy":"ci run 39376571877, on both macOS legs of build-test","opened":"2026-10-20","resolved":"2026-10-20","stint":"ci failures, 2026-10-20","evidence":{"commits":["b724833"],"integrated":[],"verified":"ci run 39492286708 on 7f5a40a passed, with build-test green on macos-15-intel and on the self-hosted macOS arm64 runner. Both legs had failed these six tests in run 39376571877. On Linux, `go test ./internal/proc ./internal/forward ./internal/engine -count=1` still runs and passes them."},"resolution":"The six tests skip where /proc is absent. On macOS a record is judged by its pid alone, as R170 allows, so they have nothing to check there. They still run on Linux.","details":"Six tests added in f5ada08 expect a recorded process to be told apart by its start time and argv. On macOS `internal/proc` has no `/proc` to read them from, so it judges a record by its pid alone, which R170 allows. The tests fail there: `TestFindTheRecordedProcess`, `TestFindRefusesAnotherProcess` and `TestSignalWithoutAPidfdRechecksTheIdentity` in `internal/proc`, `TestAReusedForwardPidIsDeadAndNeverSignalled` in `internal/forward`, and `TestAReusedVMMPidIsNotTheMicroVM` and `TestAVMMWithAnotherStartTimeIsNotTheRecordedOne` in `internal/engine`. Every push to main fails `ci` until they are fixed.","notes":[{"date":"2026-10-20","text":"b724833 skips the six tests where /proc is absent. On Linux they still run and pass, and the three packages compile for darwin. The macOS legs of `ci` have not run it yet, so the record stays open until they pass."}],"links":["SBX-002"]},{"id":"SBX-103","title":"cs-codex-turn can take Codex's newer-model offer for a screen it does not know, and fail the turn","type":"defect","severity":"med","status":"closed","foundBy":"base-images runs 38198858723 and 39192761879, in the amd64 smoke of the candidate","opened":"2026-10-20","resolved":"2026-10-20","stint":"ci failures, 2026-10-20","evidence":{"commits":["b99d37f"],"integrated":[],"verified":"`go test ./internal/cli/ -run 'TestCodexTurnAnswersADialogOrSaysWhoMust|TestClaudeTurnAnswersADialogOrSaysWhoMust' -count=1` passes on b99d37f. Its new cases show a loading screen for two captures before the dialog. On the drivers before b99d37f they fail with `needs a person`, as the base-images runs did. The full `make ci` gate exited 0, with 14 of 14 agent replay cells passing on podman."},"resolution":"Both turn drivers capture the screen once per look and make every judgement about that one capture. A dialog that opens between two looks is seen whole on the next one. cs-claude-turn had the same shape and gets the same change.","details":"Codex draws its main screen first and opens the `Meet GPT-6 Sol` offer once its model catalog loads. `detect_state` captured the pane once to look for a known dialog and again to look for an unknown one. When the offer appeared between the two captures, the second saw its `enter/esc confirm ·` footer and the driver failed the turn with `remote codex is on a screen that needs a person`, without answering. The codex-openai-shared replay failed this way in two weekly base-images runs. A loaded host widens the gap between captures, so it shows up in the smoke run, where four agent sandboxes share one runner. In a container limited to two CPUs with two busy loops, the race reproduced on the first launch.","notes":[],"links":["SBX-085","SBX-090"]},{"id":"SBX-104","title":"create boots a disk that rm kept, whatever image it names, and does not say so","type":"defect","severity":"med","status":"closed","foundBy":"session agent, comparing tool checksums inside a sandbox recreated after an image rebuild","opened":"2026-10-23","resolved":"2026-10-23","stint":"kept-disk fix, 2026-10-23","evidence":{"commits":["53a42be"],"integrated":[],"verified":"On real microVMs, a sandbox was made from one image, given a marker file, and removed with `rm`. A create under a second image was refused, and the message named both image ids. A create under the first image printed the image the kept disk came from, and the marker was still there. With `--reuse-kept-disk`, a create under the second image booted the kept disk and printed both images. After `destroy`, a create gave a fresh disk with no marker. `make check` on the fix passed, with every package `ok` and 14 cassettes replaying."},"resolution":"The copy that makes a microVM's root disk records the image id in `rootfs.image` beside it, and `rm` keeps that file with the disk. Before it boots a kept disk, `create` prints which image made it. It refuses a disk from another image unless given `--reuse-kept-disk` (R75a). A disk kept before this change records no image, reads as unknown, and is reused as before.","details":"`cs-sandbox rm \u003cname>` keeps a microVM's root disk, `rootfs.ext4`, so that a later `create \u003cname>` brings the sandbox back with its data. In `internal/engine/firecracker.go`, `Create` sets `reuseRootfs` when that file exists and then skips `ReflinkRootfs`. The kept disk boots whatever image `--image` or `CS_SANDBOX_IMAGE` names now.\n\nOn the microVM engine that disk is the whole root filesystem, not only the home directory. A sandbox recreated after a new image was built therefore runs the old image's agent tools and hooks. Nothing in create's output says it reused a kept disk. Nothing records which image the disk came from either, because `rm` deletes `state.json` and keeps only `rootfs.ext4`. So the mismatch can be neither noticed nor refused.\n\nTo reproduce it, create `\u003cname>` under one image and `rm \u003cname>`. Build or select a different image, then run `create \u003cname>` again. The agent tools inside the sandbox carry the first image's file dates and checksums. Comparing checksums inside the sandbox was the only way it showed.\n\nRebuilding the image is how a host takes new tool versions, and a recreate silently undoes that. Create should say when it reuses a kept disk and name the image the disk was made from. When that image differs from the one named now, it should refuse unless told to reuse anyway, or at least warn. The podman engine keeps only the home volume and takes the rest from the image named now, so this record concerns the microVM engine.","notes":[],"links":["SBX-011","SBX-014"]},{"id":"SBX-105","title":"An agent compacts a long conversation on its own, and its caller cannot hand it off first","type":"improvement","severity":"med","status":"closed","foundBy":"repository owner, asking for a way to manage context in long-running campaign members","opened":"2026-10-25","resolved":"2026-10-25","stint":"context hand-off, 2026-10-17 to 2026-10-25","evidence":{"com
