version: "2"

# golangci-lint reports at most 3 instances of the same finding and 50 per
# linter unless told otherwise, and says nothing about what it withheld. One
# repository here read as 7 findings and had 46. A truncated report is worse
# than a long one: the count looks small, the tail looks fixed, and the gate
# goes green on a repository nobody has actually swept.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# The Go counterpart to `cs-lint docs`, and shared the same way: this file stays
# byte-identical across the family, so a change to a check goes back into the
# shared copy and is copied out again. A project's own exception does not belong
# here. It goes in a `//nolint:<linter> // <reason>` at the site, where the
# reason sits beside the code that earned it.
#
# The default set (errcheck, govet, ineffassign, staticcheck, unused) catches
# what is wrong. Everything added below catches what is redundant: a stdlib call
# written out by hand, a parameter nothing reads, a loop the language now has a
# word for. That is the half a reviewer would otherwise spend attention on.
#
# Every check disabled here was disabled after reading what it reported on real
# repositories, and the reason is recorded beside it. A linter that cries wolf
# gets ignored, and then it protects nothing.
#
# golangci-lint has no `deadcode`: `unused` reasons one package at a time, so a
# function whose only caller lives in another package still looks used to it.
# Run golang.org/x/tools/cmd/deadcode separately; the Makefile has a target.

linters:
  enable:
    - dupl # copy-paste, the shape a helper was meant to prevent
    - gocritic # a broad set of correctness and style checks
    - modernize # stdlib and language features newer than the code
    - perfsprint # Sprintf and += where a cheaper call says the same thing
    - revive # structure rules, configured below
    - unparam # parameters and results nothing reads
    - usestdlibvars # literals the stdlib already names

  settings:
    dupl:
      # Tighter than the 150 default. A tree that starts clean at this threshold
      # stays clean, and anything reported is new duplication rather than a
      # backlog nobody will work through.
      threshold: 100

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - opinionated
      disabled-checks:
        # Wants `err :=` inside an `if` wherever the previous value is dead. In
        # a function with a NAMED error return whose deferred cleanup reads it,
        # taking that advice shadows the return: the deferred block sees nil,
        # skips its rollback, and leaves behind whatever the function had built
        # so far. That idiom is common and the check cannot see it, so the
        # advice is wrong exactly where the stakes are highest.
        - sloppyReassign
        # Wants filepath.Join("/", "home", user) over filepath.Join("/home",
        # user). The second one reads like the path it builds.
        - filepathJoin
        - regexpSimplify # `[0-9]` beats `\d` in a regex a reader has to check
        # Judgement calls, and re-litigating one at every review costs more than
        # either answer is worth.
        - paramTypeCombine # grouping parameters can hide what each one is for
        - unnamedResult # named results are noise on a two-value return
        - importShadow # `path`, `url` and friends are good local names
        - builtinShadow
        - commentedOutCode # too eager on comments that carry a shell line
        - whyNoLint
        # hugeParam and rangeValCopy belong on this list by temperament — a big
        # struct passed by value is often the clearer call — but naming them
        # here earns "no need to disable: it's already disabled" on every run.
        # The enabled-tags above do not reach them.

    staticcheck:
      checks:
        - all
        # golangci-lint's own defaults, kept because dropping them turns every
        # doc comment and initialism into a finding.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan's law. `!(a >= x && a <= y || ...)` states a rule once and
        # negates it; the expanded form states it twice, inverted.
        - -QF1001

    revive:
      # Naming down to capitalization is deliberately absent: `confusing-naming`
      # reads NewFoo/newFoo and Acquire/acquire as mistakes, and those are the
      # exported-wrapper idiom. perfsprint's concat-loop is what actually
      # catches a stdlib helper rewritten under a second name.
      rules:
        - name: identical-branches
        - name: duplicated-imports
        - name: unnecessary-stmt
        - name: redundant-import-alias
        - name: unreachable-code
        - name: waitgroup-by-value

  exclusions:
    # `generated` alone for the mode: the default `lax` also waives whole
    # categories inside tests, which is where padding tends to collect.
    generated: strict
    presets:
      # errcheck on Close, Flush, os.Remove and the fmt.Fprint* family. These
      # are the two shapes that recur: a file opened only to read, and a handle
      # passed to something that owns it afterwards. Neither has anything
      # buffered to lose, and a write to a terminal that has gone away leaves
      # nothing to recover. Spelling each one `_ =` wraps a dozen defers in
      # closures to say what this says once.
      - std-error-handling
    rules:
      # A table test and the function it drives read alike by design, and a
      # fixture repeated across two cases is clearer than one hoisted into a
      # helper the reader has to go find.
      - path: _test\.go
        linters:
          - dupl
